# Constrói a app Android «Contador de Chamadas» (ferramentas/contador-chamadas) e grava o APK no mesmo ramo:
# ferramentas/contador-chamadas/ContadorChamadas.apk. Corre sozinho quando o código da app muda.
name: contador-apk
on:
  push:
    paths:
      - 'ferramentas/contador-chamadas/app/**'
      - 'ferramentas/contador-chamadas/*.gradle'
      - 'ferramentas/contador-chamadas/gradle.properties'
      - '.github/workflows/contador-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Construir
        working-directory: ferramentas/contador-chamadas
        run: gradle --no-daemon assembleRelease
      - name: Gravar o APK no ramo
        run: |
          cp ferramentas/contador-chamadas/app/build/outputs/apk/release/app-release.apk ferramentas/contador-chamadas/ContadorChamadas.apk
          git config user.name "contador-apk"
          git config user.email "actions@users.noreply.github.com"
          git add ferramentas/contador-chamadas/ContadorChamadas.apk
          git commit -m "APK do Contador de Chamadas (${GITHUB_SHA::7})" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

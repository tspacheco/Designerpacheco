<!DOCTYPE html><html lang="en"><head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <title>OnEvent</title>
    <meta charset="UTF-8">
    <meta name="description" content="Website under maintenance">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <style>
        body {
            margin: 0;
            padding: 40px 0; /* Mai mult spațiu sus și jos */
            font-family: Verdana, sans-serif;
            line-height: 30px;
            background-color: rgb(66, 71, 72);
            text-align: center;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
        }

        .icon-center {
            margin-bottom: 20px;
        }

        .icon-center i {
            color: #201f1f;
        }

        .content {
            text-align: center;
            padding: 20px;
        }

        .txtwhite {
            font-size: 24px;
            color: #bebebe;
            margin-bottom: 20px;
        }

        .menu {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            background-color: #3a3f41;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 40px;
            max-width: 600px;
        }

        .menu-item {
            width: 100%;
        }

        .menu-item a {
            text-decoration: none;
            color: #fff;
            font-size: 18px;
            display: flex;
            align-items: center;
            padding: 10px 15px;
            background-color: #4a4f52;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }

        .menu-item a:hover {
            background-color: #5a5f62;
        }

        .menu-item i {
            margin-right: 10px;
            color: #ffd400;
        }

        .logo-container {
            margin-bottom: 20px;
        }

        .imgcenterLogo {
            width: 150px;
            margin-bottom: 20px;
        }

        .social-media {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .social-media a {
            color: #fff;
            text-decoration: none;
            font-size: 24px;
        }

        .social-media a:hover {
            color: #ffd400;
        }

        /* Stiluri pentru dispozitivele mobile */
        @media only screen and (max-width: 600px) {
            .txtwhite {
                font-size: 18px;
            }

            .menu {
                grid-template-columns: 1fr;
            }

            .menu-item a {
                font-size: 16px;
            }

            .imgcenterLogo {
                width: 100px;
            }

            .social-media a {
                font-size: 20px;
            }
        }

        /* Stiluri pentru tablete */
        @media only screen and (min-width: 601px) and (max-width: 1024px) {
            .menu {
                grid-template-columns: 1fr 1fr;
                gap: 15px;
            }

            .menu-item a {
                font-size: 17px;
            }

            .imgcenterLogo {
                width: 120px;
            }
        }
    </style>
</head>
<body class="body">
    <div class="icon-center">
        <i class="fa-regular fa-face-frown fa-9x"></i> <!-- Icoana tristă Font Awesome -->
    </div>

    <div class="content">
        <p class="txtwhite">Această pagină nu mai există. Puteți accesa una dintre opțiunile de mai jos:</p>
    </div>

    <div class="menu">
        <div class="menu-item">
            <a href="https://www.onevent.ro/orase/bucuresti/toate-categoriile/weekend/">
                <i class="fas fa-angle-right"></i>
                <span>Bucuresti</span>
            </a>
        </div>

        <div class="menu-item">
            <a href="https://www.onevent.ro/orase/brasov/toate-categoriile/weekend/">
                <i class="fas fa-angle-right"></i>
                <span>Brasov</span>
            </a>
        </div>

        <div class="menu-item">
            <a href="https://www.onevent.ro/orase/cluj/toate-categoriile/weekend/">
                <i class="fas fa-angle-right"></i>
                <span>Cluj-Napoca</span>
            </a>
        </div>

        <div class="menu-item">
            <a href="https://www.onevent.ro/orase/constanta/toate-categoriile/weekend/">
                <i class="fas fa-angle-right"></i>
                <span>Constanta</span>
            </a>
        </div>

        <div class="menu-item">
            <a href="https://www.onevent.ro/orase/iasi/toate-categoriile/weekend/">
                <i class="fas fa-angle-right"></i>
                <span>Iasi</span>
            </a>
        </div>

        <div class="menu-item">
            <a href="https://www.onevent.ro/orase/timisoara/toate-categoriile/weekend/">
                <i class="fas fa-angle-right"></i>
                <span>Timisoara</span>
            </a>
        </div>
    </div>

    <div class="logo-container">
        <img src="/OnEvent/logo.png" class="imgcenterLogo">
    </div>

    <div class="social-media">
        <a href="https://www.facebook.com/OnEvent" target="_blank"><i class="fab fa-facebook-f"></i></a>
        <a href="https://www.instagram.com/OnEvent" target="_blank"><i class="fab fa-instagram"></i></a>
        <a href="https://www.twitter.com/OnEvent" target="_blank"><i class="fab fa-twitter"></i></a>
        <a href="https://www.linkedin.com/company/OnEvent" target="_blank"><i class="fab fa-linkedin-in"></i></a>
    </div>



</body></html>

<!DOCTYPE html><html lang="pt-BR"><head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Página não encontrada | Viver de IA</title>
    <style>
      /* Página estática servida pelo CDN — não carrega Geist nem o bundle,
         então fica em system-ui com os valores do DS resolvidos à mão. */
      :root {
        color-scheme: light;
        --navy: #0a1f3b;
        --ink: #0a1f3b;
        --body: #3f4756;
        --muted: #5f6673;
        --line: #e2e5ea;
        --bg: #f7f8fa;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 20px;
        background: var(--bg);
        color: var(--ink);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(100%, 560px);
        padding: 40px 32px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: #fff;
        box-shadow: 0 18px 48px rgba(10, 31, 59, 0.08);
        text-align: center;
      }

      .eyebrow {
        margin: 0 0 16px;
        color: var(--navy);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(30px, 6vw, 44px);
        font-weight: 600;
        line-height: 1.08;
        letter-spacing: -0.03em;
        color: var(--navy);
      }

      p {
        margin: 18px 0 32px;
        color: var(--body);
        font-size: 16px;
        line-height: 1.6;
      }

      nav {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
      }

      a {
        min-height: 44px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0 20px;
        border-radius: 999px;
        border: 1px solid var(--line);
        color: var(--ink);
        font-size: 14px;
        font-weight: 500;
        text-decoration: none;
      }

      a:first-child {
        border-color: var(--navy);
        background: var(--navy);
        color: #fff;
      }

      @media (max-width: 520px) {
        main {
          padding: 28px 24px;
        }

        nav {
          display: grid;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Erro 404</p>
      <h1>Página não encontrada</h1>
      <p>A página que você procura não existe ou foi movida. Volte para o início e continue de onde parou.</p>
      <nav aria-label="Links principais">
        <a href="/">Voltar para a home</a>
        <a href="/solucoes">Ver soluções</a>
        <a href="/blog">Ler o blog</a>
      </nav>
    </main>
  

</body></html>

      h+=`<div class="btn" style="${op(bk,(1-bk)*20,(.94+.06*bk)*pulse)}">${L.btn}</div>`;
      h+=`<div class="url" style="${op(fi(t,S4+2.05,.4))}">${L.url}</div>`;
      h+=`<div class="fe" style="${op(fi(t,S4+2.6,.45),(1-fi(t,S4+2.6,.45))*16)}">${L.fe}</div>`;
      h+=`</div>`;
    }
    h+=`<div class="marca">${I.logo}<span>Pacheco Studios</span></div>`;
    h+=`</div>`;
  }
  document.getElementById('s').innerHTML=h;
  // títulos de uma linha: encolher até caberem em 920 px (o romeno é mais comprido)
  document.querySelectorAll('.fit').forEach(el=>{let fs=parseFloat(el.style.fontSize);while(el.scrollWidth>el.clientWidth+1&&fs>48){fs-=2;el.style.fontSize=fs+'px'}});
}
window.render=render; window.DUR=DUR;
render(parseFloat(new URLSearchParams(location.search).get('t')||'9.6'));
</script>
</body>

<!DOCTYPE html>
<!-- Pacheco Studios — destaque "Trabalhos" OPÇÃO C: poster tipográfico (1080x1920).
     Parede de nomes em tipo gigante; para editar, mexer nas .l (linha). -->
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<title>Trabalhos — Opção C (poster)</title>
<style>
@font-face{font-family:"Archivo Black";font-weight:400;src:url("fonts/archivo-black.woff2") format("woff2")}
@font-face{font-family:"Space Mono";font-weight:400;src:url("fonts/space-mono-400.woff2") format("woff2")}
@font-face{font-family:"Space Mono";font-weight:700;src:url("fonts/space-mono-700.woff2") format("woff2")}
</style>
<style>
:root{--bg:#141210;--ink:#EFEAE3;--laranja:#E8622C;--dim:rgba(239,234,227,.5)}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:var(--bg);color:var(--ink);position:relative;overflow:hidden;font-family:"Space Mono",monospace}
.glow{position:absolute;right:-200px;top:30%;width:820px;height:820px;background:radial-gradient(circle,rgba(232,98,44,.14),transparent 62%)}
.frame{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;padding:120px 96px 110px}
.top{display:flex;justify-content:space-between;align-items:baseline}
.top .tag{color:var(--laranja);font-size:30px;font-weight:700;letter-spacing:.42em}
.top .num{color:var(--dim);font-size:30px;letter-spacing:.2em}
.sub{margin-top:110px;font-size:31px;line-height:1.55;color:var(--dim);max-width:760px}
.wall{margin-top:70px;font-family:"Archivo Black",sans-serif;text-transform:uppercase;line-height:1.02}
.wall .l{display:block;white-space:nowrap}
.l1{font-size:96px}
.l2{font-size:74px;color:transparent;-webkit-text-stroke:2.5px rgba(239,234,227,.8)}
.l3{font-size:88px;color:var(--laranja)}
.l4{font-size:80px}
.l5{font-size:70px;color:transparent;-webkit-text-stroke:2.5px var(--laranja)}
.l6{font-size:84px}
.l7{font-size:66px;color:transparent;-webkit-text-stroke:2.5px rgba(239,234,227,.8)}
.you{margin-top:76px;display:inline-flex;align-self:flex-start;border:2.5px dashed var(--laranja);border-radius:999px;color:var(--laranja);font-size:33px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;padding:28px 52px}
.foot{margin-top:auto;border-top:2px solid rgba(239,234,227,.16);padding-top:44px;display:flex;justify-content:space-between;align-items:center;font-size:30px;letter-spacing:.24em}
.foot .brand{display:flex;align-items:center;gap:18px}
.foot .dot{width:16px;height:16px;border-radius:50%;background:var(--laranja)}
.foot .ig{color:var(--dim)}
</style>
</head>
<body>
<div class="glow"></div>
<div class="frame">
  <div class="top"><span class="tag">TRABALHOS</span><span class="num">03&nbsp;/&nbsp;05</span></div>
  <p class="sub">Construímos presença online para negócios reais. Estes já trabalham connosco:</p>
  <div class="wall">
    <span class="l l1">Grupo Naval</span>
    <span class="l l2">Simona's</span>
    <span class="l l3">Hanam KBBQ</span>
    <span class="l l4">Barbearia do Cão</span>
    <span class="l l5">ProBuilders</span>
    <span class="l l6">Muxagata</span>
    <span class="l l7">Olá Kathmandu</span>
  </div>
  <span class="you">O teu negócio? →</span>
  <div class="foot">
    <span class="brand"><span class="dot"></span>PACHECO STUDIOS</span>
    <span class="ig">@PACHECOSTUDIOSPT</span>
  </div>
</div>
</body>
</html>

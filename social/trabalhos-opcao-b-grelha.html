<!DOCTYPE html>
<!-- Pacheco Studios — destaque "Trabalhos" OPÇÃO B: grelha de cartões (1080x1920).
     Aguenta a lista completa de clientes; para editar, mexer nos .tile. -->
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<title>Trabalhos — Opção B (grelha)</title>
<style>
@font-face{font-family:"Archivo Black";font-weight:400;src:url("fonts/archivo-black.woff2") format("woff2")}
@font-face{font-family:"Space Mono";font-weight:400;src:url("fonts/space-mono-400.woff2") format("woff2")}
@font-face{font-family:"Space Mono";font-weight:700;src:url("fonts/space-mono-700.woff2") format("woff2")}
</style>
<style>
:root{--bg:#141210;--ink:#EFEAE3;--laranja:#E8622C;--dim:rgba(239,234,227,.5)}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:var(--bg);color:var(--ink);position:relative;overflow:hidden;font-family:"Space Mono",monospace}
.glow{position:absolute;left:-240px;bottom:-180px;width:820px;height:820px;background:radial-gradient(circle,rgba(232,98,44,.13),transparent 62%)}
.frame{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;padding:120px 96px 110px}
.top{display:flex;justify-content:space-between;align-items:baseline}
.top .tag{color:var(--laranja);font-size:30px;font-weight:700;letter-spacing:.42em}
.top .num{color:var(--dim);font-size:30px;letter-spacing:.2em}
h1{font-family:"Archivo Black",sans-serif;font-size:84px;line-height:1.07;margin-top:130px;text-transform:uppercase}
h1 .o{color:var(--laranja)}
.grid{margin-top:96px;display:grid;grid-template-columns:1fr 1fr;gap:26px}
.tile{border:2.5px solid rgba(239,234,227,.35);border-radius:22px;padding:44px 40px;min-height:190px;display:flex;flex-direction:column;justify-content:space-between}
.tile .name{font-family:"Archivo Black",sans-serif;font-size:37px;text-transform:uppercase;line-height:1.15}
.tile .meta{font-size:23px;letter-spacing:.24em;color:var(--dim);text-transform:uppercase;margin-top:22px}
.tile.you{background:var(--laranja);border-color:var(--laranja);color:#141210}
.tile.you .meta{color:rgba(20,18,16,.7)}
.foot{margin-top:auto;border-top:2px solid rgba(239,234,227,.16);padding-top:44px;display:flex;justify-content:space-between;align-items:center;font-size:30px;letter-spacing:.24em}
.foot .brand{display:flex;align-items:center;gap:18px}
.foot .dot{width:16px;height:16px;border-radius:50%;background:var(--laranja)}
.foot .ig{color:var(--dim)}
</style>
</head>
<body>
<div class="glow"></div>
<div class="frame">
  <div class="top"><span class="tag">TRABALHOS</span><span class="num">03&nbsp;/&nbsp;05</span></div>
  <h1>Onde o trabalho <span class="o">ganha vida</span>.</h1>
  <div class="grid">
    <div class="tile"><span class="name">Grupo Naval</span><span class="meta">Olhão</span></div>
    <div class="tile"><span class="name">Simona's O Bom Paladar</span><span class="meta">Loulé</span></div>
    <div class="tile"><span class="name">Hanam Korean BBQ</span><span class="meta">Quarteira</span></div>
    <div class="tile"><span class="name">Barbearia do Cão</span><span class="meta">Barbearia</span></div>
    <div class="tile"><span class="name">ProBuilders</span><span class="meta">Construção</span></div>
    <div class="tile"><span class="name">Gelataria Muxagata</span><span class="meta">Gelataria</span></div>
    <div class="tile"><span class="name">Olá Kathmandu</span><span class="meta">Restaurante</span></div>
    <div class="tile you"><span class="name">O teu negócio?</span><span class="meta">Fala connosco →</span></div>
  </div>
  <div class="foot">
    <span class="brand"><span class="dot"></span>PACHECO STUDIOS</span>
    <span class="ig">@PACHECOSTUDIOSPT</span>
  </div>
</div>
</body>
</html>

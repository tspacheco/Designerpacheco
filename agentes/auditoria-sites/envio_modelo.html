<title>Envio Raio-X Iași</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout: lista de cartões para o polegar, cabeçalho fixo com o progresso, um botão principal por cartão (WhatsApp). */
:root{
  --bg:#F4F0E9;--card:#FFFFFF;--fg:#1A1713;--mut:#6A6358;--linha:#DDD6C9;
  --acento:#D9531C;--acento-fg:#FFFFFF;--ok:#2F7D5B;--ok-bg:#E3F0E9;--sec:#EAE4D8;
  --display:"Archivo Black",system-ui,sans-serif;--corpo:"Archivo",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141210;--card:#1F1C18;--fg:#EFEAE3;--mut:#A39B8E;--linha:#34302A;
  --acento:#F0733B;--acento-fg:#1A1713;--ok:#6CC49C;--ok-bg:#1D2E26;--sec:#2B2721;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141210;--card:#1F1C18;--fg:#EFEAE3;--mut:#A39B8E;--linha:#34302A;
  --acento:#F0733B;--acento-fg:#1A1713;--ok:#6CC49C;--ok-bg:#1D2E26;--sec:#2B2721;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:400 16px/1.4 var(--corpo);padding-inline:16px;padding-block:0 32px;max-width:640px;margin-inline:auto}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:14px 10px;z-index:2;border-bottom:1px solid var(--linha);margin-inline:-16px;padding-inline:16px}
h1{font:400 20px/1.1 var(--display);text-transform:uppercase;letter-spacing:.01em}
.sub{color:var(--mut);font-size:13px;margin-top:4px}
.barra{display:flex;align-items:center;gap:12px;margin-top:10px}
.prog{flex:1;height:6px;background:var(--sec);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--ok);transition:width .25s}
.cont{font:700 13px var(--mono);font-variant-numeric:tabular-nums;min-width:4.5ch;text-align:right}
.filtros{display:flex;gap:8px;margin-top:10px}
.filtros button{flex:1;min-height:40px;border:1px solid var(--linha);background:var(--card);color:var(--fg);border-radius:8px;font:600 14px var(--corpo)}
.filtros button[aria-pressed=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
ul{list-style:none;padding:0;margin:16px 0 0;display:grid;gap:14px}
li{background:var(--card);border:1px solid var(--linha);border-radius:10px;padding:14px;display:grid;gap:10px;min-width:0}
li.feito{opacity:.62}
.topo{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.nome{font:400 18px/1.15 var(--display);text-transform:uppercase;min-width:0;overflow-wrap:anywhere}
.meta{color:var(--mut);font-size:13px;margin-top:3px}
.n{font:700 12px var(--mono);color:var(--mut);padding-top:3px}
.tel{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tel b{font:700 16px var(--mono);font-variant-numeric:tabular-nums;user-select:all}
.tag{font:700 11px var(--corpo);letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:5px;background:var(--sec);color:var(--mut)}
.acoes{display:grid;gap:8px}
.acoes a,.acoes button{display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:9px;font:700 15px var(--corpo);text-decoration:none;border:1px solid var(--linha);background:var(--sec);color:var(--fg);cursor:pointer}
.acoes .prim{background:var(--acento);color:var(--acento-fg);border-color:var(--acento);min-height:52px;font-size:16px}
.par{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.marca{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:600;font-size:15px}
.marca input{width:24px;height:24px;accent-color:var(--ok)}
details summary{color:var(--mut);font-size:13px;cursor:pointer;min-height:32px;display:flex;align-items:center}
details p{font-size:14px;white-space:pre-wrap;background:var(--sec);border-radius:8px;padding:10px;margin-top:6px;overflow-wrap:anywhere;user-select:all}
.aviso{font-size:13px;color:var(--mut);margin-top:12px}
:focus-visible{outline:3px solid var(--acento);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header>
  <h1>Raio-X · Lote 2</h1>
  <p class="sub">20 negócios de Iași. WhatsApp abre com a mensagem e o link do PDF já escritos.</p>
  <div class="barra"><div class="prog"><i id="prog"></i></div><span class="cont" id="cont">0/20</span></div>
  <div class="filtros" role="group" aria-label="Filtro">
    <button type="button" id="f-todos" aria-pressed="true">Todos</button>
    <button type="button" id="f-falta" aria-pressed="false">Por enviar</button>
  </div>
</header>
<ul id="lista"></ul>
<p class="aviso">«Enviado» fica guardado só neste telemóvel. O WhatsApp só abre conversa se o número tiver WhatsApp; se não abrir, usa Ligar. Os fixos não têm WhatsApp: liga e pede onde mandar o PDF.</p>

<script>
const DADOS = /*DADOS*/[];
const CHAVE = "raiox-lote2-enviados";
let feitos = {};
try { feitos = JSON.parse(localStorage.getItem(CHAVE) || "{}"); } catch (e) {}
const guardar = () => { try { localStorage.setItem(CHAVE, JSON.stringify(feitos)); } catch (e) {} };
let soFalta = false;
const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.textContent = h; return e; };

async function copiar(texto, botao) {
  const antes = botao.textContent;
  try { await navigator.clipboard.writeText(texto); botao.textContent = "Copiado"; }
  catch (e) { botao.textContent = "Seleciona e copia"; }
  setTimeout(() => botao.textContent = antes, 1600);
}

function desenhar() {
  const lista = document.getElementById("lista");
  lista.textContent = "";
  DADOS.forEach((d, i) => {
    const feito = !!feitos[d.pdf];
    if (soFalta && feito) return;
    const li = el("li", feito ? "feito" : "");
    const topo = el("div", "topo");
    const bloco = el("div");
    bloco.append(el("div", "nome", d.nome));
    bloco.append(el("div", "meta", `${d.cat} · ${d.google}★${d.aval ? " · " + d.aval + " avaliações" : ""}`));
    topo.append(bloco, el("span", "n", String(i + 1).padStart(2, "0")));
    li.append(topo);

    const tel = el("div", "tel");
    tel.append(el("b", "", d.tel.replace(/^\+40(\d{3})(\d{3})(\d{3})$/, "+40 $1 $2 $3")));
    tel.append(el("span", "tag", d.fixo ? "Fixo: ligar" : "WhatsApp: ?"));
    li.append(tel);

    const ac = el("div", "acoes");
    if (d.wa) {
      const a = el("a", "prim", "Abrir WhatsApp com a mensagem");
      a.href = d.wa; a.target = "_blank"; a.rel = "noopener";
      ac.append(a);
    }
    const par = el("div", "par");
    const pdf = el("a", "", "Ver PDF"); pdf.href = d.pdf; pdf.target = "_blank"; pdf.rel = "noopener";
    const lig = el("a", "", "Ligar"); lig.href = "tel:" + d.tel;
    par.append(pdf, lig);
    ac.append(par);
    const cp = el("button", "", "Copiar mensagem e link"); cp.type = "button";
    cp.addEventListener("click", () => copiar(d.texto, cp));
    ac.append(cp);
    li.append(ac);

    const det = el("details");
    det.append(el("summary", "", "Ver mensagem e morada"));
    det.append(el("p", "", d.msg + "\n\n" + (d.morada ? "Morada: " + d.morada : "")));
    li.append(det);

    const lab = el("label", "marca");
    const cb = el("input"); cb.type = "checkbox"; cb.checked = feito; cb.id = "env-" + i;
    cb.addEventListener("change", () => { if (cb.checked) feitos[d.pdf] = 1; else delete feitos[d.pdf]; guardar(); desenhar(); });
    lab.append(cb, el("span", "", "Enviado"));
    lab.htmlFor = cb.id;
    li.append(lab);
    lista.append(li);
  });
  const n = DADOS.filter(d => feitos[d.pdf]).length;
  document.getElementById("cont").textContent = n + "/" + DADOS.length;
  document.getElementById("prog").style.width = (100 * n / DADOS.length) + "%";
}
const filtro = falta => {
  soFalta = falta;
  document.getElementById("f-todos").setAttribute("aria-pressed", String(!falta));
  document.getElementById("f-falta").setAttribute("aria-pressed", String(falta));
  desenhar();
};
document.getElementById("f-todos").addEventListener("click", () => filtro(false));
document.getElementById("f-falta").addEventListener("click", () => filtro(true));
desenhar();
</script>

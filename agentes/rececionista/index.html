<title>Rececionista Pacheco</title>
<meta name="description" content="Protótipo da rececionista com IA da Pacheco Studios: responde, marca e passa a uma pessoa quando não sabe.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap">
<style>
/* Palco da marca (carvão) com um telemóvel ao centro; à direita, o que o dono vê. Um só visual, escuro. */
:root{
  --carvao:#141210; --carvao-2:#1C1916; --carvao-3:#26221E;
  --osso:#EFEAE3; --cinza:#A5A19B; --laranja:#E8622C; --verde:#5FBF8A;
  --linha:rgba(239,234,227,.12);
  --app-fundo:#ECE6DC; --app-papel:#FFFFFF; --app-tinta:#1D1B19; --app-cinza:#6B665F; --app-linha:#DDD5C9;
  --biz:#2C3E5C; --biz-claro:#DCE4EF;
  --f-display:"Archivo Black","Arial Black",Impact,sans-serif;
  --f-texto:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"Space Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--carvao);color:var(--osso);font-family:var(--f-texto);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--laranja);outline-offset:2px}

.palco{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,380px) minmax(0,1fr);gap:40px;align-items:start;max-width:1280px;margin:0 auto;padding:40px 24px 56px}
.intro,.dono{min-width:0}
.intro{padding-top:24px;display:flex;flex-direction:column;gap:22px}
.etiqueta{font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--cinza);margin:0}
.etiqueta b{color:var(--laranja);font-weight:400}
h1{font-family:var(--f-display);font-weight:400;text-transform:uppercase;font-size:clamp(34px,4.2vw,54px);line-height:.95;letter-spacing:-.01em;margin:0;text-wrap:balance}
h1 .ponto{color:var(--laranja)}
.lead{margin:0;color:var(--cinza);max-width:38ch;font-size:16px}
.lead strong{color:var(--osso);font-weight:600}
.grupo{display:flex;flex-direction:column;gap:8px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{background:transparent;border:1px solid var(--linha);border-radius:999px;padding:8px 14px;font-size:14px;color:var(--cinza);transition:background .2s,color .2s,border-color .2s}
.seg button:hover{color:var(--osso);border-color:rgba(239,234,227,.3)}
.seg button[aria-checked="true"]{background:var(--osso);color:var(--carvao);border-color:var(--osso);font-weight:600}
.modo{display:inline-flex;align-items:center;gap:10px;font-family:var(--f-mono);font-size:12px;color:var(--cinza);background:var(--carvao-2);border:1px solid var(--linha);border-radius:10px;padding:10px 12px;text-align:left;line-height:1.4}
.modo .luz{width:8px;height:8px;border-radius:50%;background:var(--cinza);flex:none}
.modo[data-modo="ia"] .luz{background:var(--verde);box-shadow:0 0 0 4px rgba(95,191,138,.18)}
.modo[data-modo="ia"]{color:var(--osso)}
.modo small{display:block;color:var(--cinza);font-size:11px}

/* ---------- telemóvel ---------- */
.tel-col{display:flex;flex-direction:column;align-items:center;gap:14px}
.tel{width:min(380px,100%);height:min(760px,calc(100svh - 40px));min-height:560px;background:#0A0908;border-radius:52px;padding:11px;position:relative;
  box-shadow:0 0 0 1.5px #3A342E,0 0 0 4px #0A0908,0 40px 80px -20px rgba(0,0,0,.7),0 0 120px -30px rgba(232,98,44,.25)}
.ecra{width:100%;height:100%;border-radius:42px;overflow:hidden;background:var(--app-fundo);color:var(--app-tinta);display:flex;flex-direction:column;position:relative}
.ilha{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:104px;height:30px;border-radius:20px;background:#000;z-index:5}
.barra{display:flex;justify-content:space-between;align-items:center;padding:14px 28px 6px;font-size:14px;font-weight:600;height:46px;flex:none;background:var(--app-papel)}
.barra svg{display:block}
.barra .icons{display:flex;gap:5px;align-items:center}
.app-topo{display:flex;align-items:center;gap:10px;padding:6px 14px 10px;background:var(--app-papel);border-bottom:1px solid var(--app-linha);flex:none}
.app-topo .voltar{width:22px;color:var(--biz)}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--biz);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-size:16px;flex:none;position:relative}
.avatar::after{content:"";position:absolute;right:0;bottom:0;width:11px;height:11px;border-radius:50%;background:#3CB371;border:2px solid var(--app-papel)}
.app-topo .quem{min-width:0;flex:1}
.app-topo .nome{font-weight:700;font-size:15px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app-topo .sub{font-size:12px;color:var(--app-cinza);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app-topo .acoes{display:flex;gap:14px;color:var(--biz)}

.conversa{flex:1;overflow-y:auto;padding:14px 12px 10px;display:flex;flex-direction:column;gap:6px;overscroll-behavior:contain;
  background-color:var(--app-fundo);
  background-image:radial-gradient(circle at 1px 1px,rgba(29,27,25,.07) 1px,transparent 0);background-size:16px 16px}
.conversa>*{flex-shrink:0}
.dia{align-self:center;font-size:11.5px;color:var(--app-cinza);background:rgba(255,255,255,.75);border-radius:8px;padding:3px 10px;margin:4px 0}
.chamada{align-self:center;display:flex;align-items:center;gap:8px;font-size:12.5px;background:var(--app-papel);border:1px solid var(--app-linha);border-radius:12px;padding:7px 12px;color:#B3261E;margin:2px 0 6px}
.chamada span{color:var(--app-cinza)}
.msg{max-width:82%;padding:7px 10px 5px;border-radius:14px;font-size:15px;line-height:1.38;position:relative;white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:0 1px 0 rgba(0,0,0,.06)}
.msg .h{display:inline-flex;gap:3px;align-items:center;float:right;margin:6px 0 -2px 10px;font-size:11px;color:var(--app-cinza);line-height:1}
.msg.in{align-self:flex-start;background:var(--app-papel);border-top-left-radius:4px}
.msg.out{align-self:flex-end;background:var(--biz-claro);border-top-right-radius:4px}
.msg.out .h svg{color:#3478C6}
.msg.dono-msg{border-left:3px solid var(--laranja)}
.msg .autor{display:block;font-size:12px;font-weight:700;color:#A64923;margin-bottom:1px}
.entra{animation:entra .32s cubic-bezier(.2,.8,.2,1) both}
@keyframes entra{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.digita{align-self:flex-start;background:var(--app-papel);border-radius:14px;border-top-left-radius:4px;padding:11px 13px;display:flex;gap:4px}
.digita i{width:7px;height:7px;border-radius:50%;background:#9A948C;animation:pulo 1.1s infinite}
.digita i:nth-child(2){animation-delay:.15s}.digita i:nth-child(3){animation-delay:.3s}
@keyframes pulo{0%,60%,100%{transform:none;opacity:.5}30%{transform:translateY(-4px);opacity:1}}

.cartao{align-self:flex-start;width:84%;background:var(--app-papel);border-radius:14px;overflow:hidden;border:1px solid var(--app-linha);font-size:13.5px}
.cartao .cab{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--biz);color:#fff;font-weight:600;font-size:13px}
.cartao.pessoa .cab{background:#A64923}
.cartao dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:0;padding:10px 12px 12px}
.cartao dt{color:var(--app-cinza)}
.cartao dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums}
.cartao p{margin:0;padding:10px 12px 12px;line-height:1.4}

.atalhos{display:flex;gap:6px;overflow-x:auto;padding:8px 10px 2px;flex:none;scrollbar-width:none;background:var(--app-fundo)}
.atalhos::-webkit-scrollbar{display:none}
.atalhos button{flex:none;background:var(--app-papel);border:1px solid var(--app-linha);color:var(--biz);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500;white-space:nowrap}
.atalhos button:hover{border-color:var(--biz)}
.compor{display:flex;gap:8px;align-items:flex-end;padding:8px 10px 14px;background:var(--app-fundo);flex:none}
.compor textarea{flex:1;min-width:0;resize:none;border:1px solid var(--app-linha);background:var(--app-papel);color:var(--app-tinta);border-radius:22px;padding:10px 14px;font:16px/1.3 var(--f-texto);max-height:110px;outline:none}
.compor textarea:focus{border-color:var(--biz)}
.compor button{width:44px;height:44px;border-radius:50%;border:0;background:var(--biz);color:#fff;display:grid;place-items:center;flex:none;transition:transform .15s,opacity .2s}
.compor button:disabled{opacity:.45;cursor:default}
.compor button:not(:disabled):active{transform:scale(.92)}
.parado{padding:12px 14px 16px;text-align:center;font-size:13px;color:var(--app-cinza);background:var(--app-fundo);flex:none}
.parado button{margin-top:6px;border:1px solid var(--biz);background:transparent;color:var(--biz);border-radius:999px;padding:6px 14px;font-weight:600}
.nota-tel{font-family:var(--f-mono);font-size:11px;color:var(--cinza);text-align:center;margin:0;max-width:36ch}

/* ---------- o que o dono vê ---------- */
.dono{padding-top:24px;display:flex;flex-direction:column;gap:14px}
.dono-cab{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.dono h2{font-family:var(--f-display);font-weight:400;text-transform:uppercase;font-size:20px;margin:0;letter-spacing:.01em}
.reset{background:none;border:1px solid var(--linha);border-radius:999px;padding:6px 12px;font-size:12px;color:var(--cinza);font-family:var(--f-mono)}
.reset:hover{color:var(--osso)}
.bloco{background:var(--carvao-2);border:1px solid var(--linha);border-radius:14px;padding:14px 16px}
.bloco h3{margin:0 0 10px;font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--cinza);font-weight:400;display:flex;justify-content:space-between}
.bloco h3 .n{color:var(--laranja)}
.vazio{margin:0;color:var(--cinza);font-size:13.5px}
.lista{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.lista li{display:grid;grid-template-columns:62px 1fr;gap:10px;font-size:14px;align-items:baseline}
.lista .q{font-family:var(--f-mono);font-size:12px;color:var(--laranja);font-variant-numeric:tabular-nums}
.lista .q small{display:block;color:var(--cinza);font-size:11px}
.lista .o{min-width:0}
.lista .o span{color:var(--cinza);display:block;font-size:13px}
.lista li.novo{animation:brilho 1.6s ease-out}
@keyframes brilho{from{background:rgba(232,98,44,.18)}to{background:transparent}}
.alerta{border:1px solid rgba(232,98,44,.4);background:rgba(232,98,44,.07);border-radius:10px;padding:10px 12px;font-size:14px;display:flex;flex-direction:column;gap:8px}
.alerta b{font-weight:600}
.alerta .resp{display:flex;gap:6px}
.alerta input{flex:1;min-width:0;background:var(--carvao);border:1px solid var(--linha);border-radius:8px;color:var(--osso);padding:7px 10px;font:14px var(--f-texto)}
.alerta button{border:0;background:var(--laranja);color:var(--carvao);border-radius:8px;padding:7px 12px;font-weight:600;font-size:13px}
.alerta.feito{opacity:.6}
.registo{list-style:none;margin:0;padding:0;font-family:var(--f-mono);font-size:12px;display:flex;flex-direction:column;gap:6px;max-height:220px;overflow-y:auto}
.registo li{display:grid;grid-template-columns:44px 1fr;gap:8px;color:var(--cinza)}
.registo li b{color:var(--osso);font-weight:400}
.registo li.ferr b{color:var(--laranja)}
details.regras summary{cursor:pointer;font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--cinza);list-style:none}
details.regras summary::-webkit-details-marker{display:none}
details.regras summary::after{content:" +";color:var(--laranja)}
details.regras[open] summary::after{content:" –"}
details.regras ul{margin:10px 0 0;padding-left:18px;font-size:14px;display:flex;flex-direction:column;gap:6px;color:var(--osso)}
details.regras li::marker{color:var(--laranja)}

@media (max-width:1100px){
  .palco{grid-template-columns:minmax(0,1fr) minmax(0,380px);gap:32px}
  .dono{grid-column:1 / -1;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));align-items:start}
  .dono-cab{grid-column:1 / -1}
}
@media (max-width:760px){
  .palco{grid-template-columns:minmax(0,1fr);padding:20px 16px 40px;gap:24px}
  .intro{padding-top:0;gap:14px}
  .lead{font-size:15px}
  .tel{height:min(720px,calc(100svh - 24px));border-radius:44px;padding:8px}
  .ecra{border-radius:37px}
  .dono{display:flex;align-items:stretch;padding-top:0}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>

  <aside class="dono" aria-labelledby="dono-h">

function dataDe(isoStr){ const [y,m,d]=isoStr.split("-").map(Number); return new Date(y,m-1,d); }
function diaBonito(isoStr, lang=S.lang){
  return dataDe(isoStr).toLocaleDateString(LOCALE[lang],{weekday:"long",day:"numeric",month:"long"});
}
function diaSemana(isoStr, lang=S.lang){ return dataDe(isoStr).toLocaleDateString(LOCALE[lang],{weekday:"long"}); }

/* ================= AGENDA (fictícia, determinística) ================= */
function hash(str){ let h=2166136261; for(const c of str){ h^=c.charCodeAt(0); h=Math.imul(h,16777619);} return h>>>0; }
function duracaoServ(servId){
  const b=biz(); if(b.pessoas) return b.duracao;
  const s=b.servicos.find(x=>x.id===servId); return s? s.min : b.passo;
}
function horasLivres(isoStr, servId){
  const b=biz(); const d=dataDe(isoStr); const h=b.horario[d.getDay()];
  if(!h) return {aberto:false, livres:[]};
  const ini=min(h[0]), fim=min(h[1]); const dur=duracaoServ(servId);
  const agora=new Date(); const hoje=iso(agora)===isoStr; const agoraMin=agora.getHours()*60+agora.getMinutes()+30;
  const livres=[];
  // restaurante: as mesas não bloqueiam umas às outras; só a hora "cheia" conta
  const cheio = k => (hash(S.biz+isoStr+k)%10)<4;
  const marcado = (m,d) => S.marcacoes.some(x=>x.biz===S.biz&&x.data===isoStr&&(b.pessoas? min(x.hora)===m : m<min(x.hora)+duracaoServ(x.servico)&&min(x.hora)<m+d));
  for(let m=ini; m+(b.pessoas?b.passo:dur)<=fim-(b.pessoas?60:0); m+=b.passo){
    if(hoje && m<agoraMin) continue;
    let livre=!marcado(m,dur);
    const ate = b.pessoas? m+b.passo : m+dur;
    for(let k=m;livre&&k<ate;k+=b.passo) if(cheio(k)) livre=false;
    if(livre) livres.push(deMin(m));
  }
  return {aberto:true, abre:h[0], fecha:h[1], livres};
}
function proximoDiaAberto(desde){
  const d=dataDe(desde); for(let i=1;i<8;i++){ const x=new Date(d); x.setDate(d.getDate()+i); if(biz().horario[x.getDay()]) return iso(x);} return null;
}
function marcar({nome,servico,data,hora,pessoas,nota}){
  const b=biz();
  if(!nome) throw new Error("falta o nome");
  if(!/^\d{4}-\d{2}-\d{2}$/.test(data||"")) throw new Error("data inválida, usa AAAA-MM-DD");
  hora=String(hora||"").replace("h",":"); if(/^\d{1,2}$/.test(hora)) hora=hora+":00"; if(/^\d:\d\d$/.test(hora)) hora="0"+hora;
  if(!b.pessoas && !b.servicos.some(s=>s.id===servico)) throw new Error("serviço desconhecido; ids válidos: "+b.servicos.map(s=>s.id).join(", "));
  if(b.pessoas){ pessoas=Number(pessoas); if(!pessoas) throw new Error("falta o número de pessoas"); if(pessoas>b.maxPessoas) throw new Error("mais de "+b.maxPessoas+" pessoas: passa a uma pessoa"); }
  const r=horasLivres(data,servico);
  if(!r.aberto) throw new Error("fechado nesse dia");
  if(!r.livres.includes(hora)) throw new Error("hora não disponível; livres: "+r.livres.slice(0,8).join(", "));
  const m={biz:S.biz,nome:String(nome).slice(0,40),servico:b.pessoas?null:servico,data,hora,pessoas:b.pessoas?pessoas:null,nota:nota?String(nota).slice(0,80):""};
  S.marcacoes.push(m);
  return m;
}

function detetarLingua(txt){
  if(/[ăâîșțşţ]/i.test(txt)) return "ro";
  if(/[ãõç]/i.test(txt)) return "pt";
  const n=" "+sem(txt).replace(/[^a-z0-9 ]/g," ")+" "; const sc={ro:0,pt:0,en:0};
  for(const L in PAL) for(const w of PAL[L]) if(n.includes(" "+w+" ")||n.includes(" "+w)) sc[L]+= w.length>3?2:1;
  const best=Object.entries(sc).sort((a,b)=>b[1]-a[1]);
  return best[0][1]>0 && best[0][1]>best[1][1] ? best[0][0] : S.lang;
}
const DIAS = {
  0:["domingo","duminica","sunday"],1:["segunda","luni","monday"],2:["terca","marti","tuesday"],3:["quarta","miercuri","wednesday"],
  4:["quinta","joi","thursday"],5:["sexta","vineri","friday"],6:["sabado","sambata","saturday"]

function extrairDia(n){
  const hoje=new Date(); hoje.setHours(0,0,0,0);
  if(/\b(hoje|azi|astazi|today|tonight|diseara|logo a noite|esta noite|hoje a noite)\b/.test(n)) return iso(hoje);
  if(/\b(depois de amanha|poimaine|poimaine|day after tomorrow)\b/.test(n)){ const d=new Date(hoje); d.setDate(d.getDate()+2); return iso(d); }
  if(/\b(amanha|maine|tomorrow)\b/.test(n)){ const d=new Date(hoje); d.setDate(d.getDate()+1); return iso(d); }
  for(const k in DIAS) for(const w of DIAS[k]) if(new RegExp("\\b"+w).test(n)){
    const d=new Date(hoje); const diff=(Number(k)-d.getDay()+7)%7; d.setDate(d.getDate()+diff); return iso(d);
  }
  const m=n.match(/\b(\d{1,2})[\/.-](\d{1,2})\b/); if(m){ const d=new Date(hoje.getFullYear(),Number(m[2])-1,Number(m[1])); if(d<hoje) d.setFullYear(d.getFullYear()+1); return iso(d); }
  return null;
}
function extrairHora(n){
  let m=n.match(/\b(\d{1,2})\s*(?::|h)\s*(\d{2})?\b/);
  if(!m) m=n.match(/\b(?:as|a|la|at|ora|pelas|pe la|catre)\s+(\d{1,2})(?:\s*(?:e|si|and)\s*(meia|jumatate|half))?\b/);
  let pm=false, h=null, mm=0;
  if(m){ h=Number(m[1]); mm = m[2]&&/^\d+$/.test(m[2])?Number(m[2]): (m[2]?30:0); }
  const ap=n.match(/\b(\d{1,2})\s*(am|pm)\b/); if(ap){ h=Number(ap[1]); pm=ap[2]==="pm"; mm=0; }
  if(h===null) return null;
  if(pm && h<12) h+=12;
  if(!pm && h>=1 && h<=7 && /(seara|noite|evening|tonight|diseara|jantar|cina|dinner|tarde|afternoon)/.test(n)) h+=12;
  if(h>23||mm>59) return null;
  return pad(h)+":"+pad(mm);
}
function extrairPeriodo(n){
  if(/(manha|dimineata|morning|devreme|cedo)/.test(n)) return "manha";
  if(/(tarde|dupa-amiaz|dupa amiaz|afternoon)/.test(n)) return "tarde";
  if(/(noite|seara|diseara|evening|tonight|jantar|cina|dinner)/.test(n)) return "noite";
  return null;
}

  if(!m) m=n.match(/\b(?:mesa para|masa pentru|masa de|table for|para|pentru|for)\s+(\d{1,2})\b/);
  const pal={"duas":2,"dois":2,"doua":2,"two":2,"tres":3,"trei":3,"three":3,"quatro":4,"patru":4,"four":4,"cinco":5,"cinci":5,"five":5,"seis":6,"sase":6,"six":6};
  if(!m){ const w=n.match(/\b(?:para|pentru|for)\s+(\w+)\b/); if(w&&pal[w[1]]) return pal[w[1]]; return null; }
  return Number(m[1]);
}

}

  // 1. passa logo a uma pessoa
  if(b.pessoas && pessoas>b.maxPessoas){ G.pessoas=pessoas; guardar(); }
  if(b.pessoas && G.pessoas>b.maxPessoas){ const r=vaiPessoa("Grupo de "+G.pessoas+" pessoas"+(G.dia?" para "+G.dia:"")+": «"+texto.slice(0,70)+"»",F.grupo,"grupo grande"); S.guiao={}; return r; }
  if(queixa) return vaiPessoa("Queixa do cliente: «"+texto.slice(0,90)+"»",F.pessoaPedida,"queixa");
  if(robo) return {L,out:[F.robo],entendi:"pergunta se é robô"};
  if(pedePessoa && !querMarcar) return vaiPessoa("Cliente pediu uma pessoa: «"+texto.slice(0,80)+"»",F.pessoaPedida,"pedido de pessoa");

  // 2. pedido de marcação explícito (ou dia/hora/pessoas sem ser pergunta de horário)
  const perguntaHorario=tem(n,["fech","inchid","close","abr","deschi","open","horario","programul"]);
  if(querMarcar || (!perguntaHorario && (dia||hora||pessoas||escolha)) || (emMarcacao && (serv&&!ehPreco || nomeInline)))
    { guardar(); return passoMarcacao(L,F); }

  // 3. perguntas de rotina (não estragam uma marcação a meio)
  for(const f of b.faq) if(tem(n,f.chaves)) return {L,out:[f.r[L]],entendi:f.tema};
  if(tem(n,["onde","morada","endereco","localiza","adresa","unde ","unde?","where","address","location"])) return {L,out:[F.morada(b.morada)],entendi:"morada"};
  if(perguntaHorario || tem(n,["hours","ate que horas","pana la ce ora","what time","program"])){
    const hoje=iso(new Date()); const h=b.horario[new Date().getDay()];
    if(tem(n,["hoje","azi","today","tonight","diseara"])) return {L,out:[h?F.horarioHoje(h[0],h[1]):F.fechadoHoje(diaBonito(proximoDiaAberto(hoje),L))],entendi:"horário"};
    return {L,out:[F.horario(horarioTexto(L))],entendi:"horário"};
  }
  if(ehPreco){
    if(serv) return {L,out:[F.preco(serv.nome[L],serv.preco)],entendi:"preço"};
    const l=b.servicos.map(s=>s.nome[L]+" "+s.preco+" lei").join(", ");
    return {L,out:[b.pessoas?F.pratos(l):F.precos(l)],entendi:"preço"};
  }
  if(serv && tem(n,["servic","fazem","faceti","do you do","what do you","tem ","tens "])) return {L,out:[F.preco(serv.nome[L],serv.preco)],entendi:"serviço"};
  if(tem(n,["obrigad","multumesc","mersi","thank","merci"])) return {L,out:[F.obrigado],entendi:"agradecimento"};
  if(/^(ola|oi|bom dia|boa tarde|boa noite|buna|buna ziua|salut|hello|hi|hey|good morning|good evening)\b/.test(n.trim()) && n.length<25) return {L,out:[F.ola],entendi:"saudação"};

  // 4. marcação a meio: qualquer outra resposta continua a marcação
  if(emMarcacao && (G.fase!=="nome" || G.nome)){ guardar(); return passoMarcacao(L,F); }

  // 5. não sabe → pessoa
  return vaiPessoa("Pergunta fora da lista: «"+texto.slice(0,100)+"»",F.pessoa,"fora da lista");
}
function passoMarcacao(L,F){
  const b=biz(), G=S.guiao, entendi="marcação";
  if(!G.fase||G.fase==="feito") G.fase="inicio";
  const lista=b.servicos.map(s=>s.nome[L]).join(", ");
  if(!b.pessoas && !G.serv){ G.fase="serv"; return {L,out:[F.qualServ(lista)],entendi}; }
  if(b.pessoas && !G.pessoas){ G.fase="pessoas"; return {L,out:[F.quantas],entendi}; }
  if(!G.dia){ G.fase="dia"; return {L,out:[F.qualDia],entendi}; }
  const r=horasLivres(G.dia,G.serv), prox=proximoDiaAberto(G.dia);
  if(!r.aberto){ registar(t().reg.agenda+" "+diaBonito(G.dia,S.lang)+": —",true); const d=G.dia; G.dia=null; G.hora=null; G.fase="dia"; return {L,out:[F.fechadoDia(diaSemana(d,L),diaBonito(prox,L))],entendi}; }
  registar(t().reg.agenda+" "+diaBonito(G.dia,S.lang)+": "+r.livres.length,true);
  if(!r.livres.length){ const d=G.dia; G.dia=null; G.hora=null; G.fase="dia"; return {L,out:[F.semLivres(diaBonito(d,L),diaBonito(prox,L))],entendi}; }
  if(!G.hora){ const manter=G.fase==="hora"&&G.sug&&G.sug.every(h=>r.livres.includes(h)); G.fase="hora"; if(!manter) G.sug=sugerirHoras(r.livres,G.periodo); return {L,out:[F.livres(diaBonito(G.dia,L),juntar(G.sug,L))],entendi}; }
  if(!r.livres.includes(G.hora)){ const h=G.hora; G.hora=null; G.fase="hora"; G.sug=sugerirHoras(r.livres,null,h); return {L,out:[F.ocupada(h,juntar(G.sug,L))],entendi}; }
  const resumo=(b.pessoas? G.pessoas+(L==="ro"?" persoane":L==="pt"?" pessoas":" people") : nomeServ(G.serv,L).toLowerCase())+", "+diaBonito(G.dia,L)+(L==="en"?" at ":L==="ro"?", ora ":", às ")+G.hora;
  if(!G.nome){ G.fase="nome"; return {L,out:[F.nome(resumo)],entendi}; }
  const m=marcar({nome:G.nome,servico:G.serv,data:G.dia,hora:G.hora,pessoas:G.pessoas});
  fezMarcacao(m); S.guiao={fase:"feito"};
  return {L,out:[F.feito(G.nome.split(" ")[0])],entendi};
}

/* ================= FLUXO DE MENSAGENS ================= */
function ehStop(txt){ return /^\s*(stop|stopp|pare|para|parar|dezabonare|unsubscribe)\s*[.!]?\s*$/i.test(txt); }

const fila=[];
function enviar(texto){
  texto=texto.trim(); if(!texto || S.parado) return;
  bolha(texto,"out");
  fila.push(texto); if(!S.ocupado) tratarFila();
}
async function tratarFila(){
  const g=geracao;
  while(fila.length && !S.parado && g===geracao){ const tx=fila.shift(); await processar(tx); }
  if(g!==geracao) fila.length=0;
}
async function processar(texto){
  S.ocupado=true;
  S.turnos.push({role:"user",content:texto});
  registar(t().reg.cliente+": «"+texto.slice(0,60)+"»");
  await espera(450);

  if(ehStop(texto)){
    digitar(true); await espera(700); digitar(false);
    const L=detetarLingua(texto)===S.lang?S.lang:S.lang;
    bolha(R[L].stop,"in"); registar(t().reg.stop,true);
    S.parado=true; fila.length=0; mostrarParado(); S.ocupado=false; return;
  }

  digitar(true);
  pendenteMarc=null; pendentePessoa=false;
  let partes=null;
  if(S.iaOk && S.preferirIA){
    try{ partes=await responderIA(texto); }
    catch(e){
      const code=e&&e.code;
      if(["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed","tools_unavailable"].includes(code)){ S.iaOk=false; atualizarModo(); registar(t().reg.semIA); }
      else registar(t().reg.erro+(code?" ("+code+")":""));
      if(pendenteMarc||pendentePessoa){ partes=null; }
    }
  }
  if(!partes){
    if(!(pendenteMarc||pendentePessoa)){
      const r=responderGuiao(texto); partes=r.out; if(r.entendi) registar(t().reg.percebeu+": "+r.entendi);
    } else partes=[pendenteMarc?R[S.lang].feito(pendenteMarc.nome.split(" ")[0]):R[S.lang].pessoa];
    await espera(500+Math.min(1200,partes.join(" ").length*12));
  }
  digitar(false);
  for(let i=0;i<partes.length;i++){
    if(i>0){ digitar(true); await espera(600); digitar(false); }
    bolha(partes[i],"in");
  }
  S.turnos.push({role:"assistant",content:partes.join("\n\n")});
  if(pendenteMarc){ await espera(250); cartaoMarcacao(pendenteMarc); }
  if(pendentePessoa){ await espera(250); cartaoPessoa(); }
  S.ocupado=false;
}
function mostrarParado(){
  $("compor").hidden=true; $("atalhos").hidden=true; $("parado").hidden=false;
  $("parado-txt").textContent=t().paradoTxt; $("parado-btn").textContent=t().paradoBtn;
}

/* ================= ARRANQUE E CONTROLOS ================= */
let geracao=0;
async function comecar(){
  const g=++geracao; fila.length=0;
  conv.innerHTML=""; digitaEl=null; S.turnos=[]; S.guiao={}; S.parado=false; S.ocupado=false;
  $("compor").hidden=false; $("atalhos").hidden=false; $("parado").hidden=true;
  const T=t(), b=biz();
  sistema(esc(T.hoje));
  const hc=new Date(Date.now()-3*60000);
  sistema('<svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2" fill="currentColor"/></svg>'+esc(T.chamadaPerdida)+' <span>· '+hm(hc)+'</span>',"chamada");
  registar(T.reg.inicio);
  await espera(500); if(g!==geracao) return;
  digitar(true); await espera(1300); if(g!==geracao) return; digitar(false);
  const s=saudacao(S.lang); bolha(s,"in");
  S.turnos=[{role:"assistant",content:s}];
}
function aplicarTextos(){
  const T=t(), b=biz();
  document.documentElement.lang={pt:"pt-PT",ro:"ro",en:"en"}[S.lang];
  document.documentElement.style.setProperty("--biz",b.cor); document.documentElement.style.setProperty("--biz-claro",b.claro);
  $("lead").innerHTML=T.lead; $("lbl-negocio").textContent=T.negocio; $("lbl-lingua").textContent=T.lingua;
  $("biz-nome").textContent=b.nome[S.lang]; $("biz-sub").textContent=T.sub; $("avatar").textContent=b.nome[S.lang].charAt(0);
  $("caixa").placeholder=T.caixa; $("lbl-caixa").textContent=T.caixa; $("enviar").setAttribute("aria-label",T.enviar);
  $("nota-tel").textContent=T.nota; $("dono-h").textContent=T.dono; $("reset").textContent=T.reset;
  $("h-agenda").textContent=T.agenda; $("vazio-agenda").textContent=T.vazioAgenda;
  $("h-pessoa").textContent=T.pessoa; $("vazio-pessoa").textContent=T.vazioPessoa;
  $("h-registo").textContent=T.registo; $("h-regras").textContent=T.regrasT;
  $("regras").innerHTML=T.regras.map(r=>"<li>"+esc(r)+"</li>").join("");
  if(S.parado){ $("parado-txt").textContent=T.paradoTxt; $("parado-btn").textContent=T.paradoBtn; }
  // segmentos
  $("seg-negocio").innerHTML=Object.keys(NEGOCIOS).map(k=>'<button type="button" role="radio" aria-checked="'+(k===S.biz)+'" data-k="'+k+'">'+esc(T.neg[k])+'</button>').join("");
  $("seg-lingua").innerHTML=["ro","pt","en"].map(k=>'<button type="button" role="radio" aria-checked="'+(k===S.lang)+'" data-k="'+k+'">'+k.toUpperCase()+'</button>').join("");
  $("atalhos").innerHTML=b.atalhos[S.lang].map(a=>'<button type="button">'+esc(a)+'</button>').join("");
  atualizarModo(); desenharAgenda(); desenharAlertas();
}
function atualizarModo(){
  const T=t(); const ia=S.iaOk&&S.preferirIA; const el=$("modo");
  el.dataset.modo=ia?"ia":"guiao";
  $("modo-txt").innerHTML= ia? esc(T.modoIA)+"<small>"+esc(T.modoIAsub)+"</small>" : esc(T.modoG)+"<small>"+esc(S.iaOk?T.modoGsubIA:T.modoGsub)+"</small>";
  el.disabled=!S.iaOk; el.style.cursor=S.iaOk?"pointer":"default";
}
$("seg-negocio").addEventListener("click",e=>{ const k=e.target.closest("button")?.dataset.k; if(!k||k===S.biz) return; S.biz=k; aplicarTextos(); comecar(); });
$("seg-lingua").addEventListener("click",e=>{ const k=e.target.closest("button")?.dataset.k; if(!k||k===S.lang) return; S.lang=k; try{localStorage.setItem("rec-lang",k);}catch(_){} aplicarTextos(); comecar(); });
$("atalhos").addEventListener("click",e=>{ const b=e.target.closest("button"); if(b) enviar(b.textContent); });
$("compor").addEventListener("submit",e=>{ e.preventDefault(); const v=$("caixa").value; $("caixa").value=""; ajustar(); enviar(v); });
$("caixa").addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); $("compor").requestSubmit(); } });
function ajustar(){ const c=$("caixa"); c.style.height="auto"; c.style.height=Math.min(110,c.scrollHeight)+"px"; $("enviar").disabled=!c.value.trim(); }
$("caixa").addEventListener("input",ajustar);
$("reset").addEventListener("click",()=>{ S.marcacoes=S.marcacoes.filter(m=>m.biz!==S.biz); S.alertas=S.alertas.filter(a=>a.biz!==S.biz); $("registo").innerHTML=""; aplicarTextos(); comecar(); });
$("parado-btn").addEventListener("click",()=>comecar());
$("modo").addEventListener("click",()=>{ if(!S.iaOk) return; S.preferirIA=!S.preferirIA; atualizarModo(); });
function relogio(){ $("relogio").textContent=hm(new Date()); }
setInterval(relogio,15000); relogio();

try{ const l=localStorage.getItem("rec-lang"); if(l&&UI[l]) S.lang=l; }catch(_){}
aplicarTextos(); ajustar(); comecar();

// Liga a IA ao vivo quando a página corre dentro do claude.ai
(async()=>{
  try{
    if(!window.claude||!window.claude.use) return;
    const sample=await window.claude.use("sample");
    if(!sample) return;
    const lim=await sample.limits().catch(()=>null);
    if(!lim||!lim.tools) return;
    S.sample=sample; S.iaOk=true; atualizarModo();
  }catch(_){}
})();

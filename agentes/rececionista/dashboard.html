<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel da Rececionista</title>
<meta name="description" content="Painel onde a empresa define os factos e as diretrizes que a rececionista de IA cita em cada resposta. Dados de exemplo.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4efe6;--card:#fffdf8;--ink:#14213d;--mut:#5d6578;--line:#ddd5c4;--acc:#e8590c;--accsoft:#fde7d9;--ok:#1f7a4d;--oksoft:#dcf1e5;--r:14px}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#10141f;--card:#182033;--ink:#f1ece0;--mut:#9aa3b8;--line:#2a3550;--acc:#ff8a4c;--accsoft:#3a2418;--ok:#5fd29a;--oksoft:#16342a}}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,sans-serif;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
h1,h2,.disp{font-family:'Bricolage Grotesque',Inter,sans-serif;letter-spacing:-.01em}
.mono{font-family:'IBM Plex Mono',monospace}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
header{padding:14px 18px 10px;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:19px;line-height:1.1}
header small{color:var(--mut);display:block;font-size:12px}
.live{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ok);background:var(--oksoft);padding:5px 10px;border-radius:99px;font-weight:600}
.live i{width:7px;height:7px;border-radius:50%;background:var(--ok);animation:p 1.6s infinite}
@keyframes p{50%{opacity:.25}}
nav{display:flex;gap:6px;padding:0 18px 10px}
nav button{flex:1;border:1px solid var(--line);background:transparent;color:var(--mut);padding:9px 4px;border-radius:10px;font:600 13px Inter;cursor:pointer;transition:.2s}
nav button[aria-selected=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
main{flex:1;overflow:auto;padding:4px 18px 18px;position:relative}
section{display:none;animation:in .4s both}section.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.kpis .card{margin:0;padding:10px}.kpis b{display:block;font:700 22px 'Bricolage Grotesque'}.kpis span{font-size:11px;color:var(--mut)}
.fact{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px dashed var(--line)}
.fact:last-child{border:0}
.fact label{font-weight:500}.fact small{display:block;color:var(--mut);font-size:11px}
.fact input{width:158px;text-align:right;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:8px 10px;font:500 15px 'IBM Plex Mono'}
.fact input.hl,.rule.hl{box-shadow:0 0 0 3px var(--acc);transition:box-shadow .3s}
.saved{position:absolute;right:18px;top:0;background:var(--ok);color:#fff;font-size:12px;font-weight:600;padding:5px 10px;border-radius:99px;opacity:0;transition:.3s;transform:translateY(-6px)}
.saved.on{opacity:1;transform:none}
.rule{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--card);transition:.3s}
.rule b{font:500 11px 'IBM Plex Mono';color:var(--acc);display:block;margin-bottom:2px}
.sw{flex:none;width:38px;height:22px;border-radius:99px;background:var(--line);position:relative;border:0;cursor:pointer;margin-top:2px}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
.sw[aria-checked=true]{background:var(--ok)}.sw[aria-checked=true]::after{left:19px}
.chat{display:flex;flex-direction:column;gap:8px;padding-bottom:6px}
.m{max-width:86%;padding:9px 12px;border-radius:14px;font-size:14px;animation:in .3s both}
.m.c{align-self:flex-end;background:var(--ink);color:var(--bg);border-bottom-right-radius:4px}
.m.a{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.m.h{align-self:flex-start;background:var(--accsoft);border:1px solid var(--acc);border-bottom-left-radius:4px}
.src{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.src button{font:500 10.5px 'IBM Plex Mono';border:1px solid var(--acc);color:var(--acc);background:transparent;border-radius:6px;padding:3px 6px;cursor:pointer}
.who{font-size:11px;color:var(--mut);margin:2px 4px -2px}
.typing{align-self:flex-start;color:var(--mut);font-size:12px}
form{display:flex;gap:8px;padding:10px 18px 14px;border-top:1px solid var(--line);background:var(--bg)}
form input{flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:11px 14px;font:15px Inter}
form button{border:0;background:var(--acc);color:#fff;border-radius:99px;padding:0 18px;font:600 14px Inter;cursor:pointer}
.note{font-size:12px;color:var(--mut);margin-top:6px;padding-right:84px}
#cap{position:fixed;left:0;right:0;top:0;z-index:9;display:none;padding:26px 22px;background:var(--ink);color:var(--bg);font:700 25px/1.12 'Bricolage Grotesque';max-width:560px;margin:0 auto}
#cap.on{display:block;animation:in .5s both}
#cap small{display:block;font:500 12px 'IBM Plex Mono';color:var(--acc);margin-bottom:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="cap" role="status" aria-live="polite"></div>
<header>
  <div><h1 class="disp">Painel da Rececionista</h1><small id="biz">Chaves Demo Auto · dados de exemplo</small></div>
  <div class="live"><i></i>A atender</div>
</header>
<nav role="tablist" aria-label="Secções">
  <button role="tab" aria-selected="true" data-t="conv">Conversas</button>
  <button role="tab" aria-selected="false" data-t="fact">Factos</button>
  <button role="tab" aria-selected="false" data-t="rule">Diretrizes</button>
</nav>
<main>
  <div class="saved" id="saved">Guardado</div>
  <section id="conv" class="on">
    <div class="kpis">
      <div class="card"><b id="k1">0</b><span>conversas hoje</span></div>
      <div class="card"><b id="k2">0</b><span>respondidas sozinha</span></div>
      <div class="card"><b id="k3">0</b><span>passadas ao dono</span></div>
    </div>
    <div class="chat" id="chat" aria-live="polite"></div>
  </section>
  <section id="fact">
    <p class="note" style="margin:0 0 10px">O que a rececionista sabe. Se mudar aqui, a próxima resposta já usa o valor novo.</p>
    <div class="card" id="facts"></div>
  </section>
  <section id="rule">
    <p class="note" style="margin:0 0 10px">O que ela pode e não pode fazer. Cada resposta cita a diretriz que aplicou.</p>
    <div id="rules"></div>
  </section>
</main>
<form id="f" autocomplete="off">
  <input id="q" placeholder="Escreva como cliente (ex.: quanto custa a bateria?)" aria-label="Mensagem do cliente">
  <button>Enviar</button>
</form>
<script>
const $=s=>document.querySelector(s), sleep=ms=>new Promise(r=>setTimeout(r,ms));
const facts=[
 {id:'f1',k:'Troca de bateria da chave',v:'15 €',note:'inclui bateria',key:'bateria'},
 {id:'f2',k:'Cópia de chave simples',v:'20 €',note:'chave sem chip',key:'copia'},
 {id:'f3',k:'Chave com chip',v:'desde 60 €',note:'depende do modelo',key:'chip'},
 {id:'f4',k:'Horário',v:'Seg–Sáb 9h–18h',note:'domingo fechado',key:'horario'},
 {id:'f5',k:'Morada',v:'Rua Exemplo 10',note:'a confirmar na versão real',key:'morada'}
];
const rules=[
 {id:'d1',t:'Responde só com os preços e horários da lista de factos.',on:true},
 {id:'d2',t:'Descontos, orçamentos fora da lista e reclamações passam ao dono.',on:true},
 {id:'d3',t:'Se perguntarem se és uma pessoa, diz que és a assistente automática.',on:true},
 {id:'d4',t:'Nunca prometer hora de chegada de deslocações.',on:true}
];
let stats={c:0,a:0,h:0};
const F=k=>facts.find(f=>f.key===k);
function renderFacts(){$('#facts').innerHTML=facts.map(f=>`<div class="fact"><div><label for="${f.id}">${f.k}</label><small>${f.note}</small></div><input id="${f.id}" value="${f.v}" data-id="${f.id}"></div>`).join('');
 document.querySelectorAll('#facts input').forEach(i=>i.addEventListener('change',()=>{facts.find(f=>f.id===i.dataset.id).v=i.value;flash()}))}
function renderRules(){$('#rules').innerHTML=rules.map(r=>`<div class="rule" id="r-${r.id}"><div style="flex:1"><b>${r.id.toUpperCase()}</b>${r.t}</div><button class="sw" role="switch" aria-checked="${r.on}" aria-label="Ativar ${r.id}" data-id="${r.id}"></button></div>`).join('');
 document.querySelectorAll('.sw').forEach(b=>b.addEventListener('click',()=>{const r=rules.find(x=>x.id===b.dataset.id);r.on=!r.on;b.setAttribute('aria-checked',r.on);flash()}))}
function flash(){const s=$('#saved');s.classList.add('on');setTimeout(()=>s.classList.remove('on'),1400)}
function tab(t){document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-selected',b.dataset.t===t));document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id===t));$('#f').style.display=t==='conv'?'flex':'none'}
document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>tab(b.dataset.t)));
function kpi(){$('#k1').textContent=stats.c;$('#k2').textContent=stats.a;$('#k3').textContent=stats.h}
function srcBtns(ids){return `<div class="src">${ids.map(i=>`<button data-go="${i}">${i.startsWith('f')?'Facto':'Diretriz'} · ${i.startsWith('f')?facts.find(f=>f.id===i).k:i.toUpperCase()}</button>`).join('')}</div>`}
function add(cls,html){const d=document.createElement('div');d.className='m '+cls;d.innerHTML=html;$('#chat').appendChild(d);d.scrollIntoView({block:'end'});return d}
function brain(text){
 const t=text.toLowerCase();
 if(/desconto|reducere|mais barato|discount/.test(t)&&rules[1].on) return {h:1,src:['d2'],txt:'Pedidos de desconto são decididos pelo dono. Já lhe passei a sua mensagem e ele responde ainda hoje.'};
 if(/pessoa|robot|rob[ôo]|humano/.test(t)&&rules[2].on) return {src:['d3'],txt:'Sou a assistente automática da Chaves Demo Auto. Se preferir falar com o dono, diga e eu passo.'};
 if(/bateria|baterie|pilha/.test(t)&&rules[0].on) return {src:['f1','d1'],txt:`A troca de bateria da chave custa <b>${F('bateria').v}</b>, ${F('bateria').note}. Quer que lhe reserve uma hora?`};
 if(/c[óo]pia|copiar|duplicar/.test(t)&&rules[0].on) return {src:['f2','d1'],txt:`A cópia de uma chave simples custa <b>${F('copia').v}</b>. Para chave com chip é <b>${F('chip').v}</b>.`};
 if(/chip|transponder|carro/.test(t)&&rules[0].on) return {src:['f3','d1'],txt:`Chave com chip: <b>${F('chip').v}</b>, conforme o modelo do carro. Diga-me marca e ano.`};
 if(/hor[áa]rio|abert|fecha|domingo/.test(t)&&rules[0].on) return {src:['f4','d1'],txt:`Estamos abertos <b>${F('horario').v}</b>. ${F('horario').note[0].toUpperCase()+F('horario').note.slice(1)}.`};
 if(/onde|morada|local/.test(t)&&rules[0].on) return {src:['f5','d1'],txt:`Estamos na <b>${F('morada').v}</b>.`};
 return {h:1,src:['d2'],txt:'Isso não está na minha lista, por isso não vou inventar. Passei ao dono e ele responde-lhe.'};
}
async function ask(text,delay=900){
 stats.c++;add('c',text.replace(/</g,'&lt;'));kpi();
 const ty=document.createElement('div');ty.className='typing';ty.textContent='A responder…';$('#chat').appendChild(ty);ty.scrollIntoView({block:'end'});
 await sleep(delay);ty.remove();
 const r=brain(text);r.h?stats.h++:stats.a++;kpi();
 add(r.h?'h':'a',(r.h?'<div class="who">Passado ao dono</div>':'')+r.txt+srcBtns(r.src));
}
$('#f').addEventListener('submit',e=>{e.preventDefault();const v=$('#q').value.trim();if(v){$('#q').value='';ask(v,500)}});
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(!g)return;const id=g.dataset.go;tab(id[0]==='f'?'fact':'rule');const el=id[0]==='f'?$('#'+id):$('#r-'+id);el.classList.add('hl');setTimeout(()=>el.classList.remove('hl'),2000)});
renderFacts();renderRules();
async function cap(t,s,ms){const c=$('#cap');c.innerHTML=(s?`<small>${s}</small>`:'')+t;c.classList.add('on');await sleep(ms);c.classList.remove('on')}
async function type(el,txt,ms=70){el.focus();el.value='';for(const ch of txt){el.value+=ch;await sleep(ms)}}
async function demo(){
 await cap('Ela responde com o preço que o dono definiu.','PAINEL DA RECECIONISTA DE IA',3200);
 await sleep(400);
 await ask('Boa tarde, quanto custa trocar a bateria da chave?',1300);
 await sleep(2600);
 await cap('Cada resposta mostra de onde veio.','',2200);
 tab('fact');await sleep(1400);
 $('#f1').classList.add('hl');await sleep(900);
 const i=$('#f1');i.value='';await type(i,'18 €',160);i.dispatchEvent(new Event('change'));await sleep(900);i.classList.remove('hl');
 await cap('O dono muda o preço. Sem programar nada.','',2400);
 tab('conv');await sleep(900);
 await ask('E a troca da bateria, quanto fica agora?',1200);
 await sleep(2800);
 await ask('Faz-me desconto?',1100);
 await sleep(1200);
 tab('rule');await sleep(900);$('#r-d2').classList.add('hl');await sleep(2200);$('#r-d2').classList.remove('hl');
 await cap('O que não está na lista, passa ao dono.','Diretriz D2',2600);
 tab('conv');await sleep(600);
 await cap('Factos e diretrizes dele. Respostas dela.','',2200);
 await cap('Pacheco Studios · DM AUDIT','Sistemas com IA para negócios',2600);
 document.title='fim';
}
if(location.search.includes('demo=1'))setTimeout(demo,600);
</script>
</body>
</html>

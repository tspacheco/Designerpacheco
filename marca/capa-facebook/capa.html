<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pacheco Studios — capa Facebook</title>
<link href="fontes.css" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
:root{--bg:#120c08;--ink:#f6efe7;--mut:#a8998b;--or:#e0702f;--or2:#ff9a52}
html,body{width:1640px;height:624px;overflow:hidden;background:var(--bg);font-family:Outfit,sans-serif;color:var(--ink)}
.bg{position:absolute;inset:0;
  background:
   radial-gradient(620px 360px at 50% 46%,rgba(224,112,47,.20),transparent 70%),
   radial-gradient(900px 500px at 50% 120%,rgba(224,112,47,.10),transparent 70%),
   linear-gradient(180deg,#1a110b,#0d0906)}
/* grelha fina = "blueprint" de site */
.grid{position:absolute;inset:0;opacity:.07;
  background-image:linear-gradient(#fff 1px,transparent 1px),linear-gradient(90deg,#fff 1px,transparent 1px);
  background-size:40px 40px;mask-image:radial-gradient(700px 300px at 50% 50%,#000 30%,transparent 80%)}
/* centro: tudo o que tem de se ler no telemóvel fica entre x=300 e x=1340 */
.c{position:absolute;left:0;right:0;top:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding-bottom:18px}
.k{font-family:'JetBrains Mono',monospace;font-size:17px;letter-spacing:.34em;color:var(--mut);text-transform:uppercase}
.k b{color:var(--or);font-weight:500}
.w{font-weight:800;font-size:96px;line-height:.95;letter-spacing:-1.5px;margin-top:20px}
.w span{color:var(--or)}
.t{font-weight:300;font-size:34px;line-height:1.3;margin-top:24px;color:#e9dfd4}
.t em{font-style:normal;font-weight:600;color:#fff}
.hr{width:88px;height:3px;background:var(--or);border-radius:2px;margin:30px auto 24px}
.ct{font-size:25px;font-weight:400;color:var(--mut);letter-spacing:.02em}
.ct b{color:var(--or2);font-weight:600}
/* direita: bolhas de chat nas 3 línguas (automação / IA) */
.chat{position:absolute;right:40px;align-items:flex-end;top:150px;display:flex;flex-direction:column;gap:14px}
.b{white-space:nowrap;padding:12px 18px 10px;border-radius:18px;font-size:20px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.b small{display:block;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:500;letter-spacing:.12em;opacity:.6;margin-top:3px}
.in{align-self:flex-start;background:#2a2019;border-top-left-radius:6px;color:#efe6dc}
.out{align-self:flex-end;background:var(--or);color:#1a0d05;border-top-right-radius:6px}
/* esquerda: esboço de site (websites) — no alto, longe da foto de perfil */
.site{position:absolute;left:44px;top:96px;width:210px;height:176px;border:1.5px solid rgba(246,239,231,.18);border-radius:14px;padding:16px;background:rgba(255,255,255,.02)}
.dots{display:flex;gap:6px;margin-bottom:16px}.dots i{width:8px;height:8px;border-radius:50%;background:rgba(246,239,231,.22)}
.bar{height:10px;border-radius:5px;background:rgba(246,239,231,.14);margin-bottom:10px}
.hero{height:52px;border-radius:8px;background:linear-gradient(120deg,rgba(224,112,47,.55),rgba(224,112,47,.12));margin-bottom:12px}
.btn{width:92px;height:24px;border-radius:12px;background:var(--or)}
</style>
</head>
<body>
<div class="bg"></div><div class="grid"></div>

<div class="site" aria-hidden="true">
  <div class="dots"><i></i><i></i><i></i></div>
  <div class="bar" style="width:62%"></div>
  <div class="hero"></div>
  <div class="bar" style="width:84%"></div>
  <div class="btn"></div>
</div>

<div class="chat" aria-hidden="true">
  <div class="b in">Olá! Têm mesa hoje?<small>PT</small></div>
  <div class="b in">Bună! Aveți loc azi?<small>RO</small></div>
  <div class="b in">Hi! Open on Sunday?<small>EN</small></div>
  <div class="b out">Sim · Da · Yes ✓<small>AUTO-REPLY</small></div>
</div>

<div class="c">
  <div class="k">Websites <b>·</b> Automation <b>·</b> AI</div>
  <h1 class="w">PACHECO<span>STUDIOS</span></h1>
  <div class="hr"></div>
  <p class="ct"><b>+351 967 117 357</b> &nbsp;·&nbsp; pachecost.com &nbsp;·&nbsp; Europe</p>
</div>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 600 600">
  <defs>
    <path id="arc-top" d="M 68,300 A 232,232 0 0,1 532,300"/>
  </defs>

  <!-- Background -->
  <circle cx="300" cy="300" r="296" fill="#0D0B08"/>

  <!-- Outer gold double ring -->
  <circle cx="300" cy="300" r="280" fill="none" stroke="#C9A256" stroke-width="4"/>
  <circle cx="300" cy="300" r="274" fill="none" stroke="#C9A256" stroke-width="1.5" opacity="0.7"/>

  <!-- Inner orange dashed ring -->
  <circle cx="300" cy="300" r="258" fill="none" stroke="#C8612A" stroke-width="2.5" stroke-dasharray="9 5.5"/>

  <!-- "PACHECO STUDIOS" curved text -->
  <text fill="#C9A256" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="21" font-weight="600" letter-spacing="10">
    <textPath href="#arc-top" xlink:href="#arc-top" startOffset="50%">PACHECO STUDIOS</textPath>
  </text>

  <!-- Large serif "P" -->
  <text x="300" y="368" fill="#EDE8D8" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="230" font-weight="700">P</text>

  <!-- "DIGITAL" bottom label -->
  <text x="300" y="452" fill="#C9A256" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="20" font-weight="500" letter-spacing="16">DIGITAL</text>
</svg>

<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:IDB;src:url(file:///usr/share/fonts/opentype/inter/InterDisplay-Black.otf)}
@font-face{font-family:IDX;src:url(file:///usr/share/fonts/opentype/inter/InterDisplay-ExtraBold.otf)}
@font-face{font-family:IDS;src:url(file:///usr/share/fonts/opentype/inter/InterDisplay-SemiBold.otf)}
@font-face{font-family:IDM;src:url(file:///usr/share/fonts/opentype/inter/InterDisplay-Medium.otf)}
html,body{margin:0;width:1080px;height:1920px;background:transparent;overflow:hidden}
.w{position:absolute;left:0;right:0;text-align:center}
.fire{background:linear-gradient(92deg,#FFC24B 0%,#FF7A2F 45%,#FF3D3D 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
#k{top:178px;font:600 25px IDS;letter-spacing:.42em;color:#FFB547;text-indent:.42em}
#k i{display:inline-block;width:46px;height:2px;background:currentColor;vertical-align:middle;margin:0 18px;transform-origin:center}
#h{top:222px;font:900 92px/1 IDB;color:#fff;letter-spacing:-.025em}
#h span{display:inline-block;margin:0 .13em}
#s{top:350px;font:500 40px/1.38 IDM;color:#E9E6E1;letter-spacing:-.005em}
#s div{display:block}
#s b{font-family:IDX;font-weight:800}
#c{top:1408px;left:84px;right:84px;position:absolute;border-radius:30px;padding:2px;
 background:linear-gradient(110deg,rgba(255,194,75,.25),rgba(255,61,61,.25))}
#c .in{position:relative;border-radius:28px;background:rgba(12,9,8,.86);padding:30px 40px 34px;overflow:hidden;text-align:left}
#c .sw{position:absolute;inset:-2px;border-radius:30px;pointer-events:none}
#lab{font:700 22px IDX;letter-spacing:.32em;color:#FFB547;display:flex;align-items:center;gap:16px}
#dot{width:12px;height:12px;border-radius:50%;background:#FF5A36;box-shadow:0 0 0 0 rgba(255,90,54,.6)}
#big{margin-top:16px;font:900 60px/1.05 IDB;color:#fff;letter-spacing:-.02em}
#sub{margin-top:10px;font:500 34px IDM;color:#D8D3CC}
#shine{position:absolute;top:0;bottom:0;width:180px;background:linear-gradient(100deg,transparent,rgba(255,255,255,.14),transparent);transform:skewX(-18deg)}
</style></head><body>
<div class="w" id="k"><i></i>FOR BUSINESS OWNERS<i></i></div>
<div class="w" id="h"><span>Own</span><span>a</span><span>business?</span></div>
<div class="w" id="s"><div id="s1">Start with a website like this.</div><div id="s2">Grow into a <b class="fire">full AI infrastructure.</b></div></div>
<div id="c"><div class="in"><div id="shine"></div>
 <div id="lab"><span id="dot"></span>INSIGHT</div>
 <div id="big">Cut costs by up to <span class="fire" id="num">40%</span></div>
 <div id="sub">without hiring anyone.</div></div></div>
<script>
const cl=(x)=>Math.max(0,Math.min(1,x));
const eo=(x)=>1-Math.pow(1-cl(x),3);
const eb=(x)=>{x=cl(x);const c1=1.5,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
function rise(el,t,t0,d,dy,blur){const p=eo((t-t0)/d);el.style.opacity=p;el.style.transform=`translateY(${(1-p)*dy}px)`;el.style.filter=`blur(${(1-p)*blur}px)`}
window.render=(t)=>{
 const k=document.getElementById('k');k.style.opacity=1;
 k.querySelectorAll('i').forEach(i=>i.style.transform=`scaleX(${.25+.75*eo(t/.6)})`);
 {const h=document.getElementById('h');const p=eo(t/.7);h.style.transform=`scale(${1.05-.05*p})`;h.style.letterSpacing=`${-.025+.0*p}em`}
 rise(document.getElementById('s1'),t,1.1,.6,26,8);
 rise(document.getElementById('s2'),t,1.9,.6,26,8);
 const f=document.querySelector('#s2 .fire');f.style.backgroundSize='200% 100%';f.style.backgroundPosition=`${100-100*eo((t-2.0)/1.2)}% 0`;
 const c=document.getElementById('c');const p=eb((t-5)/.7),o=eo((t-5)/.4);
 c.style.opacity=o;c.style.transform=`translateY(${(1-p)*90}px) scale(${.94+.06*p})`;c.style.filter=`blur(${(1-o)*12}px)`;
 const n=Math.round(40*eo((t-5.25)/1.0));document.getElementById('num').textContent=n+'%';
 const a=cl((t-5.3)/.8);c.style.background=`linear-gradient(110deg,rgba(255,194,75,${.25+.6*a}),rgba(255,61,61,${.25+.6*a}))`;
 c.style.boxShadow=`0 0 ${60*a}px rgba(255,90,40,${.28*a})`;
 const sh=document.getElementById('shine');const sp=cl((t-6.1)/.9);sh.style.left=`${-200+1200*sp}px`;sh.style.opacity=sp>0&&sp<1?1:0;
 const ph=((t-5.4)%1.6+1.6)%1.6/1.6;document.getElementById('dot').style.boxShadow=`0 0 0 ${14*ph}px rgba(255,90,54,${.55*(1-ph)})`;
};
render(0);
</script></body></html>

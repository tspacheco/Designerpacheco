<!doctype html>
<html lang="ro" data-lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>@@meta.title</title>
<meta name="description" content="@@meta.desc">
<meta name="theme-color" content="#24161B">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2324161B'/%3E%3Crect x='14' y='10' width='36' height='44' rx='8' fill='none' stroke='%23E8D3C9' stroke-width='4'/%3E%3Ccircle cx='14' cy='18' r='4' fill='%23FFD898'/%3E%3Ccircle cx='14' cy='32' r='4' fill='%23FFD898'/%3E%3Ccircle cx='14' cy='46' r='4' fill='%23FFD898'/%3E%3Ccircle cx='50' cy='18' r='4' fill='%23FFD898'/%3E%3Ccircle cx='50' cy='32' r='4' fill='%23FFD898'/%3E%3Ccircle cx='50' cy='46' r='4' fill='%23FFD898'/%3E%3C/svg%3E">
<script>document.documentElement.classList.add('js');try{var l=localStorage.getItem('bz.lang'),h=document.documentElement;if(l==='ro'||l==='en'||(l==='pt'&&h.dataset.pt)){h.dataset.lang=l;h.lang=l==='pt'?'pt-PT':l}}catch(e){}</script>
<style>
/*__FONTES__*/
:root{
  --pudra:#F6EAE5; --pudra-2:#EEDBD3; --pudra-3:#E6CBC0;
  --ink:#2A1A1F; --ink-2:#5E434A; --linha:rgba(42,26,31,.14);
  --lac:#9B2C48; --lac-2:#7A1F38; --ruj:#C7325C;
  --camarin:#24161B; --camarin-2:#33212A; --camarin-txt:#F7E9E3; --camarin-txt-2:#D8C2BA;
  --rama:#E8D3C9; --rama-2:#C9A99C;
  --bec:#FFD898; --bec-glow:rgba(255,196,120,.55);
  --f-disp:'Forum',Georgia,serif; --f-txt:'Manrope',system-ui,sans-serif; --f-ruj:'Caveat Brush','Segoe Print',cursive;
  --r:18px; --ease:cubic-bezier(.2,.7,.2,1);
  --gut:clamp(18px,5vw,56px); --max:1180px;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--pudra);color:var(--ink);font:400 16.5px/1.6 var(--f-txt);-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{max-width:100%;display:block}
a{color:inherit}
button{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-disp);font-weight:400;line-height:1.04;margin:0;letter-spacing:-.005em}
p{margin:0 0 1em}
.sr-only{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--lac);outline-offset:3px;border-radius:6px}
.escuro :focus-visible,.nav :focus-visible,.meniu :focus-visible,.rodape :focus-visible,dialog :focus-visible{outline-color:var(--bec)}
.skip{position:fixed;left:12px;top:-60px;z-index:200;background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;text-decoration:none}
.skip:focus{top:12px}
.wrap{width:min(100% - 2*var(--gut),var(--max));margin-inline:auto}
.kicker{font:600 .74rem/1.2 var(--f-txt);letter-spacing:.18em;text-transform:uppercase;color:var(--lac);margin:0 0 14px;display:flex;align-items:center;gap:10px}
.escuro .kicker{color:var(--bec)}
.tbc{display:inline-flex;align-items:center;gap:5px;font:600 .72em/1 var(--f-txt);letter-spacing:.04em;padding:.32em .7em .34em;border-radius:99px;border:1px dashed currentColor;color:var(--lac);background:rgba(155,44,72,.06);white-space:nowrap;vertical-align:.12em}
.tbc::before{content:"";width:.5em;height:.5em;border-radius:50%;background:currentColor;opacity:.55}
.escuro .tbc{color:var(--bec);background:rgba(255,216,152,.08)}

/* ---------- faixa + nav */
.faixa{background:var(--ink);color:#F3DCD3;font:600 .68rem/1.3 var(--f-txt);letter-spacing:.14em;text-transform:uppercase;text-align:center;padding:8px 14px calc(8px);padding-top:max(8px,env(safe-area-inset-top))}
.nav{position:sticky;top:0;z-index:50;background:var(--camarin);color:var(--camarin-txt);transition:box-shadow .3s}
.nav.scrolled{box-shadow:0 10px 30px -18px rgba(0,0,0,.7)}
.nav-in{display:flex;align-items:center;justify-content:space-between;gap:16px;height:64px}
.marca{display:flex;align-items:center;gap:10px;text-decoration:none;font:400 1.45rem/1 var(--f-disp);letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
.marca i{display:block;width:10px;height:10px;border-radius:50%;background:var(--bec);box-shadow:0 0 10px 3px var(--bec-glow)}
.nav-links{display:none;list-style:none;margin:0;padding:0;gap:4px}
.nav-links a{display:block;padding:10px 12px;border-radius:99px;text-decoration:none;font-weight:500;font-size:.95rem;color:var(--camarin-txt-2);transition:color .2s,background .2s}
.nav-links a:hover{color:#fff;background:rgba(255,255,255,.06)}
.nav-links a[aria-current=page]{color:var(--camarin);background:var(--bec)}
.nav-dir{display:flex;align-items:center;gap:8px}
.lang{display:flex;border:1px solid rgba(255,255,255,.22);border-radius:99px;padding:3px}
.lang button{border:0;background:none;padding:6px 9px;min-width:38px;min-height:34px;border-radius:99px;font:600 .74rem/1 var(--f-txt);letter-spacing:.08em;cursor:pointer;color:var(--camarin-txt-2)}
.lang button[aria-pressed=true]{background:var(--camarin-txt);color:var(--camarin)}
.lang [data-pt-only]{display:none}
html[data-pt] .lang [data-pt-only]{display:block}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:12px 22px;border-radius:99px;border:1.5px solid transparent;font:600 .98rem/1.1 var(--f-txt);text-decoration:none;cursor:pointer;transition:transform .2s var(--ease),background .2s,color .2s,border-color .2s;touch-action:manipulation}
.btn:active{transform:scale(.97)}
.btn-lac{background:var(--lac);color:#fff}
.btn-lac:hover{background:var(--lac-2)}
.btn-bec{background:var(--bec);color:var(--camarin)}
.btn-bec:hover{background:#FFE6BC}
.btn-linha{border-color:currentColor;background:transparent}
.btn-linha:hover{background:rgba(155,44,72,.08)}
.escuro .btn-linha:hover{background:rgba(255,255,255,.08)}
.btn svg{width:18px;height:18px;flex:none}
.nav-cta{display:none}
.burger{width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,255,255,.22);background:none;display:grid;place-items:center;cursor:pointer}
.burger span{display:block;width:18px;height:1.5px;background:currentColor;position:relative;transition:transform .3s var(--ease),background .2s}
.burger span::before,.burger span::after{content:"";position:absolute;left:0;width:18px;height:1.5px;background:currentColor;transition:transform .3s var(--ease)}
.burger span::before{top:-6px}.burger span::after{top:6px}
.burger[aria-expanded=true] span{background:transparent}
.burger[aria-expanded=true] span::before{transform:translateY(6px) rotate(45deg)}
.burger[aria-expanded=true] span::after{transform:translateY(-6px) rotate(-45deg)}
.meniu{position:fixed;inset:0;z-index:45;background:var(--camarin);color:var(--camarin-txt);padding:150px var(--gut) 40px;display:flex;flex-direction:column;gap:28px;opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s}
.meniu.aberto{opacity:1;visibility:visible}
.meniu ul{list-style:none;margin:0;padding:0}
.meniu li a{display:flex;align-items:center;gap:14px;padding:10px 0;font:400 2.3rem/1.1 var(--f-disp);text-decoration:none;color:var(--camarin-txt-2)}
.meniu li a::before{content:"";width:12px;height:12px;border-radius:50%;background:#5a4740;transition:background .3s,box-shadow .3s}
.meniu li a[aria-current=page]{color:#fff}
.meniu li a[aria-current=page]::before{background:var(--bec);box-shadow:0 0 12px 4px var(--bec-glow)}
@media(max-width:420px){.nav-in{gap:8px}.marca{font-size:1.2rem;letter-spacing:.1em;gap:8px}.lang button{min-width:32px;padding:6px 7px}.burger{width:44px;height:44px}}
@media(min-width:960px){.nav-links{display:flex}.burger{display:none}.nav-cta{display:inline-flex;min-height:42px;padding:10px 18px}.meniu{display:none}}

/* ---------- herói: a oglinda */
.erou{position:relative;background:var(--camarin);color:var(--camarin-txt);overflow:hidden;padding:26px 0 56px;isolation:isolate}
.erou::before{content:"";position:absolute;inset:-20% -10% auto;height:120%;z-index:-1;background:radial-gradient(60% 50% at 50% 42%,rgba(255,190,120,.30),transparent 70%);opacity:var(--lit,0);transition:opacity .5s}
.erou::after{content:"";position:absolute;inset:0;z-index:-2;opacity:.5;background:repeating-linear-gradient(90deg,rgba(255,255,255,.018) 0 2px,transparent 2px 9px)}
.erou-grid{display:grid;gap:22px;justify-items:center;text-align:center}
.erou .kicker{justify-content:center;color:var(--camarin-txt-2)}
.erou h1{font-size:clamp(3.3rem,15vw,7.4rem);letter-spacing:.02em;text-transform:uppercase;line-height:.9;color:#FBEFEA}
.erou h1 span{display:block;font-size:.42em;letter-spacing:.42em;margin-top:.25em;color:var(--rama);padding-left:.42em}
@media(min-width:960px){.erou h1 span{padding-left:.08em;letter-spacing:.62em}}
.erou-txt{max-width:34ch;color:var(--camarin-txt-2);font-size:1.05rem}
.erou-acoes{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.erou-nota{display:inline-flex;align-items:center;gap:10px;font-size:.92rem;color:var(--camarin-txt-2);text-decoration:none}
.erou-nota b{font:400 1.6rem/1 var(--f-disp);color:#fff}
.erou-nota .estrelas svg{width:16px;height:16px;fill:var(--bec)}
.oglinda{--pad:26px;position:relative;width:min(80vw,440px);aspect-ratio:4/5;border-radius:34px;padding:var(--pad);background:linear-gradient(150deg,#F3E4DC 0%,var(--rama) 40%,var(--rama-2) 100%);box-shadow:0 40px 90px -30px rgba(0,0,0,.85),0 0 0 1px rgba(255,255,255,.25) inset,0 -3px 0 rgba(0,0,0,.12) inset}
.sticla{position:absolute;inset:var(--pad);border-radius:14px;overflow:hidden;background:#1b1114;box-shadow:inset 0 0 0 1px rgba(0,0,0,.35),inset 0 6px 20px rgba(0,0,0,.45)}
.sticla .fb,.ph .fb{position:absolute;inset:0;width:100%;height:100%}
.sticla img{position:absolute;inset:-4%;max-width:none;width:108%;height:108%;object-fit:cover;transform:scaleX(-1) translate3d(var(--mx,0),var(--my,0),0);transition:transform .6s var(--ease)}
.sticla .umbra{position:absolute;inset:0;background:#120a0d;opacity:calc(1 - var(--lit,1)*.95);transition:opacity .45s}
.sticla::after{content:"";position:absolute;inset:-10% -60%;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.22) 48%,rgba(255,255,255,.05) 53%,transparent 60%);transform:translateX(-70%);pointer-events:none}
.erou.aceso .sticla::after{animation:luciu 1.6s .2s var(--ease) both}
@keyframes luciu{to{transform:translateX(70%)}}
.ruj{position:absolute;left:9%;bottom:7%;margin:0;font:400 clamp(1.9rem,8.5vw,2.9rem)/1 var(--f-ruj);color:var(--ruj);transform:rotate(-7deg);text-shadow:0 1px 0 rgba(255,255,255,.35),0 0 1px rgba(120,10,40,.6);text-align:left;pointer-events:none}
html.js .ruj{clip-path:inset(-20% 100% -20% 0)}
html.js .erou.aceso .ruj{clip-path:inset(-20% -5% -20% 0);transition:clip-path 1.3s .5s steps(14,end)}
.bec{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:radial-gradient(circle at 38% 32%,#9b8780,#5c4a44 70%);box-shadow:0 2px 3px rgba(0,0,0,.35)}
.bec::before{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff 0,#FFF3D6 30%,var(--bec) 75%);opacity:0;transition:opacity .25s}
.bec::after{content:"";position:absolute;inset:-14px;border-radius:50%;background:radial-gradient(circle,rgba(255,206,130,.6),transparent 65%);opacity:0;transition:opacity .4s}
.bec.on::before,.bec.on::after{opacity:1}
.oglinda-legenda{font-size:.8rem;color:var(--camarin-txt-2);letter-spacing:.06em}
@media(min-width:960px){
  .erou{padding:56px 0 90px;min-height:calc(100svh - 96px);display:flex;align-items:center}
  .erou-grid{grid-template-columns:1.05fr .95fr;text-align:left;justify-items:start;align-items:center;gap:40px}
  .erou .kicker{justify-content:flex-start}
  .erou-acoes{justify-content:flex-start}
  .erou-col{display:grid;gap:26px;justify-items:start}
  .oglinda{width:min(38vw,470px);justify-self:center}
}
@media(max-width:959px){.erou-col{display:contents}.erou-col .kicker{order:-2}.erou-col h1{order:-1}.erou-txt,.erou-acoes,.erou-nota{order:1}}

/* entrada do herói */
html.js .erou .in{opacity:0;transform:translateY(16px)}
html.js .erou.pronto .in{opacity:1;transform:none;transition:opacity .8s var(--ease),transform .8s var(--ease)}
html.js .erou.pronto .in.d1{transition-delay:.15s}html.js .erou.pronto .in.d2{transition-delay:.3s}html.js .erou.pronto .in.d3{transition-delay:.45s}

/* ---------- marquee */
.mq{background:var(--lac);color:#FBE9EE;overflow:hidden;padding:13px 0;font:400 1.15rem/1 var(--f-disp);letter-spacing:.06em;white-space:nowrap}
.mq-in{display:inline-flex;gap:0;animation:mq 38s linear infinite}
.mq-in span{padding-right:.6em}
@keyframes mq{to{transform:translateX(-50%)}}

/* ---------- secções */
.sec{padding:clamp(64px,10vw,120px) 0}
.sec-cab{display:grid;gap:12px;margin-bottom:clamp(30px,5vw,54px);max-width:760px}
.sec-cab h2{font-size:clamp(2.2rem,6.4vw,3.8rem)}
.sec-cab p{color:var(--ink-2);font-size:1.05rem;max-width:56ch;margin:0}
.escuro{background:var(--camarin);color:var(--camarin-txt)}
.escuro .sec-cab p{color:var(--camarin-txt-2)}
.ph{position:relative;overflow:hidden;border-radius:var(--r);background:var(--pudra-3);margin:0}
.ph img{position:relative;width:100%;height:100%;object-fit:cover}
.rv{opacity:1}
html.js .rv{opacity:0;transform:translateY(22px);transition:opacity .8s var(--ease),transform .8s var(--ease)}
html.js .rv.vis{opacity:1;transform:none}
html.js .rv.d1{transition-delay:.1s}html.js .rv.d2{transition-delay:.2s}html.js .rv.d3{transition-delay:.3s}

/* disciplinas (início) */
.disc{display:grid;gap:18px;grid-template-columns:1fr}
.disc a{display:grid;grid-template-columns:112px 1fr;gap:18px;align-items:center;text-decoration:none;padding:12px;border-radius:calc(var(--r) + 6px);background:var(--pudra-2);transition:background .25s,transform .25s var(--ease)}
.disc a:hover{background:var(--pudra-3)}
.disc .ph{aspect-ratio:4/5}
.disc h3{font-size:1.9rem;margin-bottom:6px}
.disc p{margin:0;color:var(--ink-2);font-size:.95rem;line-height:1.5}
@media(min-width:760px){.disc{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1100px){.disc{grid-template-columns:repeat(4,1fr)}.disc a{grid-template-columns:1fr;align-content:start;padding:12px 12px 22px}.disc a>div{padding:4px 8px 0}}
.mais{margin-top:30px;display:flex;flex-wrap:wrap;gap:12px}

/* tira de trabalhos (início) */
.tira{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tira .ph{aspect-ratio:4/5}
.tira .ph:nth-child(1){grid-row:span 2;aspect-ratio:auto}
@media(min-width:760px){.tira{grid-template-columns:repeat(4,1fr)}.tira .ph:nth-child(4){grid-row:span 2;aspect-ratio:auto}}

/* teaser marcação */
.teaser{display:grid;gap:34px;align-items:center}
.teaser h2{font-size:clamp(2rem,6vw,3.4rem)}
.teaser p{color:var(--camarin-txt-2);max-width:48ch}
.mini-oglinda{--pad:24px;position:relative;width:min(70vw,300px);aspect-ratio:1;border-radius:26px;justify-self:center;background:linear-gradient(150deg,#F3E4DC,var(--rama) 45%,var(--rama-2));padding:24px}
.mini-oglinda .sticla img{max-width:none}
.mini-oglinda .bec{width:16px;height:16px;margin:-8px 0 0 -8px}
.mini-oglinda .sticla strong{font:400 4.5rem/1 var(--f-disp);color:var(--bec)}
.mini-oglinda .sticla small{display:block;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--camarin-txt-2)}
@media(min-width:860px){.teaser{grid-template-columns:1.2fr .8fr}}

/* visita (início) */
.visita{display:grid;gap:22px}
.cartao{background:var(--pudra-2);border-radius:calc(var(--r) + 6px);padding:clamp(22px,4vw,36px)}
.cartao h3{font-size:1.7rem;margin-bottom:10px}
.nota-g{display:flex;align-items:baseline;gap:12px;margin-bottom:8px}
.nota-g b{font:400 4rem/1 var(--f-disp);color:var(--lac)}
.estrelas{display:inline-flex;gap:3px}.estrelas svg{width:18px;height:18px;fill:var(--lac)}
@media(min-width:860px){.visita{grid-template-columns:1fr 1fr}}

/* ---------- páginas interiores */
.pagina[hidden]{display:none!important}
.cab-pag{background:var(--camarin);color:var(--camarin-txt);padding:clamp(44px,8vw,90px) 0 clamp(40px,6vw,70px);position:relative;overflow:hidden}
.cab-pag h2{font-size:clamp(2.6rem,9vw,5.4rem);max-width:15ch;outline:none}
.cab-pag p.lead{color:var(--camarin-txt-2);max-width:56ch;margin:18px 0 0;font-size:1.05rem}
.becuri{display:flex;gap:14px;margin-bottom:22px}
.becuri .bec{position:relative;margin:0;width:14px;height:14px}
.becuri .bec::after{inset:-10px}

.cab-pag .kicker{color:var(--bec)}
.cab-pag .tbc{color:var(--bec);background:rgba(255,216,152,.08)}
.cab-grid{display:grid;gap:30px;align-items:center}
.oglinda-mica{display:none}
@media(min-width:960px){
  .cab-grid{grid-template-columns:1fr 300px;gap:60px}
  .cab-pag .becuri{display:none}
  .oglinda-mica{--pad:20px;display:block;position:relative;margin:0;width:300px;aspect-ratio:4/5;border-radius:26px;padding:var(--pad);background:linear-gradient(150deg,#F3E4DC,var(--rama) 45%,var(--rama-2));box-shadow:0 30px 60px -28px rgba(0,0,0,.8)}
  .oglinda-mica .sticla img{max-width:none}
  .oglinda-mica .bec{width:14px;height:14px;margin:-7px 0 0 -7px}
  .oglinda-mica .bec::after{inset:-10px}
}
/* serviços */
.cap{display:grid;gap:26px;padding:clamp(40px,7vw,80px) 0;border-bottom:1px solid var(--linha)}
.cap:last-of-type{border-bottom:0}
.cap .ph{aspect-ratio:4/5;max-width:420px}
.cap h3{font-size:clamp(2.4rem,7vw,3.6rem);margin-bottom:6px}
.cap .cap-d{color:var(--ink-2);margin-bottom:18px;max-width:50ch}
.trat{list-style:none;margin:0;padding:0;border-top:1px solid var(--linha)}
.trat li{display:grid;grid-template-columns:1fr auto;gap:6px 16px;padding:18px 0;border-bottom:1px solid var(--linha);align-items:center}
.trat h4{margin:0;font:600 1.08rem/1.3 var(--f-txt)}
.trat p{margin:0;color:var(--ink-2);font-size:.95rem;grid-column:1}
.trat .preco{grid-column:1;font-size:.85rem;color:var(--ink-2);display:flex;gap:8px;align-items:center}
.trat .btn{grid-column:2;grid-row:1/span 3;min-height:44px;padding:10px 16px;font-size:.9rem}
@media(min-width:860px){.cap{grid-template-columns:minmax(260px,.8fr) 1.2fr;gap:56px;align-items:start}.cap .ph{position:sticky;top:96px}}
.ajuda{display:grid;gap:18px;align-items:center;border-radius:calc(var(--r) + 8px);padding:clamp(24px,5vw,44px)}
.ajuda h3{font-size:clamp(1.9rem,5vw,2.6rem)}
.ajuda p{color:var(--camarin-txt-2);margin:6px 0 0}
@media(min-width:860px){.ajuda{grid-template-columns:1fr auto}}

/* galeria */
.filtros{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px}
.chip{border:1.5px solid var(--linha);background:transparent;border-radius:99px;padding:10px 16px;min-height:44px;font-weight:600;font-size:.92rem;cursor:pointer;transition:background .2s,border-color .2s,color .2s}
.chip:hover{border-color:var(--lac)}
.chip[aria-pressed=true]{background:var(--ink);color:var(--pudra);border-color:var(--ink)}
.gal{columns:2;column-gap:12px}
@media(min-width:860px){.gal{columns:3;column-gap:18px}}
.gal button{display:block;width:100%;border:0;padding:0;margin:0 0 12px;background:none;text-align:left;cursor:zoom-in;break-inside:avoid}
.gal button[hidden]{display:none}
.gal .ph{aspect-ratio:var(--ar,4/5)}
.gal .ph img{transition:transform .6s var(--ease)}
.gal button:hover .ph img{transform:scale(1.04)}
.gal small{display:block;padding:8px 2px 4px;font-size:.84rem;color:var(--ink-2);line-height:1.35}

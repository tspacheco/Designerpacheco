<!-- Ideia 2 para a página inicial da Bolta Rece: "a casa em corte". Só protótipo para vídeo (1920x1080).
     A animação corre por tempo; ?t=12.5 mostra esse instante e window.setT(s) desenha qualquer instante (para gravar quadro a quadro). -->
<link rel="stylesheet" href="../_fontes/fontes.css">
<style>
  :root{--noapte:#14100D;--var:#F4EEE2;--var-2:#EAE1CF;--caramida:#8E3B26;--lumina:#E7B86A;--lumina-2:#F3D59A;--rosu:#B22B32;--text-inv-2:#CDBFA8}
  html,body{margin:0;height:100%;background:var(--noapte);overflow:hidden}
  body{font-family:"Albert Sans",system-ui,sans-serif;color:var(--var)}
  #palco{position:fixed;inset:0;display:grid;place-items:center}
  svg{width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;display:block}
  .linha{fill:none;stroke:var(--lumina);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
  .fina{fill:none;stroke:#CDBFA8;stroke-width:1;stroke-linecap:round;vector-effect:non-scaling-stroke;opacity:.8}
  .var{fill:none;stroke:var(--var-2);stroke-width:2.2;vector-effect:non-scaling-stroke}
  .lenda{fill:none;stroke:var(--lumina);stroke-width:1.4;stroke-dasharray:7 7;vector-effect:non-scaling-stroke}
  .eti{font:600 11px/1 "Albert Sans",sans-serif;letter-spacing:.22em;text-transform:uppercase;fill:var(--var-2)}
  .eti-lenda{font:italic 400 15px/1 "EB Garamond",serif;fill:var(--lumina-2)}
  #cap{position:fixed;left:6vw;bottom:9vh;max-width:40vw;pointer-events:none}
  #cap h2{font:700 clamp(30px,3.6vw,64px)/1.05 "Bona Nova",serif;margin:0;letter-spacing:-.005em}
  #cap h2 em{font-style:italic;font-weight:400;color:var(--lumina-2)}
  #cap p{margin:12px 0 0;font:italic 400 clamp(17px,1.5vw,25px)/1.45 "EB Garamond",serif;color:var(--var-2)}
  #cap .q{font-size:.8em;opacity:.8}
  #tag{position:fixed;left:3vw;top:3.4vh;font:600 12px/1 "Albert Sans",sans-serif;letter-spacing:.22em;text-transform:uppercase;color:var(--var-2);opacity:.7}
  #tag b{color:var(--lumina)}
  #veu{position:fixed;inset:0;pointer-events:none;background:linear-gradient(to top,rgba(14,10,7,.85),rgba(14,10,7,0) 42%)}
  #final{position:fixed;inset:0;opacity:0;background:#000 center/cover no-repeat url(../media/crama-1.jpg)}
  #final::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(14,10,7,.85),rgba(14,10,7,.1) 50%)}
  #fim{position:fixed;left:6vw;bottom:9vh;opacity:0;max-width:44vw}
  #fim h2{font:700 clamp(34px,4.2vw,76px)/1.05 "Bona Nova",serif;margin:0}
  #fim h2 em{font-style:italic;font-weight:400;color:var(--lumina-2)}
  #fim p{margin:12px 0 0;font:italic 400 clamp(17px,1.5vw,25px)/1.45 "EB Garamond",serif;color:var(--var-2)}
</style>
</head>

<script>
(function () {
  "use strict";
  var $ = function (s) { return document.querySelector(s); }, $$ = function (s) { return [].slice.call(document.querySelectorAll(s)); };
  function clamp(x, a, b) { return x < a ? a : x > b ? b : x; }
  function suave(t) { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); }
  function inOut(t) { t = clamp(t, 0, 1); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }

  /* bolți: cada vão com o topo em arco (meia elipse) */
  function bolti(x0, w, n, nascere, cheie, podea) {
    var d = "M" + x0 + " " + podea + " V" + nascere, rx = w / 2, ry = nascere - cheie;
    for (var i = 0; i < n; i++) d += " A" + rx + " " + ry + " 0 0 1 " + (x0 + (i + 1) * w) + " " + nascere;
    return d + " V" + podea + " Z";
  }
  function arcuri(x0, w, n, nascere, cheie, extra) {      // só os arcos (para o contorno branco ou para o extradorso)
    var d = "", rx = w / 2, ry = nascere - cheie;
    for (var i = 0; i < n; i++) d += "M" + (x0 + i * w + extra) + " " + nascere + " A" + (rx - extra) + " " + (ry - extra * 0.6) + " 0 0 1 " + (x0 + (i + 1) * w - extra) + " " + nascere + " ";
    return d;
  }
  function caramizi(x0, w, n, nascere, cheie) {         // tijolos: traços radiais entre intradorso e extradorso
    var d = "", rx = w / 2, ry = nascere - cheie;
    for (var i = 0; i < n; i++) {
      var cx = x0 + i * w + rx;
      for (var a = 8; a < 180; a += 11) {
        var r = a * Math.PI / 180, c = Math.cos(r), s = Math.sin(r);
        d += "M" + (cx - c * rx).toFixed(1) + " " + (nascere - s * ry).toFixed(1) + " L" + (cx - c * (rx + 11)).toFixed(1) + " " + (nascere - s * (ry + 11)).toFixed(1) + " ";
      }
      d += "M" + (cx - rx - 11) + " " + nascere + " A" + (rx + 11) + " " + (ry + 11) + " 0 0 1 " + (cx + rx + 11) + " " + nascere + " ";
    }
    return d;
  }
  function pietre(x0, x1, y0, y1, semente) {            // blocos de pedra irregulares nas paredes das hrube
    var d = "", s = semente;
    function rnd() { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; }
    for (var y = y0; y < y1 - 10; y += 16 + rnd() * 6) {
      var x = x0 + rnd() * 20;
      while (x < x1 - 20) { var l = 24 + rnd() * 30; d += "M" + x.toFixed(0) + " " + y.toFixed(0) + " h" + l.toFixed(0) + " "; x += l + 8 + rnd() * 16; }
    }
    return d;
  }
  var CRAMA = [620, 186.67, 3, 588, 528, 690], L1 = [380, 190, 6, 800, 752, 862], L2 = [620, 180, 6, 950, 912, 1010];
  ["pCramaClip", "cavCrama"].forEach(function (id) { $("#" + id).setAttribute("d", bolti.apply(null, CRAMA)); });
  ["pL1Clip", "cavL1"].forEach(function (id) { $("#" + id).setAttribute("d", bolti.apply(null, L1)); });
  ["pL2Clip", "cavL2"].forEach(function (id) { $("#" + id).setAttribute("d", bolti.apply(null, L2)); });
  $("#lCrama").setAttribute("d", bolti.apply(null, CRAMA));
  $("#lCramaAlb").setAttribute("d", arcuri(620, 186.67, 3, 588, 528, 4));
  $("#lCramaCar").setAttribute("d", caramizi(620, 186.67, 3, 588, 528) + " M807 588 V690 M993 588 V690");
  $("#lL1").setAttribute("d", bolti.apply(null, L1));
  $("#lL1Pietre").setAttribute("d", pietre(390, 1510, 806, 856, 7));
  $("#lL2").setAttribute("d", bolti.apply(null, L2));
  $("#lL2Pietre").setAttribute("d", pietre(630, 1690, 956, 1004, 13));
  $("#lLenda").setAttribute("d", "M1700 950 A90 38 0 0 1 1880 950 M1700 1010 H1880 M1790 912 A90 38 0 0 1 1900 940");
  /* medalhões sob a streașină e mesas da crama com ștergar roșu */
  var med = "", mese = "";
  for (var x = 702; x <= 1222; x += 30) med += '<circle cx="' + x + '" cy="332" r="4" fill="none" stroke="#E7B86A" stroke-width="1" vector-effect="non-scaling-stroke"/>';
  $("#medalioane").innerHTML = med;
  /* copac: ramos em traço fino, como numa gravura */
  var ramos = "", sem = 5;
  function rr() { sem = (sem * 16807) % 2147483647; return (sem - 1) / 2147483646; }
  (function ramo(x, y, ang, len, nivel) {
    var x2 = x + Math.cos(ang) * len, y2 = y - Math.sin(ang) * len;
    ramos += "M" + x.toFixed(1) + " " + y.toFixed(1) + " Q" + ((x + x2) / 2 + (rr() - .5) * len * .25).toFixed(1) + " " + ((y + y2) / 2).toFixed(1) + " " + x2.toFixed(1) + " " + y2.toFixed(1) + " ";
    if (nivel < 6) { ramo(x2, y2, ang + .32 + rr() * .22, len * (.66 + rr() * .1), nivel + 1); ramo(x2, y2, ang - .3 - rr() * .24, len * (.64 + rr() * .1), nivel + 1); if (nivel > 2 && rr() > .55) ramo(x2, y2, ang + (rr() - .5) * .3, len * .55, nivel + 2); }
  })(468, 470, Math.PI / 2 + .03, 82, 0);
  $("#copac").setAttribute("d", ramos);
  [713, 900, 1087].forEach(function (cx) {
    mese += '<rect x="' + (cx - 42) + '" y="660" width="84" height="7" fill="#B22B32"/><path class="fina" d="M' + (cx - 36) + ' 667 V690 M' + (cx + 36) + ' 667 V690"/>';
  });
  $("#cramaMese").innerHTML = mese;
  /* felinare: uma luz em cada vão da crama e nas hrube */
  var fel = [[713, 600], [900, 600], [1087, 600], [475, 812], [855, 812], [1235, 812], [710, 962], [1070, 962], [1430, 962]], fh = "";
  fel.forEach(function (f, i) { fh += '<circle class="fel" data-i="' + i + '" cx="' + f[0] + '" cy="' + f[1] + '" r="26" fill="url(#glow)" opacity="0"/>'; });
  $("#felinare").innerHTML = fh;

  /* pathLength=1 para desenhar cada traço com dashoffset */
  $$(".d").forEach(function (el) {
    var alvos = el.tagName === "g" ? [].slice.call(el.querySelectorAll("path,circle")) : [el];
    alvos.forEach(function (a) { a.setAttribute("pathLength", "1"); a.style.strokeDasharray = "1 1"; });
  });

  var mundo = $("#mundo"), cap = $("#cap");
  /* câmara: [tempo, centro x, centro y, zoom] */
  var K = [[0, 960, 580, 1], [5.4, 960, 580, 1], [7.2, 960, 392, 2.35], [9.0, 952, 392, 2.4], [10.6, 1612, 404, 2.5], [12.0, 1604, 404, 2.55],
    [13.9, 900, 610, 2.05], [15.4, 906, 612, 2.1], [17.2, 1000, 880, 1.28], [19.0, 1010, 884, 1.3], [20.5, 1560, 950, 1.9], [21.6, 1580, 950, 1.95],
    [23.4, 900, 607.5, 3.43]];              /* no fim a foto da crama enche o ecrã exatamente como o #final */
  function camera(t) {
    var i = 0; while (i < K.length - 2 && K[i + 1][0] <= t) i++;
    var a = K[i], b = K[i + 1], f = inOut((t - a[0]) / (b[0] - a[0]));
    if (t >= K[K.length - 1][0]) { a = b = K[K.length - 1]; f = 1; }
    var z = Math.exp(Math.log(a[3]) + (Math.log(b[3]) - Math.log(a[3])) * f);
    var cx = a[1] + (b[1] - a[1]) * f, cy = a[2] + (b[2] - a[2]) * f;
    mundo.setAttribute("transform", "translate(960 540) scale(" + z.toFixed(4) + ") translate(" + (-cx).toFixed(2) + " " + (-cy).toFixed(2) + ")");
  }
  var LEG = [
    [6.2, 9.2, '<h2>Salonul</h2><p>Fețe de masă albe și portretele junimiștilor pe pereți.</p>'],
    [10.0, 12.2, '<h2>Terasa</h2><p>Mese de lemn sub bolta de viță, în curtea din strada Rece.</p>'],
    [13.4, 15.6, '<h2>Crama</h2><p>Dedesubt, bolțile de cărămidă cu arcul alb.</p>'],
    [16.2, 19.2, '<h2>Hrubele</h2><p>„…unele se află pe nivele mai adânci sau mai puțin adânci, ca niște adevărate etaje subterane.” <span class="q">— din istoricul casei</span></p>'],
    [19.6, 22.0, '<h2>Basm <em>sau realitate.</em></h2><p>Legendele spun că labirintul de hrube mergea până dedesubtul Casei Pogor.</p>']
  ];
  var legAtual = -1;
  window.setT = function (t) {
    $$(".d").forEach(function (el) {
      var w = el.getAttribute("data-d").split(" ").map(Number), f = suave((t - w[0]) / (w[1] - w[0]));
      var alvos = el.tagName === "g" ? [].slice.call(el.querySelectorAll("path,circle")) : [el];
      alvos.forEach(function (a) { a.style.strokeDashoffset = (1 - f).toFixed(4); });
      var sai = el.getAttribute("data-out");         // traços do mobiliário saem quando a foto real enche a divisão
      if (sai) { sai = sai.split(" ").map(Number); el.style.opacity = (1 - suave((t - sai[0]) / (sai[1] - sai[0]))).toFixed(3); }
    });
    $$(".d-op").forEach(function (el) {
      var w = el.getAttribute("data-d").split(" ").map(Number), o = suave((t - w[0]) / (w[1] - w[0])), s = el.getAttribute("data-out");
      if (s) { s = s.split(" ").map(Number); o *= 1 - suave((t - s[0]) / (s[1] - s[0])); }
      el.setAttribute("opacity", o.toFixed(3));
    });
    $("#sol").setAttribute("opacity", (suave((t - 2.6) / 2) * 0.9).toFixed(3));
    $("#cav").setAttribute("opacity", suave((t - 2.8) / 1.6).toFixed(3));
    $$(".foto").forEach(function (g) { var w = g.getAttribute("data-f").split(" ").map(Number); g.setAttribute("opacity", suave((t - w[0]) / (w[1] - w[0])).toFixed(3)); });
    $$(".eti-g").forEach(function (g) { var w = g.getAttribute("data-e").split(" ").map(Number); g.setAttribute("opacity", (suave((t - w[0]) / (w[1] - w[0])) * (1 - suave((t - 21.6) / 1))).toFixed(3)); });
    $("#tLenda").setAttribute("opacity", (suave((t - 20.0) / 0.8) * (1 - suave((t - 21.6) / 1))).toFixed(3));
    $$(".fel").forEach(function (c) {
      var i = +c.getAttribute("data-i"), on = suave((t - 4.2 - i * 0.08) / 0.8);
      var fl = 0.72 + 0.16 * Math.sin(t * 6.1 + i * 1.7) + 0.1 * Math.sin(t * 13.7 + i * 3.1);
      c.setAttribute("opacity", (on * fl).toFixed(3));
    });
    camera(t);
    var li = -1;
    LEG.forEach(function (l, i) { if (t >= l[0] && t < l[1]) li = i; });
    if (li !== legAtual) { legAtual = li; cap.innerHTML = li >= 0 ? LEG[li][2] : ""; }
    if (li >= 0) { var l = LEG[li], o = suave((t - l[0]) / 0.5) * (1 - suave((t - l[1] + 0.5) / 0.5)); cap.style.opacity = o.toFixed(3); cap.style.transform = "translateY(" + ((1 - o) * 12).toFixed(1) + "px)"; }
    var fim = suave((t - 22.7) / 0.8);
    $("#final").style.opacity = fim.toFixed(3);
    $("#fim").style.opacity = suave((t - 23.4) / 0.8).toFixed(3);
    $("#fim").style.transform = "translateY(" + ((1 - suave((t - 23.4) / 0.8)) * 12).toFixed(1) + "px)";
    $("#final").style.transform = "scale(" + (1 + 0.05 * suave((t - 23.5) / 2.5)).toFixed(4) + ")";
  };
  var q = /[?&]t=([\d.]+)/.exec(location.search);
  if (q) window.setT(+q[1]);
  else if (!/[?&]gravar/.test(location.search)) {
    var t0 = performance.now();
    (function f(agora) { var t = ((agora - t0) / 1000) % 27; window.setT(t); requestAnimationFrame(f); })(t0);
  }
})();

<style>body{margin:0;min-height:100vh;background:radial-gradient(55% 60% at 50% 115%,rgba(232,98,44,.38),transparent 70%),radial-gradient(45% 55% at 8% 0%,rgba(20,80,90,.55),transparent 70%),#0E0D0B;color:#F2EDE2;font:400 16px/1.5 Inter,system-ui,sans-serif}
.in{max-width:640px;margin:0 auto;padding:12vh 16px 30vh;text-align:center}h1{font:800 clamp(2rem,6vw,3.4rem)/1 "Inter Tight",system-ui,sans-serif;letter-spacing:-.045em;margin:0 0 14px}h1 span{color:#E8622C}
p{color:#B9B3AA}.lg{display:inline-flex;gap:4px;background:rgba(239,234,227,.08);padding:4px;border-radius:999px;margin-top:18px}.lg button{border:0;background:transparent;color:#B9B3AA;padding:8px 14px;border-radius:999px;font:600 14px Inter,sans-serif;cursor:pointer}.lg button[aria-pressed=true]{background:#F2EDE2;color:#0E0D0B}</style></head><body>
<div class="in"><h1>Teste da <span>Sofia</span></h1><p>Esta página fala com o servidor Hetzner (n8n + Claude Haiku). Carrega em «Fala connosco» no canto.</p>
<div class="lg"><button data-l="en" aria-pressed="false">EN</button><button data-l="pt" aria-pressed="true">PT</button><button data-l="ro" aria-pressed="false">RO</button></div></div>

<!-- ===== Assistente do site (avatar C) ===== -->
<style>
.pa-avatar{--size:56px;--ring:3px;--gap:3px;--bg:#0E0D0B;position:relative;display:inline-block;width:var(--size);height:var(--size);border-radius:50%;padding:var(--ring);background:conic-gradient(from 200deg,#E8622C,#D9A441,#1F6F78,#E8622C);box-shadow:0 0 18px rgba(232,98,44,.35);flex:none}
.pa-avatar img{display:block;width:100%;height:100%;object-fit:cover;border-radius:50%;border:var(--gap) solid var(--bg);box-sizing:border-box;background:var(--bg)}
.pa-online{position:absolute;right:2%;bottom:2%;width:calc(var(--size)*.24);height:calc(var(--size)*.24);border-radius:50%;background:#3DDC84;border:calc(var(--size)*.045) solid var(--bg);box-sizing:border-box}
.pa-online::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:2px solid #3DDC84;animation:pa-pulse 2s ease-out infinite}
@keyframes pa-pulse{0%{transform:scale(1);opacity:.8}100%{transform:scale(2);opacity:0}}
@media (prefers-reduced-motion:reduce){.pa-online::after{display:none}}
#paL{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:50;display:flex;align-items:center;gap:10px;background:#141210;color:#F7F3EC;border:1px solid rgba(201,162,86,.35);padding:7px 18px 7px 7px;border-radius:999px;box-shadow:0 12px 34px rgba(0,0,0,.45);cursor:pointer;font:700 15px/1 "Inter Tight",system-ui,sans-serif}
#paL .pa-avatar{--bg:#141210}
#paL:focus-visible{outline:2px solid #E8622C;outline-offset:3px}
#paP{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:51;width:min(380px,calc(100vw - 32px));height:min(600px,calc(100dvh - 32px));display:flex;flex-direction:column;background:#141210;color:#F2EDE2;border:1px solid rgba(201,162,86,.3);border-radius:22px;box-shadow:0 24px 60px rgba(0,0,0,.5);overflow:hidden;font:400 15px/1.5 Inter,system-ui,sans-serif}
#paP[hidden]{display:none!important}
.paH{display:flex;align-items:center;gap:12px;padding:14px 14px 14px 16px;background:radial-gradient(90% 140% at 0% 0%,rgba(20,80,90,.55),transparent 70%),#0E0D0B;border-bottom:1px solid rgba(239,234,227,.08)}
.paH .pa-avatar{--bg:#0E0D0B}
.paH b{display:block;font:800 16px/1.2 "Inter Tight",system-ui,sans-serif;letter-spacing:-.01em}
.paH small{color:#3DDC84;font-size:12.5px;font-weight:600}
.paX{margin-left:auto;background:rgba(239,234,227,.08);border:0;color:#F2EDE2;width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:18px;line-height:1}
.paM{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.paB{max-width:86%;padding:10px 13px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere}
.paB.bot{align-self:flex-start;background:#22201C;border-bottom-left-radius:5px}
.paB.me{align-self:flex-end;background:#E8622C;color:#141210;border-bottom-right-radius:5px;font-weight:500}
.paB a{color:#F4C6A8;font-weight:600}
.paB.wait{color:#A5A19B;font-style:italic}
.paQ{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 10px}
.paQ button{background:transparent;border:1px solid rgba(201,162,86,.45);color:#E6D3A6;border-radius:999px;padding:7px 11px;font:600 12.5px/1.2 Inter,system-ui,sans-serif;cursor:pointer}
.paF{display:flex;gap:8px;padding:12px;border-top:1px solid rgba(239,234,227,.08);background:#0E0D0B}
.paF input{flex:1;min-width:0;background:#1D1A17;border:1px solid rgba(239,234,227,.12);color:#F2EDE2;border-radius:999px;padding:11px 15px;font:400 15px/1.2 Inter,system-ui,sans-serif}
.paF input:focus{outline:2px solid #E8622C;outline-offset:0;border-color:transparent}
.paF button{background:#E8622C;color:#141210;border:0;border-radius:999px;padding:0 16px;font:700 14px/1 "Inter Tight",system-ui,sans-serif;cursor:pointer}
.paF button:disabled{opacity:.5;cursor:default}
.paN{font-size:11px;color:#7d776f;text-align:center;padding:0 12px 10px;background:#0E0D0B}
</style>

const RULES=`You are Sofia, the website chat assistant of Pacheco Studios, an AI solutions company. Stay in this role for the whole conversation.

ABOUT PACHECO STUDIOS
- We build AI agents for businesses. Current focus: dental clinics. We have worked across 5 sectors (healthcare, restaurants, construction, locksmiths, pet grooming) and chose dental clinics.
- We work worldwide; Portugal, Romania and Brazil are where we have done the most projects.
- Method: 1) We find the problem (study and audit: where the clinic loses patients today). 2) We teach the agents with the clinic's own prices, hours, treatments and rules, nothing invented. 3) We switch the agents on and fine-tune them with the clinic. 4) We prove the impact with a monthly dashboard (requests, bookings, attendance, new patients).
- 12 agents in 5 teams: Front desk (24/7 voice receptionist, website chat and WhatsApp agent, missed-call text-back in seconds); Conversion (quote follow-up over 14 days, email agent); Diary and retention (confirmations and reminders with waiting list, reactivation of patients absent 11+ months); Reputation and visibility (Google reviews funnel, AI search visibility report, website audit); Owner management (clinic dashboard, owner assistant on WhatsApp or Telegram).
- Works alongside the software the clinic already uses (diary, patient files, Google Calendar, WhatsApp Business). Nothing to replace.
- Security and protection: GDPR compliance, a data processing agreement (GDPR art. 28), data hosted in the EU, encrypted connections, access only for authorised people, daily backups and continuous monitoring. Never promise 100% protection.
- Usually live in about a week.
- Contacts: meeting booking ${CAL} · email robert@teampachecostudios.com · phone/WhatsApp +351 967 117 357 (Portugal) or +40 723 098 556 (Romania).

HOW TO ANSWER
- Reply in the visitor's language (Portuguese from Portugal, Romanian, English, or whatever they write in).
- Short and warm: 1 to 4 sentences, plain text, no Markdown, no lists unless asked, at most one question per reply.
- Never invent prices, client names, case studies, statistics or promises. If asked about price, say it depends on the clinic and the agents chosen, and offer a meeting.
- When the visitor shows interest or asks to talk to a person, invite them to a meeting with no commitment and give the booking link ${CAL}. Never mention a meeting length in minutes.
- Never say the word "leak". Do not talk about drafts, shadow mode or OK/X approval.
- In Romanian, call the meeting "o întâlnire fără niciun angajament"; in Portuguese, "reunião sem compromisso"; in English, "meeting with no commitment". If something is outside what you know, say so and offer the meeting or the email.
- You only chat here; you cannot book or send anything yourself.`;

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1C1F22">
<title>Magic Key · asistent virtual</title>
<meta name="description" content="Demonstrație: asistentul virtual Magic Key pe WhatsApp, scrieți orice întrebare. Răspunde pe reguli, fără inteligență artificială.">
<style>
{{FONTES}}
:root{
  --grafit:#1C1F22;--grafit-2:#272B30;--hartie:#EFF2EC;--verde:#3BAA35;--verde-txt:#23801F;--verde-dsc:#86DC78;--ambra:#FFB020;
  --text:#121416;--chat-fundo:#EDE6DC;--bolha-in:#FFFFFF;--bolha-out:#D9F7CF;--meta:#59625A;--link:#0E6A84;
  --f-disp:'Tomorrow',Arial,sans-serif;--f-txt:'Red Hat Text',system-ui,-apple-system,sans-serif;--f-mono:'Xanh Mono',ui-monospace,monospace;
  --app-h:100dvh;color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:radial-gradient(120% 80% at 50% 0%,#2A2F34 0%,#16191B 60%,#101213 100%) fixed;color:var(--text);font:500 15px/1.45 var(--f-txt);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--verde-txt);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.scena{height:var(--app-h);display:grid;place-items:center;align-content:center;gap:14px;padding:18px 16px}
.tel{width:min(410px,100%);height:min(880px,calc(var(--app-h) - 72px));background:#0B0D0E;border-radius:52px;padding:11px;
  box-shadow:0 50px 90px -40px rgba(0,0,0,.85),0 0 0 1px #2E3338,inset 0 0 0 1.5px #3A3F45,inset 0 0 0 5px #0B0D0E,inset 0 0 0 6px #23272B;position:relative}
.tel::before{content:"";position:absolute;top:22px;left:50%;width:96px;height:27px;margin-left:-48px;background:#000;border-radius:20px;z-index:4}
.ecra{height:100%;border-radius:42px;overflow:hidden;background:var(--chat-fundo);display:flex;flex-direction:column;position:relative}
.estado{display:flex;justify-content:space-between;align-items:center;padding:17px 30px 8px;background:var(--grafit);color:#fff;font:600 14px/1 var(--f-txt);font-variant-numeric:tabular-nums}
.estado .ico{display:flex;gap:3px;align-items:flex-end}
.estado .ico i{display:block;background:#fff;border-radius:1px;width:3px}
.estado .ico i.bat{width:22px;height:11px;border-radius:3px;margin-left:5px;background:linear-gradient(90deg,#fff 72%,#666 72%)}
.cab{display:flex;align-items:center;gap:10px;padding:8px 10px 10px 8px;background:var(--grafit);color:#fff}
.cab .inapoi{width:22px;height:22px;flex:none;opacity:.85}
.cab .av{width:40px;height:40px;border-radius:50%;background:var(--verde) center/cover;flex:none;box-shadow:0 0 0 2px rgba(255,255,255,.12)}
.cab .id{flex:1;min-width:0}
.cab .nm{font:600 16.5px/1.15 var(--f-disp);letter-spacing:-.01em;display:flex;align-items:center;gap:6px}
.cab .nm svg{width:15px;height:15px;flex:none}
.cab .sb{font-size:12.5px;color:#BFC8BE;transition:color .2s}
.cab .sb.scrie{color:var(--verde-dsc)}
.reset{width:40px;height:40px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;flex:none;color:#D8DED7;transition:background .2s,transform .4s}
.reset:hover{background:rgba(255,255,255,.08)}
.reset:active{transform:rotate(-120deg)}
.reset svg{width:20px;height:20px}
.conv>*{flex:none}
.conv{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:12px 10px 10px;display:flex;flex-direction:column;gap:4px;
  background-color:var(--chat-fundo);background-image:radial-gradient(rgba(28,31,34,.055) 1px,transparent 1.3px);background-size:15px 15px}
.dia{align-self:center;background:#FFFFFFD9;border-radius:8px;padding:5px 10px;font-size:12px;color:var(--meta);margin:2px 0 6px;box-shadow:0 1px 0 rgba(0,0,0,.05)}
.sis{align-self:center;max-width:88%;text-align:center;background:#FFF3CC;color:#4D3900;border-radius:8px;padding:6px 10px;font-size:12.5px;line-height:1.35;margin:0 0 8px}
.b{max-width:84%;padding:7px 9px 5px;border-radius:10px;font-size:15px;line-height:1.4;box-shadow:0 1px 0 rgba(0,0,0,.08);position:relative;overflow-wrap:anywhere}
.b.in{align-self:flex-start;background:var(--bolha-in);border-top-left-radius:3px}
.b.out{align-self:flex-end;background:var(--bolha-out);border-top-right-radius:3px}
.b.in+.b.in,.b.out+.b.out{border-radius:10px}
.b .ora{float:right;margin:7px 0 -3px 10px;font-size:11px;color:var(--meta);display:inline-flex;gap:3px;align-items:center;font-variant-numeric:tabular-nums}
.b .ora svg{color:#2B88C6}
.b a{color:var(--link);font-weight:700}
.b b{font-weight:700}
.b.foto{padding:4px 4px 5px;width:64%}
.b.foto img{display:block;width:100%;border-radius:7px;aspect-ratio:4/5;object-fit:cover;background:#ddd}
.b.foto p{margin:5px 5px 0}
.chips{align-self:stretch;display:flex;flex-wrap:wrap;gap:6px;padding:4px 0 6px 4px}
.chips button{border:0;background:#fff;color:var(--link);font-weight:700;font-size:14px;line-height:1.25;padding:9px 13px;border-radius:18px;box-shadow:0 1px 0 rgba(0,0,0,.1),inset 0 0 0 1px rgba(14,106,132,.18);text-align:left;transition:background .15s,transform .15s}
.chips button:hover{background:#F1FAF8}
.chips button:active{transform:scale(.97)}
.chips button.om{color:#6A4A00;box-shadow:0 1px 0 rgba(0,0,0,.1),inset 0 0 0 1px rgba(154,100,0,.35)}
.chips.folosit button{opacity:.72;pointer-events:none}
.chips.folosit button.ales{opacity:1;background:var(--link);color:#fff}
.card{align-self:flex-start;width:86%;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 0 rgba(0,0,0,.08);font-size:14px;margin:2px 0}
.card .top{background:var(--grafit);color:#fff;padding:9px 12px;font:600 14px/1.2 var(--f-disp);display:flex;gap:8px;align-items:center}
.card .top svg{width:17px;height:17px;flex:none}
.card .top.ok{background:var(--verde-txt)}
.card .top.om{background:#7A5600}
.card dl{margin:0;padding:9px 12px 10px;display:grid;grid-template-columns:auto 1fr;gap:5px 12px}
.card dt{color:var(--meta);font-size:12.5px;padding-top:1px}
.card dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.card dd.gol{color:#7A5600;font-weight:700}
.card .jos{padding:8px 12px;border-top:1px solid #ECEEE9;font-size:12.5px;color:var(--meta);font-family:var(--f-mono)}
.card a.harta{display:block;text-align:center;padding:10px;border-top:1px solid #ECEEE9;color:var(--link);font-weight:700;text-decoration:none}
.tipar{align-self:flex-start;background:#fff;border-radius:10px;border-top-left-radius:3px;padding:11px 13px;display:flex;gap:4px;box-shadow:0 1px 0 rgba(0,0,0,.08)}
.tipar i{width:7px;height:7px;border-radius:50%;background:#9AA39A;animation:p 1s infinite}
.tipar i:nth-child(2){animation-delay:.15s}.tipar i:nth-child(3){animation-delay:.3s}
@keyframes p{0%,60%,100%{opacity:.35;transform:none}30%{opacity:1;transform:translateY(-3px)}}
.scrie{display:flex;gap:7px;padding:7px 8px 10px;align-items:flex-end;background:var(--chat-fundo)}
.scrie .camp{flex:1;min-width:0;display:flex;align-items:center;background:#fff;border-radius:24px;box-shadow:0 1px 0 rgba(0,0,0,.08)}
.scrie input{flex:1;min-width:0;border:0;background:transparent;border-radius:24px;padding:12px 16px;font:500 16px/1.2 var(--f-txt);color:var(--text)}
.scrie input:focus{outline:none}
.scrie .camp:focus-within{box-shadow:0 1px 0 rgba(0,0,0,.08),0 0 0 2px var(--verde-txt)}
.scrie input::placeholder{color:#6E766E}
.scrie button{width:46px;height:46px;border-radius:50%;border:0;background:var(--verde-txt);display:grid;place-items:center;flex:none;transition:transform .15s,background .2s}
.scrie button:hover{background:#1D6E1A}
.scrie button:active{transform:scale(.92)}
.scrie button svg{width:20px;height:20px;fill:#fff;margin-left:2px}
.linha{margin:0;color:#A9B1A8;font-size:12.5px;text-align:center;line-height:1.4;max-width:410px}
.linha b{color:#DCE2DB;font-weight:600}
@keyframes intra{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.intra{animation:intra .28s cubic-bezier(.2,.8,.3,1) both}
.b.out.intra{transform-origin:100% 100%}
.b.in.intra{transform-origin:0 0}
/* entrada coreografada */
.tel{animation:tel .7s cubic-bezier(.2,.8,.2,1) both}
.linha{animation:fade .6s .35s both}
@keyframes tel{from{opacity:0;transform:translateY(26px) scale(.97)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
/* telemóvel real: ecrã inteiro, sem moldura */
@media (max-width:520px){
  body{background:var(--grafit)}
  .scena{padding:0;gap:0;display:block}
  .tel{width:100%;height:var(--app-h);border-radius:0;padding:0;box-shadow:none;background:none;animation:none}
  .tel::before,.estado,.linha{display:none}
  .ecra{border-radius:0}
  .cab{padding-top:calc(10px + env(safe-area-inset-top,0px))}
  .scrie{padding-bottom:calc(9px + env(safe-area-inset-bottom,0px))}
}
@media (max-height:640px) and (min-width:521px){.linha{display:none}.tel{height:calc(var(--app-h) - 24px)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>

  if(c.data||c.ora||c.per)d.c=c;
  if(tem(n,K.programare))d.vreaProg=true;
  var nm=nume(raw,false);if(nm)S.nume=nm;var t=telefon(raw);if(t)S.tel=t;
  cereFlux("cheie",d);
  if(!dinOferta){
    if(d.sit==="pierdut")await bot("Îmi pare rău, se întâmplă des. Facem cheie nouă, cu lama tăiată și cipul programat pe mașină"+(d.v?", și pentru "+veicTxt(d.v):"")+".");
    else if(d.sit==="plus")await bot("Sigur, facem cheie în plus, cu lama tăiată și cipul programat"+(d.v?", pentru "+veicTxt(d.v):"")+".");
    else if(d.sit==="telec")await bot("Da: facem telecomenzi auto noi, învățate de mașină, și reparăm cheile vechi (butoane tocite, carcasă ruptă).");
    else if(d.v)await bot("Facem chei auto cu cip și telecomandă"+(d.v?" pentru "+veicTxt(d.v):"")+". Vă notez o cerere, pas cu pas.");
    else await bot("Facem chei auto cu cip și telecomandă: cheie în plus, cheie nouă când le-ați pierdut pe toate, telecomenzi și reparații.");
  }
  return pas()}
async function startProg(raw,n){
  var c=cand(n),d={};if(c.data||c.ora||c.per)d.c=c;
  var nm=nume(raw,false);if(nm)S.nume=nm;var t=telefon(raw);if(t)S.tel=t;
  cereFlux("prog",d);
  return pas()}
async function handoff(motiv){
  if(S.flow!=="om"){S.d={motiv:S.d&&S.d.motiv||[]};}
  if(motiv&&S.d.motiv.indexOf(motiv)<0)S.d.motiv.push(motiv);
  S.flow="om";S.step=null;S.fails=0;
  await bot("Vă pun în legătură cu proprietarul: vă răspunde personal, aici sau la telefon.");
  return pas()}

/* um passo do fluxo ativo: pergunta o que falta */
async function pas(){
  var d=S.d;
  if(S.flow==="cheie"){
    if(!d.v){S.step="masina";return bot("Pentru ce mașină e? Scrieți marca, modelul și anul (de ex. Dacia Logan 2012).")}
    if(d.v.marca&&FOTO[d.v.marca]&&LUCRARI.indexOf(d.v.marca)>=0&&!S.fotoAratat[d.v.marca]){S.fotoAratat[d.v.marca]=1;await foto(d.v.marca,"O cheie "+MARCI[d.v.marca][0]+" făcută recent la stand.")}
    if(!d.v.an&&!d.v.raw&&!d.anCerut){d.anCerut=1;S.step="an";await bot("Ce an de fabricație are mașina?");return chips(["Nu știu sigur"])}
    if(!d.sit){S.step="sit";await bot("Ce s-a întâmplat?");return chips(["Am pierdut toate cheile","Vreau o cheie în plus","Telecomanda nu mai merge"])}
    if(d.sit==="pierdut"&&d.aduce==null){S.step="aduce";await bot("Când nu mai e nicio cheie, cea nouă se programează direct pe mașină. Pregătiți talonul și buletinul (ce alte acte mai trebuie vă confirmă proprietarul).");await bot("Puteți aduce mașina la stand, în parcarea Selgros?");return chips(["Da, vin cu mașina","Nu pornește"])}
    if(!d.c||(!d.c.ora&&!d.c.per&&!d.c.raw)){return cereCand()}
    if(!S.nume){S.step="nume";return bot("Pe ce nume trec cererea?")}
    if(!S.tel){return cereTel()}
    return gataCheie()}
  if(S.flow==="prog"){
    if(!d.serv){S.step="serv";await bot("Sigur. Pentru ce aveți nevoie?");return chips(["Cheie auto","Telecomandă auto","Cartelă interfon","Chei de casă"])}
    if(!d.c||(!d.c.ora&&!d.c.per&&!d.c.raw)){return cereCand()}
    if(!S.nume){S.step="nume";return bot("Pe ce nume fac programarea?")}
    if(!S.tel){return cereTel()}
    return gataProg()}
  if(S.flow==="om"){
    if(!S.nume){S.step="nume";return bot("Ca să vă poată răspunde: cum vă numiți?")}
    if(!S.tel){return cereTel()}
    return gataOm()}
}
async function cereCand(){
  S.step="cand";var d=S.d;
  if(d.c&&d.c.data&&!d.c.ora){var o=ORAR[d.c.data.getDay()];var zl=eticheta(d.c.data).split(",")[0];
    await bot("La ce oră "+zl+"? Suntem deschiși "+pad(o[0])+":00–"+pad(o[1])+":00.");
    return chips(o[1]-o[0]>6?["10:00","12:30","15:00"]:["10:00","11:30","13:00"])}
  var z=zileDeschise(2);
  await bot("Când ați putea veni la stand? Suntem deschiși "+orarTxt()+".");
  var az=acum();return chips(z.map(function(x,i){var h=i?12:10;if(x.toDateString()===az.toDateString())h=Math.max(h,az.getHours()+1);return cap(eticheta(x).split(",")[0])+" la "+pad(h)+":00"}).concat(["Nu știu încă"]))}
async function cereTel(){S.step="tel";await bot("Și un număr la care vă poate suna proprietarul? Dacă e cel de pe WhatsApp, scrieți «acesta».");return chips(["Acesta, de pe WhatsApp"])}
function candTxt(c){if(!c)return"de stabilit";if(c.raw)return c.raw;var s=c.data?eticheta(c.data):"";if(c.ora)s+=(s?", ora ":"ora ")+c.ora;else if(c.per)s+=(s?", ":"")+c.per;return cap(s||"de stabilit")}
var SIT={pierdut:"Toate cheile pierdute",plus:"Cheie în plus (are o cheie)",telec:"Telecomandă / cheie de reparat"};
async function gataCheie(){var d=S.d;
  var rows=[["Mașină",veicTxt(d.v)||d.v.raw||"de confirmat"],["Situație",SIT[d.sit]||d.sit]];
  if(d.depl&&d.sit!=="pierdut")rows.push(["Deplasare","cerută · de confirmat",true]);
  if(d.sit==="pierdut")rows.push(["La stand",d.aduce?"vine cu mașina":"mașina nu pornește · deplasare de confirmat",!d.aduce]);
  rows.push(["Când",candTxt(d.c)],["Nume",S.nume],["Telefon",S.tel],["Preț","îl confirmă proprietarul",true]);
  await bot("Gata, am notat tot.");
  await card("ok","Cerere cheie auto · transmisă",rows,"Proprietarul vă confirmă prețul și ora.");
  S.flow=null;S.step=null;S.d={};
  await bot(d.sit==="plus"?"Când veniți, aduceți mașina și cheia pe care o aveți. Vă mai pot ajuta cu ceva?":"Vă mai pot ajuta cu ceva?")}
async function gataProg(){var d=S.d;
  await bot("Perfect, am notat programarea.");
  await card("ok","Programare înregistrată",[["Pentru",d.serv],["Când",candTxt(d.c)],["Nume",S.nume],["Telefon",S.tel],["Unde","Stand Magic Key, Selgros Nicolina"]].concat(d.depl?[["Deplasare","cerută · de confirmat",true]]:[]),"Proprietarul vă confirmă ora pe WhatsApp.");
  S.flow=null;S.step=null;S.d={};
  await bot("Vă mai pot ajuta cu ceva?")}
async function gataOm(){var d=S.d;S.predat=true;
  await card("om","Transmis proprietarului",[["Mesaj",d.motiv.length?d.motiv.join(" · "):"Clientul vrea să vorbească cu proprietarul"],["Nume",S.nume],["Telefon",S.tel]],"Vă răspunde personal, în programul standului.");
  S.flow=null;S.step=null;S.d={};
  await bot("I-am transmis mesajul. Între timp, vă pot spune programul, adresa sau pot nota o cerere pentru cheie.")}

/* resposta dentro de um fluxo: devolve true se tratou */
async function inFlux(raw,n){
  var d=S.d,st=S.step;
  var t=telefon(raw);if(t&&st!=="tel")S.tel=t;
  /* sair do fluxo */
  if(/^ (nu acum|renunt|anuleaza|anulez|lasa|lasa balta|nu mai vreau|nu multumesc|nu mersi|nu) $/.test(n)&&st!=="aduce"&&st!=="an"){
    S.flow=null;S.step=null;S.d={};await bot("În regulă, am lăsat cererea deoparte. Vă mai pot ajuta cu ceva?");return true}
  /* pedido de pessoa: passa já, levando o que se sabe */
  if(S.flow!=="om"&&(tem(n,K.om)||tem(n,K.reclam))){var mot=[];if(S.flow==="cheie")mot.push("Cerere cheie "+(veicTxt(d.v)||"").trim());mot.push("«"+raw.slice(0,90)+"»");S.d={motiv:mot};S.flow=null;await handoff(null);return true}
  /* pergunta lateral: responde e volta ao passo */
  var it=detecta(n,raw);
  var intrebare=/\?/.test(raw)||PRIMA.test(n);
  var lat=it&&["orar","adresa","tel","durata","plata","recenzii","robot","interfon","poarta","casa","baterie","pret","depl"].indexOf(it.id)>=0;
  if(lat&&(intrebare||st==="nume"||st==="tel")&&!(st==="cand"&&(it.x.c.data||it.x.c.ora))&&!(st==="masina"&&(it.x.v.marca||it.x.v.model))){
    if(it.id==="depl"){if(S.flow==="om"){if(d.motiv.indexOf("Cere deplasare la mașină")<0)d.motiv.push("Cere deplasare la mașină")}else d.depl=true;await bot("Deplasarea la mașină și costul ei se stabilesc cu proprietarul; o trec în cerere.");S.fails=0;await pas();return true}
    if(it.id==="pret")await bot("Prețul depinde de mașină și de cheie; vi-l confirmă proprietarul, pe baza acestei cereri.");else await raspunde(it,raw,n);
    await bot("Revenind la cerere:");S.fails=0;await pas();return true}
  S.fails=0;
  if(it&&it.id==="programare"&&S.flow==="cheie"&&st!=="cand"&&st!=="nume"&&st!=="tel"){var c0=it.x.c;if(c0.data||c0.ora||c0.per)d.c=c0;await bot("Includ și programarea în aceeași cerere.");await pas();return true}
  if(st==="masina"){var v=veic(n);if(v.marca||v.model||v.an)d.v=v;else d.v={raw:raw.trim().slice(0,40)};
    if(!d.sit){if(tem(n,K.pierd))d.sit="pierdut";else if(tem(n,K.plus))d.sit="plus";else if(tem(n,K.telec))d.sit="telec"}
    var c=cand(n);if(c.data||c.ora)d.c=c;return pas().then(function(){return true})}
  if(st==="an"){var v2=veic(n);if(v2.an)d.v.an=v2.an;else if(/\d{2}/.test(n)){var y=n.match(/(\d{2,4})/)[1];d.v.an=y.length===2?(+y<40?"20"+y:"19"+y):y}
    else if(!/ nu stiu /.test(n)&&!tem(n,K.da.concat(K.nu))&&!d.sit){if(tem(n,K.pierd))d.sit="pierdut";else if(tem(n,K.plus))d.sit="plus";else if(tem(n,K.telec))d.sit="telec"}
    return pas().then(function(){return true})}
  if(st==="sit"){if(tem(n,K.pierd))d.sit="pierdut";else if(tem(n,K.plus)||tem(n,["=una","=alta","inca"]))d.sit="plus";else if(tem(n,K.telec)||tem(n,K.baterie))d.sit="telec";else d.sit=raw.trim().slice(0,60);return pas().then(function(){return true})}
  if(st==="aduce"){d.aduce=!(/ nu /.test(n)||/porneste|tractare|nu pot|imposibil/.test(n));if(!d.aduce)await bot("Am înțeles. Deplasarea la mașină se stabilește cu proprietarul; o trec în cerere.");return pas().then(function(){return true})}
  if(st==="cand"){var cc=cand(n);
    if(!cc.data&&!cc.ora&&!cc.per){
      if(d.c&&d.c.data&&/ (\d{1,2}) /.test(n)){var hx=+n.match(/ (\d{1,2}) /)[1];if(hx>=1&&hx<=7)hx+=12;cc={ora:pad(hx)+":00"}}
      else if(/(nu stiu|oricand|nu inca|mai vedem|cand pot|nu sunt sigur)/.test(n)){d.c={raw:"de stabilit cu proprietarul"};return pas().then(function(){return true})}
      else{d.c={raw:raw.trim().slice(0,50)};return pas().then(function(){return true})}}
    var nc={data:cc.data||(d.c&&d.c.data)||null,ora:cc.ora||null,per:cc.per||null};
    if(nc.data){var o=ORAR[nc.data.getDay()];
      if(!o){d.c=null;await bot(cap(eticheta(nc.data).split(",")[0])+" standul e închis.");return cereCand().then(function(){return true})}
      if(nc.ora&&nc.data.toDateString()===acum().toDateString()&&+nc.ora.slice(0,2)<=acum().getHours()){d.c={data:nc.data};await bot("Ora "+nc.ora+" a trecut deja azi.");return cereCand().then(function(){return true})}
      if(nc.ora){var h=+nc.ora.slice(0,2);if(h<o[0]||h>=o[1]){d.c={data:nc.data};await bot("La "+nc.ora+" e închis: "+eticheta(nc.data).split(",")[0]+" suntem deschiși "+pad(o[0])+":00–"+pad(o[1])+":00.");return cereCand().then(function(){return true})}}}
    else if(nc.ora){var hh=+nc.ora.slice(0,2);if(hh<9||hh>=17){await bot("La "+nc.ora+" e închis. Programul: "+orarTxt()+".");return cereCand().then(function(){return true})}}
    d.c=nc;return pas().then(function(){return true})}
  if(st==="serv"){var s=tem(n,K.interfon)?"Cartelă interfon":tem(n,K.poarta)?"Telecomandă poartă":tem(n,K.casa)?"Chei de casă":tem(n,K.telec)||tem(n,K.baterie)?"Telecomandă auto":(tem(n,K.cheie)||tem(n,K.auto)||veic(n).marca)?"Cheie auto":raw.trim().slice(0,50);
    if(s==="Cheie auto"||s==="Telecomandă auto"){var nd={c:d.c};var vv=veic(n);if(vv.marca||vv.model||vv.an)nd.v=vv;if(s==="Telecomandă auto")nd.sit="telec";else if(tem(n,K.pierd))nd.sit="pierdut";else if(tem(n,K.plus))nd.sit="plus";cereFlux("cheie",nd);await pas();return true}
    d.serv=s;return pas().then(function(){return true})}
  if(st==="nume"){var nm=nume(raw,true);if(nm){S.nume=nm;return pas().then(function(){return true})}
    if(S.tel&&t){return pas().then(function(){return true})}
    await bot("Scrieți-mi doar numele, vă rog (de ex. Andrei Popescu).");return true}
  if(st==="tel"){if(t){S.tel=t}else if(/(acesta|asta|acelasi|aceasta|whatsapp)/.test(n)||tem(n,K.da)){S.tel="numărul de pe WhatsApp"}
    else if(tem(n,K.nu)){S.tel="doar pe WhatsApp"}
    else{await bot("Nu am găsit un număr valid. Scrieți-l ca 07xx xxx xxx, sau «acesta» pentru numărul de pe WhatsApp.");return true}
    var nm2=nume(raw,false);if(nm2&&!S.nume)S.nume=nm2;
    return pas().then(function(){return true})}
  return false}

async function raspunde(it,raw,n){
  switch(it.id){
    case"om":var mot=S.necunoscut.slice(-2).map(function(x){return"«"+x.slice(0,80)+"»"});if(!/proprietar/i.test(raw)||!mot.length)mot.push("«"+raw.slice(0,80)+"»");S.d={motiv:mot};S.flow=null;return handoff(null);
    case"robot":return rRobot();
    case"interfon":return rInterfon(n);
    case"poarta":return rPoarta(n);
    case"baterie":return rBaterie();
    case"casa":return rCasa(n);
    case"depl":return rDepl();
    case"pret":await rPretGeneral(n);
      if(it.auto&&!tem(n,K.interfon)&&!tem(n,K.poarta)){await bot("Vă notez cererea și proprietarul vă răspunde cu prețul exact.");return startCheie(raw,n,true)}
      if(!tem(n,K.interfon)&&!tem(n,K.poarta)&&!tem(n,K.casa)){await bot("Pentru ce vă interesează prețul?");return chips(["Cheie auto","Cartelă interfon","Chei de casă","Telecomandă pentru poartă"])}
      return;
    case"marci":return rMarci(n);
    case"telec":return startCheie(raw,n,false);
    case"cheie":
      if(!it.auto&&!tem(n,K.pierd)&&!tem(n,["=cip","=chip","=briceag","=transponder","=imobilizator"])){await bot("Facem chei auto (cu cip și telecomandă) și duplicate de chei de casă. Pentru ce cheie?");return chips(["Cheie auto","Chei de casă"])}
      return startCheie(raw,n,false);
    case"programare":return startProg(raw,n);
    case"orar":return rOrar(n);
    case"adresa":return rAdresa();
    case"tel":return rTel();
    case"durata":return rDurata();
    case"plata":return rPlata();
    case"recenzii":return rRecenzii();
    case"multum":return bot("Cu plăcere! Vă așteptăm la stand. O zi bună!");
    case"pa":return bot("O zi bună! Ne găsiți la Selgros Nicolina, "+orarTxt()+".");
    case"da":if(S.oferta){var f=S.oferta;S.oferta=null;return f()}return bot("Bine. Cu ce vă pot ajuta?");
    case"nu":if(S.oferta){S.oferta=null;return bot("În regulă. Dacă mai aveți întrebări, scrieți-mi aici.")}return bot("În regulă. Dacă mai aveți întrebări, scrieți-mi aici.");
    case"salut":return bot(S.salutat?"Bună! Cu ce vă pot ajuta?":"Bună ziua! Cu ce vă pot ajuta?");
  }}

async function nuInteleg(raw,n){
  S.fails++;S.necunoscut.push(raw);
  if(S.fails>=2){var mot=S.necunoscut.slice(-2).map(function(x){return"«"+x.slice(0,80)+"»"});S.d={motiv:mot};S.flow=null;return handoff(null)}
  await bot("Nu sunt sigur că am înțeles. Vă pot răspunde imediat la una dintre acestea:");
  chips(sugestii(n))}

async function proceseaza(raw){
  var n=norm(raw);
  if(S.predat&&!S.flow){/* depois da passagem ao dono, o que não entende junta-se ao recado */}
  /* chip «Pot veni eu la stand» / respostas a ofertas */
  if(S.oferta&&/ pot veni eu /.test(n)){S.oferta=null;S.fails=0;return startProg(raw,n)}
  if(S.oferta&&/ (da|transmite|noteaza|sigur|ok|vreau) /.test(n)&&n.trim().split(" ").length<=4){var f=S.oferta;S.oferta=null;S.fails=0;return f()}
  if(S.oferta&&/^ (nu|nu acum|nu multumesc|nu mersi) $/.test(n)){S.oferta=null;return bot("În regulă. Dacă mai aveți întrebări, scrieți-mi aici.")}
  S.oferta=null;
  if(S.flow){var ok=await inFlux(raw,n);if(ok)return}
  var it=detecta(n,raw);
  var tf=telefon(raw);if(!it&&tf){S.tel=tf;S.fails=0;return bot("Am notat numărul "+tf+". Cu ce vă pot ajuta?")}
  if(!it){
    if(S.predat){S.necunoscut.push(raw);return bot("Am adăugat și asta la mesajul pentru proprietar. Vă răspunde personal.")}
    return nuInteleg(raw,n)}
  S.fails=0;
  /* saudação junto com pergunta: cumprimenta primeiro */
  if(it.id!=="salut"&&tem(n,K.salut)&&!S.salutat){S.salutat=true;await bot("Bună ziua!")}
  if(it.id==="salut")S.salutat=true;
  return raspunde(it,raw,n)}

/* ===== envio ===== */
function trimite(txt){
  txt=String(txt).trim();if(!txt)return;
  fecharChips();bula(esc(txt),"out");
  fila.push(txt);if(!ocupado)corre()}
async function corre(){
  ocupado=true;var g=gen;
  while(fila.length&&g===gen){var t=fila.shift();try{await espera(280);await proceseaza(t)}catch(e){if(e!=="reset"){console.error(e)}}}
  if(g===gen)ocupado=false}
$("form").addEventListener("submit",function(e){e.preventDefault();var v=inp.value;inp.value="";trimite(v);inp.focus({preventScroll:true})});

async function start(){
  gen++;fila=[];ocupado=false;novo();conv.innerHTML="";
  var g=gen;
  var d=document.createElement("div");d.className="dia";d.textContent="Astăzi";conv.appendChild(d);
  var s=document.createElement("div");s.className="sis";s.textContent="Demonstrație: scrieți orice, ca un client. Răspunsuri automate, pe reguli.";conv.appendChild(s);
  ocupado=true;
  try{await espera(450);await bot("Bună ziua! Sunt asistentul virtual Magic Key, atelierul de chei auto din Selgros Nicolina.");
    await bot("Întrebați-mă orice: program, adresă, chei auto cu cip, telecomenzi, cartele de interfon sau o programare la stand.");S.salutat=true}catch(e){}
  if(g===gen){ocupado=false;if(fila.length)corre()}}
$("reset").addEventListener("click",function(){start();inp.focus({preventScroll:true})});

/* ===== teclado e altura real ===== */
function altura(){var vv=window.visualViewport;var h=vv?vv.height:window.innerHeight;document.documentElement.style.setProperty("--app-h",h+"px");if(vv&&window.innerWidth<=520){window.scrollTo(0,0)}jos()}
if(window.visualViewport){visualViewport.addEventListener("resize",altura);visualViewport.addEventListener("scroll",function(){if(window.innerWidth<=520)window.scrollTo(0,0)})}
window.addEventListener("resize",altura);altura();
function relogio(){$("ceas").textContent=hm(acum())}relogio();setInterval(relogio,15000);
window.__mk={trimite:trimite,stare:function(){return S},ocupat:function(){return ocupado||fila.length>0}};
start();
})();

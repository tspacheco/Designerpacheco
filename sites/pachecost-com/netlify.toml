# Deploy ESTÁTICO (zip / drag-drop) — SEM build na Netlify.
# O Vite copia este ficheiro de public/ para dist/, por isso o zip de deploy
# leva sempre esta config (só redirects + headers), nunca o comando de build.
# (O netlify.toml da RAIZ do projeto, esse sim com a seccao de build, e para deploy por Git.)

# 404 real (não soft-404): caminhos inexistentes servem a página 404
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    X-XSS-Protection = "1; mode=block"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

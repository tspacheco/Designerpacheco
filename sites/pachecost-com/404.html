<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Página não encontrada — Pacheco Studios</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cossette+Titre:wght@400;700&family=Space+Mono:wght@400;700&family=Inter+Tight:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root{--ink:#0A0A0A;--bone:#E8E5DC;--ash:#7A756A;--ember:#C8612A;--ember-lt:#E0763A;--gold:#B8893A;--line:rgba(232,229,220,.14)}
    *{margin:0;padding:0;box-sizing:border-box}
    body{min-height:100vh;background:var(--ink);color:var(--bone);font-family:'Inter Tight',sans-serif;display:flex;align-items:center;justify-content:center;text-align:center;padding:2rem;overflow:hidden;position:relative}
    .glow{position:absolute;width:60vw;height:60vw;max-width:680px;max-height:680px;border-radius:50%;background:radial-gradient(circle,rgba(200,97,42,.16),transparent 65%);top:50%;left:50%;transform:translate(-50%,-55%);pointer-events:none}
    .wrap{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:1.4rem;max-width:540px}
    .logo{width:42px;height:42px;opacity:.9}
    .code{font-family:'Cossette Titre',serif;font-weight:500;text-transform:uppercase;line-height:.82;letter-spacing:-.02em;font-size:clamp(6rem,22vw,12rem);background:linear-gradient(160deg,var(--ember-lt),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
    .label{font-family:'Space Mono',monospace;font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:var(--ash)}
    h1{font-family:'Cossette Titre',serif;text-transform:uppercase;font-weight:500;line-height:.95;letter-spacing:-.01em;font-size:clamp(1.6rem,4.5vw,2.4rem)}
    p{color:rgba(232,229,220,.6);line-height:1.6;max-width:42ch}
    .btn{margin-top:.6rem;display:inline-flex;align-items:center;gap:.6rem;background:var(--ember);color:#fff;font-weight:500;text-decoration:none;padding:.85rem 1.6rem;border-radius:2px;transition:transform .15s,opacity .2s}
    .btn:hover{transform:translateY(-2px);opacity:.92}
    .home{font-family:'Space Mono',monospace;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ash);text-decoration:none;border-bottom:1px solid var(--line);padding-bottom:2px;transition:color .2s}
    .home:hover{color:var(--bone)}
  </style>
</head>
<body>
  <div class="glow" aria-hidden="true"></div>
  <main class="wrap">
    <img src="logo.svg" alt="Pacheco Studios" class="logo" />
    <span class="code" aria-hidden="true">404</span>
    <span class="label">Erro 404</span>
    <h1>Esta página<br>não existe.</h1>
    <p>O link pode estar errado ou a página foi movida. Vamos levar-te de volta ao estúdio.</p>
    <a href="/" class="btn">Voltar ao início <span aria-hidden="true">→</span></a>
    <a href="https://wa.me/351967117357" target="_blank" rel="noopener" class="home">Falar connosco</a>
  </main>
</body>
</html>

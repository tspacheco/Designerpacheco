<!DOCTYPE html>
<!-- Pacheco Studios — página para onde aponta o QR do cartão (ro.pachecost.com/C → /).
     Três vistas na mesma página, trocadas por #proiecte / #automatizari / #servicii (funciona sem JavaScript).
     NÃO editar index.html: é gerado por gerar.py a partir deste ficheiro, de conteudo/<língua>.json, de portfolio.json
     e de ../../marca/dados.json. -->
<html lang="{{LINGUA}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<link rel="canonical" href="{{URL_PAGINA}}">
<meta name="theme-color" content="#141210">
<meta property="og:type" content="website">
<meta property="og:locale" content="{{OG_LOCALE}}">
<meta property="og:site_name" content="Pacheco Studios">
<meta property="og:title" content="{{OG_TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:url" content="{{URL_PAGINA}}">
<meta property="og:image" content="{{URL_SITE}}media/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23141210'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23E8622C'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?{{FONTES_GOOGLE}}&display=swap">
<script type="application/ld+json">{{JSONLD}}</script>
<style>
{{FONTES}}
/* ═══ tokens: marca do Instagram + derivadas com contraste medido ═══ */
:root{
  --carvao:#141210; --carvao-2:#1D1A17; --osso:#EFEAE3;
  --osso-2:#A5A19B;        /* texto secundário sobre carvão — 7,3:1 */
  --tinta-2:#4D4A47;       /* texto secundário sobre osso — 7,4:1 */
  --laranja:#E8622C;       /* sobre carvão — 5,5:1 */
  --laranja-tinta:#A64923; /* laranja para texto sobre osso — 4,9:1 */
  --linha-e:rgba(239,234,227,.18); --linha-c:rgba(20,18,16,.16); --contorno:rgba(239,234,227,.75);
  --display:"Archivo Black",system-ui,sans-serif;
  --texto:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"Space Mono",ui-monospace,Menlo,Consolas,monospace;
  --gutter:clamp(1rem,5vw,3rem); --max:70rem; --tabs:3.25rem;
  --sair:cubic-bezier(.16,1,.3,1);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-behavior:smooth;background:var(--carvao)}
body{margin:0;background:var(--carvao);color:var(--osso);font:400 1.0625rem/1.55 var(--texto);
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit}
p,h1,h2,h3,h4,ul,ol,figure{margin:0}
ul,ol{padding:0;list-style:none}
svg{flex:none}
:focus-visible{outline:3px solid var(--laranja);outline-offset:3px;border-radius:.4rem}
.saltar{position:absolute;left:1rem;top:-5rem;z-index:50;background:var(--osso);color:var(--carvao);
  padding:.8rem 1.1rem;border-radius:.5rem;font-weight:600;text-decoration:none}
.saltar:focus{top:1rem}
.so-leitor{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.envolver{max-width:var(--max);margin-inline:auto;padding-inline:max(var(--gutter),env(safe-area-inset-left))}

/* ═══ topo + separadores ═══ */
.topo{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding-block:.9rem;
  font:700 .8125rem/1 var(--mono);letter-spacing:.24em;text-transform:uppercase}
.marca{display:inline-flex;align-items:center;gap:.7rem;min-height:2.75rem;text-decoration:none;font:inherit}
.ponto{width:.7rem;height:.7rem;border-radius:50%;background:var(--laranja);flex:none}
.regiao{color:var(--osso-2);font-weight:400}
.tabs{position:sticky;top:0;z-index:30;background:var(--carvao);border-bottom:1px solid var(--linha-e)}
.tabs ul{display:flex;max-width:var(--max);margin-inline:auto;padding-inline:max(var(--gutter),env(safe-area-inset-left))}
.tabs a{flex:1;min-height:var(--tabs);display:grid;place-items:center;text-align:center;text-decoration:none;
  font:700 .75rem/1.2 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--osso-2);
  border-bottom:3px solid transparent;margin-bottom:-1px;padding-inline:.4rem;transition:color .2s,border-color .2s}
.tabs a:hover{color:var(--osso)}
/* separador ativo sem JavaScript: pelo :target da vista (ou de algo dentro dela) */
.tabs a[href="#proiecte"],
body:has(#automatizari:target,#automatizari :target) .tabs a[href="#automatizari"],
body:has(#servicii:target,#servicii :target) .tabs a[href="#servicii"]{color:var(--osso);border-color:var(--laranja)}
body:has(#automatizari:target,#automatizari :target,#servicii:target,#servicii :target) .tabs a[href="#proiecte"]{color:var(--osso-2);border-color:transparent}

/* ═══ vistas: #proiecte por defeito; as outras quando são alvo do endereço ═══ */
.vista{display:none;scroll-margin-top:var(--tabs)}
#proiecte{display:block}
.vista:target,.vista:has(:target){display:block}
:is(.vista:target,.vista:has(:target)) ~ #proiecte{display:none}

.seccao{padding-block:clamp(2.5rem,8vw,5rem)}
.claro{background:var(--osso);color:var(--carvao)}
.eyebrow{font:700 .8125rem/1 var(--mono);letter-spacing:.3em;text-transform:uppercase;color:var(--laranja)}
.claro .eyebrow{color:var(--laranja-tinta)}
h2.afirmacao,h3.afirmacao{font:400 clamp(1.75rem,6.6vw,3.25rem)/1 var(--display);text-transform:uppercase;margin-top:.9rem;max-width:18ch;text-wrap:balance}
.lead{margin-top:1rem;max-width:44ch;color:var(--osso-2);font-size:1.0625rem}
.claro .lead{color:var(--tinta-2)}

/* ═══ quadrados: cada um com a fonte e as cores do próprio site ═══
   Primeira fila = os 3 em destaque, em qualquer ecrã. Telemóvel: grelha de 6 colunas, destaque ocupa 2 (três por fila,
   cartões altos), os outros 3 (dois por fila). Tablet: 3 colunas iguais. Computador: 12 colunas, destaque 4 (mais
   largos, 4:3) e os outros 3 (quadrados) — as duas filas ficam com a mesma altura. */
.grelha{margin-top:1.75rem;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:.75rem}
.grelha > li{grid-column:span 3}
.grelha > li.dest{grid-column:span 2}
.q{position:relative;display:flex;flex-direction:column;justify-content:flex-end;aspect-ratio:1;padding:.9rem;
  border-radius:1rem;background:var(--bg);color:var(--ink);text-decoration:none;overflow:hidden;
  /* contorno fino por dentro: os sites de fundo escuro não se perdem no carvão da página */
  box-shadow:inset 0 0 0 1px rgba(239,234,227,.1),0 .1rem 0 rgba(0,0,0,.25),0 1rem 2rem -1.5rem rgba(0,0,0,.9);
  transition:transform .25s var(--sair),box-shadow .25s}
.q:hover,.q:focus-visible{transform:translateY(-.2rem);
  box-shadow:inset 0 0 0 1px rgba(239,234,227,.2),0 .1rem 0 rgba(0,0,0,.25),0 1.4rem 2.4rem -1.4rem rgba(0,0,0,.9)}
/* sites de clientes cuja fonte e cores ainda não foram tiradas do site: estilo da marca, numa superfície um pouco acima da página */
.q.neutro{background:var(--carvao-2)}
.q:focus-visible{outline-offset:2px}
.q-nome{font-family:var(--f),var(--display);font-weight:var(--w);font-size:calc(clamp(1.35rem,6.6vw,2.1rem) * var(--fs,1));
  line-height:1;text-wrap:balance;overflow-wrap:anywhere;letter-spacing:-.005em}
.q-meta{margin-top:.6rem;padding-top:.5rem;border-top:2px solid var(--ac);font:700 .75rem/1.3 var(--mono);
  letter-spacing:.1em;text-transform:uppercase;opacity:.82}
.q[style*="--f:'Space Mono'"] .q-nome{font-size:calc(clamp(1.1rem,5.4vw,1.6rem) * var(--fs,1));letter-spacing:.02em;text-transform:uppercase;line-height:1.15}
.dest .q{aspect-ratio:2/3;padding:.7rem}
.grelha .dest .q-nome{font-size:calc(clamp(.95rem,4.3vw,1.35rem) * var(--fs,1))}
.grelha .dest .q[style*="--f:'Space Mono'"] .q-nome{font-size:calc(clamp(.85rem,3.9vw,1.2rem) * var(--fs,1))}
/* a linha do tipo/cidade reserva 2 linhas: os três nomes da primeira fila ficam à mesma altura */
.dest .q-meta{margin-top:.5rem;padding-top:.4rem;min-height:calc(2.6em + .4rem + 2px)}
.dest .q-tip,.dest .q-sep{display:none}
.q.teu{background:transparent;color:var(--laranja);border:3px dashed var(--laranja);box-shadow:none;justify-content:center;align-items:center;text-align:center}
.q.teu .q-nome{font-family:var(--display);font-weight:400;text-transform:uppercase}
.q.teu:hover,.q.teu:focus-visible{background:var(--laranja);color:var(--carvao);border-style:solid}
.nota-grelha{margin-top:1.25rem;font:400 .8125rem/1.5 var(--mono);color:var(--osso-2);letter-spacing:.02em}

/* como trabalhamos: sequência real → lista ordenada */
.passos{margin-top:2rem;display:grid;gap:1.75rem;counter-reset:passo}
.passo{counter-increment:passo;border-top:2px solid var(--carvao);padding-top:1rem}
.passo::before{content:counter(passo);display:block;font:400 2.5rem/1 var(--display);color:var(--laranja-tinta);margin-bottom:.6rem}
.passo h3{font:600 1.1875rem/1.3 var(--texto)}
.passo p{margin-top:.35rem;color:var(--tinta-2);max-width:34ch}

/* ═══ automatizações: a dor à vista, o fluxo por baixo ═══ */
.autos{margin-top:2rem;max-width:48rem;display:grid;gap:.75rem}
.auto{border:1px solid var(--linha-e);border-radius:1rem;background:var(--carvao-2);scroll-margin-top:calc(var(--tabs) + .75rem)}
.auto summary{list-style:none;cursor:pointer;padding:1.15rem 1.1rem 1.1rem;display:grid;gap:.7rem;border-radius:1rem}
.auto summary::-webkit-details-marker{display:none}
.auto summary:focus-visible{outline-offset:-3px}
.auto h3{font:400 1.25rem/1.1 var(--display);text-transform:uppercase;letter-spacing:.005em;text-wrap:balance;padding-right:2rem}
.durere{display:grid;gap:.35rem;padding-left:.9rem;border-left:3px solid var(--laranja)}
.durere .eyebrow{font-size:.75rem;letter-spacing:.2em}
.durere q{font-size:1.0625rem;line-height:1.5;color:var(--osso);quotes:"„" "”"}
.vezi{display:inline-flex;align-items:center;gap:.45rem;min-height:2.75rem;font:700 .75rem/1 var(--mono);letter-spacing:.12em;
  text-transform:uppercase;color:var(--laranja)}
.vezi svg{width:1rem;height:1rem;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s var(--sair)}
.auto[open] .vezi svg{transform:rotate(180deg)}
.auto[open] .vezi .abre{display:none}
.auto:not([open]) .vezi .fecha{display:none}
.corpo{padding:.25rem 1.1rem 1.35rem;display:grid;gap:1.35rem;border-top:1px solid var(--linha-e);padding-top:1.15rem;margin-inline:0}
.rotulo{font:700 .75rem/1 var(--mono);letter-spacing:.22em;text-transform:uppercase;color:var(--osso-2);margin:0 0 .7rem}
.fluxo{display:grid;gap:0}
.fluxo li{position:relative;padding:0 0 1.1rem 2.35rem;counter-increment:etapa}
.fluxo li:last-child{padding-bottom:0}
.fluxo li::before{content:counter(etapa);position:absolute;left:0;top:-.05rem;width:1.6rem;height:1.6rem;border-radius:50%;
  background:var(--laranja);color:var(--carvao);font:700 .75rem/1.6rem var(--mono);text-align:center}
.fluxo li:not(:last-child)::after{content:"";position:absolute;left:.72rem;top:1.7rem;bottom:.15rem;border-left:2px dotted var(--laranja);opacity:.7}
.fluxo{counter-reset:etapa}
.obtii{padding:1rem 1.1rem;border-radius:.75rem;background:var(--osso);color:var(--carvao);font-weight:600;line-height:1.45}
.obtii .rotulo{color:var(--laranja-tinta);margin-bottom:.45rem}
.nevoie p{color:var(--osso-2)}
.chips{display:flex;flex-wrap:wrap;gap:.5rem}
.chip{display:inline-flex;align-items:center;min-height:2.75rem;padding:.45rem .9rem;border:2px solid var(--contorno);border-radius:999px;
  font:700 .75rem/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase;text-decoration:none;color:var(--osso);
  transition:background-color .2s,color .2s,border-color .2s}
.chip:hover,.chip:focus-visible{background:var(--osso);color:var(--carvao);border-color:var(--osso)}

/* ═══ mostrar a máquina: o fluxo como fica montado, as regras, quem decide, a mensagem ═══ */
.intro-2{margin-top:.8rem}
.ai{margin-top:1.25rem;border:1px solid var(--linha-e);border-radius:1rem;background:var(--carvao-2)}
.ai summary{list-style:none;cursor:pointer;padding:.9rem 1.1rem;display:flex;justify-content:space-between;align-items:center;gap:1rem;font:600 1rem/1.3 var(--texto);min-height:3rem}
.ai summary::-webkit-details-marker{display:none}
.ai summary>span{display:grid;gap:.35rem}
.ai .ai-e{font-size:.75rem;letter-spacing:.2em}
.ai summary svg{width:1rem;height:1rem;stroke:var(--laranja);fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s var(--sair)}
.ai[open] summary svg{transform:rotate(180deg)}
.ai ol{padding:.25rem 1.1rem 1.1rem;display:grid;gap:.7rem;counter-reset:frase}
.ai li{position:relative;padding-left:2rem;counter-increment:frase;font-size:.9375rem;line-height:1.5}
.ai li::before{content:counter(frase);position:absolute;left:0;top:-.15rem;font:400 1.25rem/1.5 var(--display);color:var(--laranja)}
.legenda{display:flex;flex-wrap:wrap;gap:.5rem .9rem;margin:-.2rem 0 .85rem;font:700 .75rem/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--osso-2)}
.legenda span{display:inline-flex;align-items:center;gap:.4rem}
.legenda i{width:.8rem;height:.8rem;border-radius:.2rem;border:1.5px solid rgba(239,234,227,.55);display:inline-block;background:var(--carvao-2)}
.legenda .l-gatilho{background:#F4E7C9;border-color:#B7811A}
.legenda .l-pessoa{background:#DCE9E0;border-color:#2F6B4F}
.legenda .l-decizie{border-style:dashed}
.bp{display:grid;gap:.6rem}
.bp>li{position:relative;padding-left:1.9rem}
.bp>li::before{content:"";position:absolute;left:.6rem;top:.5rem;bottom:-.95rem;border-left:2px dotted var(--laranja)}
.bp>li:last-child::before{display:none}
.bp>li::after{content:"";position:absolute;left:.2rem;top:.65rem;width:.85rem;height:.85rem;border-radius:50%;background:var(--laranja)}
.no{border:1.5px solid rgba(239,234,227,.35);border-radius:.75rem;padding:.7rem .85rem;background:var(--carvao-2);font-size:.9375rem;line-height:1.35}
.no b{display:block;font-weight:600}
.no small{display:block;color:var(--osso-2);font-size:.8125rem;line-height:1.4;margin-top:.15rem}
.no.gatilho{background:#F4E7C9;color:#141210;border-color:#B7811A}
.no.gatilho small{color:#5B4520}
.no.pessoa{background:#DCE9E0;color:#141210;border-color:#2F6B4F}
.no.pessoa small{color:#2C4A3A}
.no.decizie{border-style:dashed}
.ramuri{display:grid;gap:.45rem;margin-top:.6rem}
.ramuri .no{padding:.55rem .65rem;font-size:.875rem}
.reguli{display:grid;gap:.45rem}
.reguli li{position:relative;padding-left:1.3rem;font-size:.9375rem}
.reguli li::before{content:"";position:absolute;left:0;top:.5rem;width:.55rem;height:.55rem;border-radius:50%;background:var(--laranja)}
.decide{display:grid;gap:.55rem}
.decide div{display:grid;grid-template-columns:5.5rem 1fr;gap:.6rem;font-size:.9375rem;align-items:baseline}
.decide b{font:700 .75rem/1.5 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--laranja)}
.chat{display:grid;gap:.45rem;max-width:28rem}
.msg{padding:.65rem .85rem;border-radius:1rem;font-size:.9375rem;line-height:1.4;color:#141210}
.msg small{display:block;font:700 .75rem/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;margin-bottom:.3rem;color:#4D4A47}
.msg.client,.msg.tu{background:#F2E9DF;margin-right:2rem;border-bottom-left-radius:.3rem}
.msg.asistent{background:#E7F1EA;margin-left:2rem;border-bottom-right-radius:.3rem}
.demo{display:grid;gap:.6rem;justify-items:start;padding-top:1rem;border-top:1px solid var(--linha-e)}
.demo p{font-weight:600}
.secundario{border-color:var(--contorno);color:var(--osso)}
.secundario:hover{background:rgba(239,234,227,.08)}

/* ligam-se entre si: três caminhos, nada mais */
.combos{margin-top:clamp(3rem,10vw,5rem);max-width:48rem}
.drumuri{margin-top:1.5rem;display:grid;gap:1.1rem}
.drum{display:grid;gap:.6rem;padding:1rem 1.1rem;border-radius:1rem;background:var(--carvao-2);border:1px solid var(--linha-e)}
.drum-t{font:600 1rem/1.3 var(--texto)}
.drum-c{display:flex;flex-wrap:wrap;align-items:center;gap:.45rem}
.dc{display:inline-flex;align-items:center;gap:.45rem;white-space:nowrap}
.drum-c svg{width:1rem;height:1rem;stroke:var(--laranja);fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}

/* ═══ o que mais fazemos ═══ */
.svcs{margin-top:2rem;display:grid;gap:.75rem}
.svc{padding:1.2rem 1.1rem 1.25rem;border-radius:1rem;border:1px solid var(--linha-c);background:rgba(20,18,16,.03);display:grid;gap:.5rem}
.svc h3{font:600 1.1875rem/1.25 var(--texto)}
.svc .de-ce{color:var(--laranja-tinta);font-weight:600}
.svc p{color:var(--tinta-2)}
.svc .de-ce{color:var(--laranja-tinta)}
.link-ex{display:inline-flex;align-items:center;gap:.4rem;min-height:2.75rem;font:700 .75rem/1 var(--mono);letter-spacing:.12em;
  text-transform:uppercase;color:var(--carvao);text-decoration:none;text-underline-offset:.3em}
.link-ex:hover{text-decoration:underline}
.link-ex svg{width:1rem;height:1rem;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}

/* ═══ contacto ═══ */
.botao{display:inline-flex;align-items:center;justify-content:center;gap:.6rem;min-height:3.25rem;padding:.85rem 1.45rem;
  border-radius:999px;font:600 1.0625rem/1.2 var(--texto);text-decoration:none;border:2px solid transparent;cursor:pointer;
  touch-action:manipulation;transition:transform .18s var(--sair),background-color .2s}
.botao svg{width:1.3rem;height:1.3rem;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.botao:active{transform:scale(.97)}
.primario{background:var(--laranja);color:var(--carvao)}
.primario:hover{background:#F2773F}
.grande{margin-top:1.75rem;min-height:3.75rem;padding-inline:1.75rem;font-size:1.125rem}
.contactos{margin-top:2.25rem;border-top:1px solid var(--linha-e);max-width:40rem}
.contactos a{display:flex;align-items:center;gap:1rem;min-height:3.5rem;padding-block:.6rem;border-bottom:1px solid var(--linha-e);text-decoration:none}
.contactos svg{width:1.4rem;height:1.4rem;fill:none;stroke:var(--laranja);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.contactos .txt{display:grid;gap:.25rem;min-width:0}
.contactos .qual{font:700 .75rem/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--osso-2)}
.contactos .valor{font-weight:600;overflow-wrap:anywhere;text-decoration:underline;text-decoration-color:var(--linha-e);text-underline-offset:.25em}
.contactos a:hover .valor{text-decoration-color:var(--laranja)}

.rodape{padding-block:2.5rem calc(2.5rem + env(safe-area-inset-bottom));border-top:1px solid var(--linha-e);font-size:.9375rem;color:var(--osso-2)}
.rodape .envolver{display:grid;gap:.6rem}
.rodape a{min-height:2.75rem;display:inline-flex;align-items:center;color:var(--osso)}

/* barra fixa no telemóvel: o WhatsApp sempre à mão depois dos quadrados */
.barra{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:.75rem max(var(--gutter),env(safe-area-inset-left)) calc(.75rem + env(safe-area-inset-bottom));
  pointer-events:none;transform:translateY(115%);transition:transform .32s var(--sair)}
.barra.visivel{transform:none}
.barra .botao{width:100%;pointer-events:auto;box-shadow:0 .5rem 1.5rem rgba(20,18,16,.45),0 0 0 3px var(--carvao)}

/* ═══ movimento (desligado em prefers-reduced-motion) ═══ */
.js .rv{opacity:0;transform:translateY(.9rem);transition:opacity .6s var(--sair),transform .6s var(--sair);transition-delay:calc(var(--i,0) * 45ms)}
.js .rv.vis{opacity:1;transform:none}

@media (min-width:40rem){
  .ramuri{grid-template-columns:repeat(auto-fit,minmax(9rem,1fr))}
  .grelha{grid-template-columns:repeat(3,minmax(0,1fr));gap:1rem}
  .grelha > li,.grelha > li.dest{grid-column:auto}
  .q,.dest .q{padding:1.1rem}
  .dest .q{aspect-ratio:1}
  .q-nome,.grelha .dest .q-nome{font-size:calc(clamp(1.35rem,3vw,2rem) * var(--fs,1))}
  .grelha .dest .q[style*="--f:'Space Mono'"] .q-nome{font-size:calc(clamp(1.1rem,2.4vw,1.6rem) * var(--fs,1))}
  .dest .q-meta{margin-top:.6rem;padding-top:.5rem;min-height:calc(2.6em + .5rem + 2px)}
  .dest .q-tip,.dest .q-sep{display:inline}
  .svcs{grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem}
  .passos{grid-template-columns:repeat(3,1fr);gap:2rem}
}
@media (min-width:48rem){
  .topo{padding-block:1.3rem}
  .tabs a{font-size:.8125rem;letter-spacing:.14em}
  .barra{display:none}
  .auto h3{font-size:1.5rem}
}
@media (min-width:64rem){
  .grelha{grid-template-columns:repeat(12,minmax(0,1fr));gap:1.1rem}
  .grelha > li{grid-column:span 3}
  .grelha > li.dest{grid-column:span 4}
  .dest .q{aspect-ratio:4/3}
  .q-nome{font-size:calc(2rem * var(--fs,1))}
  .grelha .dest .q-nome{font-size:calc(2.5rem * var(--fs,1))}
  .grelha .dest .q[style*="--f:'Space Mono'"] .q-nome{font-size:calc(1.9rem * var(--fs,1))}
  .autos-grelha{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);column-gap:clamp(3rem,6vw,5rem);align-items:start}
  .autos-grelha .cab{position:sticky;top:calc(var(--tabs) + 2rem)}
  .autos-grelha .cab .afirmacao{font-size:clamp(1.75rem,2.7vw,2.6rem)}
  .autos{margin-top:0}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .js .rv{opacity:1!important;transform:none!important;transition:none!important}
  .barra,.botao,.q,.vezi svg{transition:none}
}
</style>
</head>
<body>
<a class="saltar" href="#conteudo">{{SALTAR}}</a>

<header class="envolver topo">
  <h1 class="marca"><span class="ponto" aria-hidden="true"></span>Pacheco Studios</h1>
  <span class="regiao">{{REGIAO}}</span>
</header>

<nav class="tabs" aria-label="{{NAV_LABEL}}">
  <ul>
    <li><a href="#proiecte" data-vista="proiecte" aria-current="page">{{TAB_PROIECTE}}</a></li>
    <li><a href="#automatizari" data-vista="automatizari">{{TAB_AUTOMATIZARI}}</a></li>
    <li><a href="#servicii" data-vista="servicii">{{TAB_SERVICII}}</a></li>
  </ul>
</nav>

<main id="conteudo">
{{VISTA_AUTOMATIZARI}}
{{VISTA_SERVICII}}
{{VISTA_PROIECTE}}
{{CONTACT}}
</main>

{{RODAPE}}

<div class="barra" id="barra" inert>
  <a class="botao primario" href="{{WA_URL}}">{{ICONE_CHAT}}{{CTA}}</a>
</div>

<script>
(function () {
  var raiz = document.documentElement;
  raiz.classList.add('js');
  var calmo = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // separador ativo para leitores de ecrã + abrir a automatização apontada pelo endereço
  var tabs = document.querySelectorAll('.tabs a');
  function vista() {
    var alvo = location.hash.length > 1 ? document.getElementById(location.hash.slice(1)) : null;
    var v = 'proiecte';
    if (alvo) {
      var sec = alvo.closest('.vista');
      if (sec) v = sec.id;
      if (alvo.tagName === 'DETAILS') alvo.open = true;
    }
    tabs.forEach(function (a) {
      if (a.dataset.vista === v) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
  }
  window.addEventListener('hashchange', vista);
  vista();

  // revelações ao descer (quadrados e cartões)
  var rvs = document.querySelectorAll('.rv');
  if (!('IntersectionObserver' in window) || calmo) {
    rvs.forEach(function (e) { e.classList.add('vis'); });
  } else {
    var io = new IntersectionObserver(function (es) {
      es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('vis'); io.unobserve(e.target); } });
    }, { rootMargin: '0px 0px -6% 0px' });
    rvs.forEach(function (e) { io.observe(e); });
  }

  // barra fixa: aparece depois do primeiro ecrã, desaparece no contacto
  var barra = document.getElementById('barra'), contacto = document.getElementById('contact');
  var desceu = false, noContacto = false;
  function atualiza() {
    var ver = desceu && !noContacto;
    barra.classList.toggle('visivel', ver);
    if (ver) barra.removeAttribute('inert'); else barra.setAttribute('inert', '');
  }
  window.addEventListener('scroll', function () { desceu = window.scrollY > window.innerHeight * 0.9; atualiza(); }, { passive: true });
  if ('IntersectionObserver' in window) {
    new IntersectionObserver(function (es) { noContacto = es[0].isIntersecting; atualiza(); }).observe(contacto);
  }
})();
</script>
</body>
</html>

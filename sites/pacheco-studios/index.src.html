<!DOCTYPE html>
<!-- Pacheco Studios — pachecost.com (PT, e /en/) e ro.pachecost.com (RO, para onde aponta o QR do cartão: /C → /).
     Quatro vistas na mesma página, trocadas por #consultanta (a de entrada) / #cazuri / #automatizari / #proiecte
     (funciona sem JavaScript). «O que mais fazemos» (#servicii) vive no fim de #automatizari.
     NÃO editar index.html: é gerado por gerar.py a partir deste ficheiro, de conteudo/<língua>.json, de portfolio.json
     e de ../../marca/dados.json. -->
<html lang="{{LINGUA}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<link rel="canonical" href="{{URL_PAGINA}}">
{{HREFLANG}}
<meta name="theme-color" content="#141210">
<meta property="og:type" content="website">
<meta property="og:locale" content="{{OG_LOCALE}}">
<meta property="og:site_name" content="Pacheco Studios">
<meta property="og:title" content="{{OG_TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:url" content="{{URL_PAGINA}}">
<meta property="og:image" content="{{OG_IMAGE}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23141210'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23E8622C'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?{{FONTES_GOOGLE}}&display=swap">
<script type="application/ld+json">{{JSONLD}}</script>
<!-- estatísticas sem cookies (GoatCounter): o domínio entra no caminho, para separar pachecost.com de ro.pachecost.com -->
<script>window.goatcounter = { path: function (p) { return location.host + p; } };</script>
<script data-goatcounter="{{GOATCOUNTER}}" async src="https://gc.zgo.at/count.js"></script>
<style>
{{FONTES}}
/* ═══ tokens: marca do Instagram + derivadas com contraste medido ═══ */
:root{
  --carvao:#141210; --carvao-2:#1D1A17; --osso:#EFEAE3;
  --osso-2:#A5A19B;        /* texto secundário sobre carvão — 7,3:1 */
  --tinta-2:#4D4A47;       /* texto secundário sobre osso — 7,4:1 */
  --laranja:#E8622C;       /* sobre carvão — 5,5:1 */
  --laranja-tinta:#A64923; /* laranja para texto sobre osso — 4,9:1 */
  --linha-e:rgba(239,234,227,.18); --linha-c:rgba(20,18,16,.16); --contorno:rgba(239,234,227,.75);
  --display:"Archivo Black",system-ui,sans-serif;
  --texto:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"Space Mono",ui-monospace,Menlo,Consolas,monospace;
  --gutter:clamp(1rem,5vw,3rem); --max:70rem; --tabs:3.25rem;
  --sair:cubic-bezier(.16,1,.3,1);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-behavior:smooth;background:var(--carvao)}
body{margin:0;background:var(--carvao);color:var(--osso);font:400 1.0625rem/1.55 var(--texto);
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit}
p,h1,h2,h3,h4,ul,ol,figure{margin:0}
ul,ol{padding:0;list-style:none}
svg{flex:none}
:focus-visible{outline:3px solid var(--laranja);outline-offset:3px;border-radius:.4rem}
.saltar{position:absolute;left:1rem;top:-5rem;z-index:50;background:var(--osso);color:var(--carvao);
  padding:.8rem 1.1rem;border-radius:.5rem;font-weight:600;text-decoration:none}
.saltar:focus{top:1rem}
.so-leitor{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.envolver{max-width:var(--max);margin-inline:auto;padding-inline:max(var(--gutter),env(safe-area-inset-left))}

/* ═══ topo + separadores ═══ */
.topo{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding-block:.9rem;
  font:700 .8125rem/1 var(--mono);letter-spacing:.24em;text-transform:uppercase}
.marca{display:inline-flex;align-items:center;gap:.7rem;min-height:2.75rem;text-decoration:none;font:inherit;white-space:nowrap}
.ponto{width:.7rem;height:.7rem;border-radius:50%;background:var(--laranja);flex:none}
.regiao{color:var(--osso-2);font-weight:400}
/* seletor de língua: PT · EN · RO (a romena vive em ro.pachecost.com) */
.linguas{display:flex;gap:.15rem;flex:none}
.linguas a{min-height:2.75rem;min-width:2.25rem;display:grid;place-items:center;padding-inline:.4rem;border-radius:.6rem;
  font:700 .75rem/1 var(--mono);letter-spacing:.12em;color:var(--osso-2);text-decoration:none;transition:color .2s,background-color .2s}
.linguas a:hover{color:var(--osso);background:var(--carvao-2)}
.linguas a[aria-current]{color:var(--carvao);background:var(--osso)}
@media (max-width:24rem){.topo{letter-spacing:.18em;gap:.5rem}}
.tabs{position:sticky;top:0;z-index:30;background:var(--carvao);border-bottom:1px solid var(--linha-e)}
.tabs ul{display:flex;max-width:var(--max);margin-inline:auto;padding-inline:max(var(--gutter),env(safe-area-inset-left))}
.tabs a{flex:1;min-height:var(--tabs);display:grid;place-items:center;text-align:center;text-decoration:none;
  font:700 .75rem/1.2 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--osso-2);
  border-bottom:3px solid transparent;margin-bottom:-1px;padding-inline:.4rem;transition:color .2s,border-color .2s}
.tabs a:hover{color:var(--osso)}
/* separador ativo sem JavaScript: pelo :target da vista (ou de algo dentro dela) */
.tabs a[href="#consultanta"],
body:has(#cazuri:target,#cazuri :target) .tabs a[href="#cazuri"],
body:has(#automatizari:target,#automatizari :target) .tabs a[href="#automatizari"],
body:has(#proiecte:target,#proiecte :target) .tabs a[href="#proiecte"]{color:var(--osso);border-color:var(--laranja)}
body:has(.vista:target,.vista :target) .tabs a[href="#consultanta"]{color:var(--osso-2);border-color:transparent}
body:has(#consultanta:target,#consultanta :target) .tabs a[href="#consultanta"]{color:var(--osso);border-color:var(--laranja)}

/* ═══ vistas: #consultanta por defeito (é a última no HTML); as outras quando são alvo do endereço ═══ */
.vista{display:none;scroll-margin-top:var(--tabs)}
#consultanta{display:block}
.vista:target,.vista:has(:target){display:block}
:is(.vista:target,.vista:has(:target)) ~ #consultanta{display:none}
html.js .vista{display:none!important}
html.js .vista.ativa{display:block!important}
html.js .tabs a{color:var(--osso-2)!important;border-color:transparent!important}
html.js .tabs a[aria-current]{color:var(--osso)!important;border-color:var(--laranja)!important}

.seccao{padding-block:clamp(2.5rem,8vw,5rem)}
.claro{background:var(--osso);color:var(--carvao)}
.eyebrow{font:700 .8125rem/1 var(--mono);letter-spacing:.3em;text-transform:uppercase;color:var(--laranja)}
.claro .eyebrow{color:var(--laranja-tinta)}
h1.afirmacao,h2.afirmacao,h3.afirmacao{font:400 clamp(1.75rem,6.6vw,3.25rem)/1 var(--display);text-transform:uppercase;margin-top:.9rem;max-width:18ch;text-wrap:balance}
.lead{margin-top:1rem;max-width:44ch;color:var(--osso-2);font-size:1.0625rem}
.claro .lead{color:var(--tinta-2)}

/* ═══ em destaque: três sites, cada um com a fonte e as cores do próprio site ═══
   Telemóvel: 6 colunas, cada um ocupa 2 (cartões altos). Tablet: 3 colunas. Computador: 12 colunas, cada um 4 (4:3).
   Os outros sites ficam dentro do tipo de negócio deles: o número de trabalhos não é o assunto. */
.rotulo.selecao{margin-top:2.5rem}
.grelha{margin-top:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:.75rem}
.grelha > li.dest{grid-column:span 2}
.q{position:relative;display:flex;flex-direction:column;justify-content:flex-end;aspect-ratio:1;padding:.9rem;
  border-radius:1rem;background:var(--bg);color:var(--ink);text-decoration:none;overflow:hidden;
  /* contorno fino por dentro: os sites de fundo escuro não se perdem no carvão da página */
  box-shadow:inset 0 0 0 1px rgba(239,234,227,.1),0 .1rem 0 rgba(0,0,0,.25),0 1rem 2rem -1.5rem rgba(0,0,0,.9);
  transition:transform .25s var(--sair),box-shadow .25s}
.q:hover,.q:focus-visible{transform:translateY(-.2rem);
  box-shadow:inset 0 0 0 1px rgba(239,234,227,.2),0 .1rem 0 rgba(0,0,0,.25),0 1.4rem 2.4rem -1.4rem rgba(0,0,0,.9)}
/* sites de clientes cuja fonte e cores ainda não foram tiradas do site: estilo da marca, numa superfície um pouco acima da página */
.q.neutro{background:var(--carvao-2)}
.q:focus-visible{outline-offset:2px}
.q-nome{font-family:var(--f),var(--display);font-weight:var(--w);font-size:calc(clamp(1.35rem,6.6vw,2.1rem) * var(--fs,1));
  line-height:1;text-wrap:balance;overflow-wrap:anywhere;letter-spacing:-.005em}
.q-meta{margin-top:.6rem;padding-top:.5rem;border-top:2px solid var(--ac);font:700 .75rem/1.3 var(--mono);
  letter-spacing:.1em;text-transform:uppercase;opacity:.82}
.q[style*="--f:'Space Mono'"] .q-nome{font-size:calc(clamp(1.1rem,5.4vw,1.6rem) * var(--fs,1));letter-spacing:.02em;text-transform:uppercase;line-height:1.15}
.dest .q{aspect-ratio:2/3;padding:.7rem}
.grelha .dest .q-nome{font-size:calc(clamp(.95rem,4.3vw,1.35rem) * var(--fs,1))}
.grelha .dest .q[style*="--f:'Space Mono'"] .q-nome{font-size:calc(clamp(.85rem,3.9vw,1.2rem) * var(--fs,1))}
/* a linha do tipo/cidade reserva 2 linhas: os três nomes da primeira fila ficam à mesma altura */
.dest .q-meta{margin-top:.5rem;padding-top:.4rem;min-height:calc(2.6em + .4rem + 2px)}
.dest .q-tip,.dest .q-sep{display:none}

/* ═══ por tipo de negócio: o que o cliente pergunta, o que o site responde ═══ */
.setores-grelha{margin-top:clamp(3.5rem,11vw,6rem)}
.setores{margin-top:1.5rem;max-width:48rem;display:grid;gap:.75rem}
.setor-tipos{font:700 .75rem/1.35 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--osso-2);padding-right:2rem}
.durere .decide{font-size:1rem;line-height:1.5;color:var(--osso)}
/* as perguntas do cliente e as respostas do site: no telemóvel uma por baixo da outra; com largura, ligadas por
   pontos, como numa ementa */
.perguntas{display:grid;gap:.85rem}
.perguntas > div{display:grid;gap:.2rem;padding-left:.9rem;border-left:2px solid var(--laranja)}
.perguntas dt{font-size:.9375rem;line-height:1.45;color:var(--osso-2)}
.perguntas dd{margin:0;font-weight:600;line-height:1.45}
.setor .rotulo{line-height:1.45}
/* um site feito, pequeno, com a fonte e as cores dele */
.exemplos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.5rem}
.ex{position:relative;display:flex;flex-direction:column;justify-content:flex-end;height:100%;min-height:6.25rem;padding:.75rem .8rem .7rem;
  border-radius:.75rem;background:var(--bg);color:var(--ink);text-decoration:none;box-shadow:inset 0 0 0 1px rgba(239,234,227,.14);
  transition:transform .2s var(--sair),box-shadow .2s}
.ex.neutro{background:var(--carvao)}
.ex:hover,.ex:focus-visible{transform:translateY(-2px);box-shadow:inset 0 0 0 1px rgba(239,234,227,.35),0 .8rem 1.4rem -1rem rgba(0,0,0,.9)}
.ex-nome{font-family:var(--f),var(--display);font-weight:var(--w);font-size:1.0625rem;line-height:1.1;overflow-wrap:anywhere;padding-right:1.4rem}
.ex[style*="--f:'Space Mono'"] .ex-nome{font-size:.9375rem;text-transform:uppercase;letter-spacing:.02em;line-height:1.2}
.ex-meta{margin-top:.5rem;padding-top:.4rem;border-top:2px solid var(--ac);font:700 .75rem/1.3 var(--mono);letter-spacing:.06em;text-transform:uppercase}
.ex svg{position:absolute;right:.65rem;top:.65rem;width:1rem;height:1rem;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* ═══ mais sites: os outros, em grelha, 2 por fila no telemóvel e 3 com largura (6 sites = duas filas cheias) ═══ */
.mais{margin-top:clamp(3.5rem,11vw,6rem)}
.grelha-mais{margin-top:1.5rem;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.75rem}

/* ═══ o que fica ao nosso cuidado: compromissos, não uma sequência (sem números) ═══ */
.cuidado{margin-top:clamp(3.5rem,11vw,6rem);padding-top:clamp(2rem,6vw,3rem);border-top:1px solid var(--linha-e)}
.compromissos{margin-top:1.75rem;display:grid;gap:1.4rem 2.5rem}
.compromissos li{padding-top:.9rem;border-top:2px solid var(--linha-e)}
.compromissos h3{font:600 1.1875rem/1.3 var(--texto);color:var(--osso)}
.compromissos p{margin-top:.35rem;color:var(--osso-2);max-width:38ch}

/* como trabalhamos: sequência real → lista ordenada */
.passos{margin-top:2rem;display:grid;gap:1.75rem;counter-reset:passo}
.passo{counter-increment:passo;border-top:2px solid var(--carvao);padding-top:1rem}
.passo::before{content:counter(passo);display:block;font:400 2.5rem/1 var(--display);color:var(--laranja-tinta);margin-bottom:.6rem}
.passo h3{font:600 1.1875rem/1.3 var(--texto)}
.passo p{margin-top:.35rem;color:var(--tinta-2);max-width:34ch}

/* ═══ automatizações: a dor à vista, o fluxo por baixo ═══ */
.autos{margin-top:2rem;max-width:48rem;display:grid;gap:.75rem}
.auto,.setor{border:1px solid var(--linha-e);border-radius:1rem;background:var(--carvao-2);scroll-margin-top:calc(var(--tabs) + .75rem)}
.auto summary,.setor summary{list-style:none;cursor:pointer;padding:1.15rem 1.1rem 1.1rem;display:grid;gap:.7rem;border-radius:1rem}
.auto summary::-webkit-details-marker,.setor summary::-webkit-details-marker{display:none}
.auto summary:focus-visible,.setor summary:focus-visible{outline-offset:-3px}
.auto h3,.setor h3{font:400 1.25rem/1.1 var(--display);text-transform:uppercase;letter-spacing:.005em;text-wrap:balance;padding-right:2rem}
.durere{display:grid;gap:.35rem;padding-left:.9rem;border-left:3px solid var(--laranja)}
.durere .eyebrow{font-size:.75rem;letter-spacing:.2em}
.durere q{font-size:1.0625rem;line-height:1.5;color:var(--osso)}
q{quotes:"«" "»"} q:lang(en){quotes:"“" "”"} q:lang(ro){quotes:"„" "”"}
.vezi{display:inline-flex;align-items:center;gap:.45rem;min-height:2.75rem;font:700 .75rem/1 var(--mono);letter-spacing:.12em;
  text-transform:uppercase;color:var(--laranja)}
.vezi svg{width:1rem;height:1rem;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s var(--sair)}
.auto[open] .vezi svg,.setor[open] .vezi svg{transform:rotate(180deg)}
.auto[open] .vezi .abre,.setor[open] .vezi .abre{display:none}
.auto:not([open]) .vezi .fecha,.setor:not([open]) .vezi .fecha{display:none}
.corpo{padding:.25rem 1.1rem 1.35rem;display:grid;gap:1.35rem;border-top:1px solid var(--linha-e);padding-top:1.15rem;margin-inline:0}
.rotulo{font:700 .75rem/1 var(--mono);letter-spacing:.22em;text-transform:uppercase;color:var(--osso-2);margin:0 0 .7rem}
.obtii{padding:1rem 1.1rem;border-radius:.75rem;background:var(--osso);color:var(--carvao);font-weight:600;line-height:1.45}
.obtii .rotulo{color:var(--laranja-tinta);margin-bottom:.45rem}
.nevoie p{color:var(--osso-2)}
.chips{display:flex;flex-wrap:wrap;gap:.5rem}
.chip{display:inline-flex;align-items:center;min-height:2.75rem;padding:.45rem .9rem;border:2px solid var(--contorno);border-radius:999px;
  font:700 .75rem/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase;text-decoration:none;color:var(--osso);
  transition:background-color .2s,color .2s,border-color .2s}
.chip:hover,.chip:focus-visible{background:var(--osso);color:var(--carvao);border-color:var(--osso)}

/* ═══ mostrar a máquina: o fluxo como fica montado, as regras, quem decide, a mensagem ═══ */
.intro-2{margin-top:.8rem}
.ai{margin-top:1.25rem;border:1px solid var(--linha-e);border-radius:1rem;background:var(--carvao-2)}
.ai summary{list-style:none;cursor:pointer;padding:.9rem 1.1rem;display:flex;justify-content:space-between;align-items:center;gap:1rem;font:600 1rem/1.3 var(--texto);min-height:3rem}
.ai summary::-webkit-details-marker{display:none}
.ai summary>span{display:grid;gap:.35rem}
.ai .ai-e{font-size:.75rem;letter-spacing:.2em}
.ai summary svg{width:1rem;height:1rem;stroke:var(--laranja);fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s var(--sair)}
.ai[open] summary svg{transform:rotate(180deg)}
.ai ol{padding:.25rem 1.1rem 1.1rem;display:grid;gap:.7rem;counter-reset:frase}
.ai li{position:relative;padding-left:2rem;counter-increment:frase;font-size:.9375rem;line-height:1.5}
.ai li::before{content:counter(frase);position:absolute;left:0;top:-.15rem;font:400 1.25rem/1.5 var(--display);color:var(--laranja)}
/* botão «Ver o esquema»: uma miniatura da tela do esquema */
.ver-esquema{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:.9rem;min-height:4.75rem;
  padding:.7rem 1rem .7rem .7rem;border-radius:.9rem;background:#FAF8F4;color:#1D2330;text-decoration:none;
  box-shadow:0 0 0 1px rgba(239,234,227,.25);transition:transform .2s var(--sair),box-shadow .2s}
.ver-esquema:hover{transform:translateY(-2px);box-shadow:0 0 0 1px rgba(239,234,227,.5),0 .9rem 1.8rem -1rem rgba(0,0,0,.85)}
.ver-esquema .mini{position:relative;width:4rem;height:3.4rem;border-radius:.5rem;border:1px solid #E2DCD2;display:grid;
  justify-items:center;align-content:center;gap:.3rem;background:#FAF8F4 radial-gradient(rgba(20,18,16,.18) 1px,transparent 1.2px) 0 0/8px 8px}
.ver-esquema .mini::before{content:"";position:absolute;left:50%;top:.55rem;bottom:.55rem;border-left:1px solid #B5AEA2}
.ver-esquema .mini i{position:relative;display:block;width:2.3rem;height:.55rem;border-radius:.18rem;background:#fff;border:1px solid #CFC8BC}
.ver-esquema .mini i:first-child{background:#FBF0D9;border-color:#D2A94E}
.ver-esquema .mini i:last-child{background:#E6F2EC;border-color:#3E8B6C}
.ver-esquema .txt b{display:block;font:400 1.0625rem/1.1 var(--display);text-transform:uppercase;letter-spacing:.01em}
.ver-esquema .txt small{display:block;margin-top:.3rem;font-size:.8125rem;line-height:1.35;color:#5F5A52}
.ver-esquema svg{width:1.3rem;height:1.3rem;fill:none;stroke:#A64923;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* ═══ esquema de cada automação: cartão no meio do ecrã, desenhado como a proposta Be Legend ═══ */
dialog.esquema{--e-fundo:#FAF8F4;--e-ponto:rgba(20,18,16,.14);--e-linha:#B5AEA2;--e-borda:#CFC8BC;--e-tinta:#1D2330;
  --e-tinta-2:#5F5A52;--e-ambar:#FBF0D9;--e-ambar-b:#D2A94E;--e-verde:#E6F2EC;--e-verde-b:#3E8B6C;--e-bege:#EFEBE3;
  --e-marinho:#1B2334;
  width:min(46rem,calc(100% - 1.5rem));max-width:none;max-height:calc(100dvh - 1.5rem);margin:auto;padding:0;border:0;
  border-radius:1.1rem;background:#fff;color:var(--e-tinta);overflow:auto;overscroll-behavior:contain;
  box-shadow:0 2rem 5rem rgba(0,0,0,.55)}
dialog.esquema[open]{animation:esq-surge .3s var(--sair)}
dialog.esquema::backdrop{background:rgba(12,11,10,.74);backdrop-filter:blur(3px)}
@keyframes esq-surge{from{opacity:0;transform:translateY(.8rem) scale(.985)}}
html:has(dialog.esquema[open]){overflow:hidden}
/* sem JavaScript: o endereço #esquema-… mostra o cartão na mesma */
html:not(.js) dialog.esquema:target{display:block;position:fixed;inset:.75rem;z-index:80;box-shadow:0 0 0 100vmax rgba(12,11,10,.74)}
.folha{padding:1.25rem 1.1rem 1rem}
.folha-cab{position:relative;padding-right:3.25rem}
.folha-cab .eyebrow{color:var(--laranja-tinta);letter-spacing:.2em;line-height:1.45}
.folha-cab h2{margin-top:.6rem;font:400 clamp(1.45rem,5.6vw,2.2rem)/1.02 var(--display);text-transform:uppercase;letter-spacing:.005em;color:var(--e-tinta);text-wrap:balance}
.folha-cab>p:last-of-type{margin-top:.6rem;max-width:54ch;font-size:.9375rem;line-height:1.5;color:var(--e-tinta-2)}
.fechar{position:absolute;right:0;top:-.2rem;width:2.75rem;height:2.75rem;display:grid;place-items:center;border-radius:50%;
  border:1px solid var(--e-borda);background:#fff;color:var(--e-tinta);text-decoration:none}
.fechar:hover{background:var(--e-fundo)}
.fechar svg{width:1.1rem;height:1.1rem;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
.tela{container-type:inline-size;margin-top:1.1rem;padding:1.4rem .8rem;border:1px solid #E7E2D9;border-radius:.9rem;
  background-color:var(--e-fundo);background-image:radial-gradient(var(--e-ponto) 1px,transparent 1.25px);background-size:16px 16px}
.fluxo{display:grid;justify-items:center}
.fluxo>li{position:relative;width:100%;display:grid;justify-items:center;padding-top:1.85rem}
.fluxo>li:first-child{padding-top:0}
/* seta entre passos */
.fluxo>li+li::before{content:"";position:absolute;top:.2rem;left:50%;height:1.3rem;border-left:1.5px solid var(--e-linha)}
.fluxo>li+li::after{content:"";position:absolute;top:1.35rem;left:calc(50% - 4.25px);border-style:solid;border-width:6px 5px 0;
  border-color:var(--e-linha) transparent transparent}
.n{position:relative;width:min(100%,22rem);display:grid;grid-template-columns:auto 1fr;align-items:center;gap:.65rem;
  padding:.6rem .8rem .6rem .6rem;background:#fff;border:1px solid var(--e-borda);border-radius:.55rem;
  box-shadow:0 1px 0 rgba(20,18,16,.05)}
/* portas do motor de fluxo, como no desenho da proposta */
.n::before,.n::after{content:"";position:absolute;top:50%;width:7px;height:7px;margin-top:-3.5px;border-radius:50%;
  background:#fff;border:1.5px solid var(--e-linha)}
.n::before{left:-4.5px} .n::after{right:-4.5px}
.n .ic{width:1.8rem;height:1.8rem;display:grid;place-items:center;border-radius:.4rem;background:#F1EEE8}
.n .ic svg{width:1rem;height:1rem;fill:none;stroke:var(--e-tinta);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.n b{display:block;font-weight:600;font-size:.875rem;line-height:1.25}
.n small{display:block;margin-top:.15rem;font-size:.75rem;line-height:1.35;color:var(--e-tinta-2)}
.n .so{display:block;font-size:.8125rem;line-height:1.35}
.n.gatilho{background:var(--e-ambar);border-color:var(--e-ambar-b)} .n.gatilho .ic{background:#F3DFAE}
.n.gatilho .ic svg{stroke:#7A5712}
.n.pessoa{background:var(--e-verde);border-color:var(--e-verde-b)} .n.pessoa .ic{background:#CDE5D8}
.n.pessoa .ic svg{stroke:#2C6A51}
.n.espera{width:min(100%,16rem);background:var(--e-bege);border-color:#DCD4C7;box-shadow:none}
.n.espera .ic{background:transparent} .n.espera b{color:var(--e-tinta-2)}
.n.decisao{border:1.5px dashed var(--e-tinta)} .n.decisao .ic{background:transparent}
/* ramos da decisão: em árvore no telemóvel… */
.ramos{position:relative;width:min(100%,22rem);margin-top:.9rem;padding-left:1.3rem;display:grid;gap:.75rem}
.ramos>li{position:relative;display:grid;grid-template-rows:auto 1fr;justify-items:start;gap:.45rem}
/* a linha da árvore faz-se aos bocados, um por ramo, e acaba no último */
.ramos>li::before{content:"";position:absolute;left:-.85rem;top:.95rem;width:.85rem;border-top:1.5px solid var(--e-linha)}
.ramos>li::after{content:"";position:absolute;left:-.85rem;top:-.75rem;height:1.7rem;border-left:1.5px solid var(--e-linha)}
.ramos>li:first-child::after{top:-.9rem;height:1.85rem}
.ramos .n{width:100%;height:100%}
.ramos .pilula{align-self:start}
.pilula{display:inline-block;padding:.5rem .85rem;border-radius:999px;background:var(--e-marinho);color:#fff;
  font:600 .75rem/1.1 var(--texto);letter-spacing:.01em}
/* …e em linha quando há largura, com a barra de ligação por cima (como as situações da proposta) */
@container (min-width:34rem){
  .ramos{width:100%;margin-top:0;padding:1.45rem 0 0;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:.8rem}
  .ramos::before{content:"";position:absolute;left:calc(100% / var(--n) / 2);right:calc(100% / var(--n) / 2);top:.7rem;
    border-top:1.5px solid var(--e-linha)}
  .ramos::after{content:"";position:absolute;left:50%;top:0;height:.7rem;border-left:1.5px solid var(--e-linha)}
  .ramos>li{justify-items:center}
  .ramos>li::before{left:50%;top:-.75rem;width:0;height:.75rem;border-top:0;border-left:1.5px solid var(--e-linha)}
  .ramos>li::after{content:none}
}
.folha-pe{margin-top:.9rem;display:grid;gap:.7rem}
.legenda-e{display:flex;flex-wrap:wrap;gap:.45rem 1rem;font-size:.75rem;color:var(--e-tinta-2)}
.legenda-e li{display:inline-flex;align-items:center;gap:.4rem}
.legenda-e .l{width:.8rem;height:.8rem;border-radius:.2rem;border:1px solid var(--e-borda);background:#fff}
.legenda-e .l.gatilho{background:var(--e-ambar);border-color:var(--e-ambar-b)}
.legenda-e .l.pessoa{background:var(--e-verde);border-color:var(--e-verde-b)}
.legenda-e .l.decisao{border:1.5px dashed var(--e-tinta)}
.legenda-e .l.espera{background:var(--e-bege);border-color:#DCD4C7}
.folha-pe>p{padding-top:.7rem;border-top:1px solid #E7E2D9;font:400 .75rem/1.4 var(--mono);color:var(--e-tinta-2)}
.reguli{display:grid;gap:.45rem}
.reguli li{position:relative;padding-left:1.3rem;font-size:.9375rem}
.reguli li::before{content:"";position:absolute;left:0;top:.5rem;width:.55rem;height:.55rem;border-radius:50%;background:var(--laranja)}
.decide{display:grid;gap:.55rem}
.decide div{display:grid;grid-template-columns:5.5rem 1fr;gap:.6rem;font-size:.9375rem;align-items:baseline}
.decide b{font:700 .75rem/1.5 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--laranja)}
.chat{display:grid;gap:.45rem;max-width:28rem}
.msg{padding:.65rem .85rem;border-radius:1rem;font-size:.9375rem;line-height:1.4;color:#141210}
.msg small{display:block;font:700 .75rem/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;margin-bottom:.3rem;color:#4D4A47}
.msg.client,.msg.tu{background:#F2E9DF;margin-right:2rem;border-bottom-left-radius:.3rem}
.msg.asistent{background:#E7F1EA;margin-left:2rem;border-bottom-right-radius:.3rem}
.demo{display:grid;gap:.6rem;justify-items:start;padding-top:1rem;border-top:1px solid var(--linha-e)}
.demo p{font-weight:600}
/* .botao vem depois e repõe a borda transparente: a borda do secundário precisa de mais peso */
.botao.secundario{border-color:var(--contorno);color:var(--osso)}
.botao.secundario:hover{background:rgba(239,234,227,.08)}

/* ligam-se entre si: três caminhos, nada mais */
.combos{margin-top:clamp(3rem,10vw,5rem);max-width:48rem}
.drumuri{margin-top:1.5rem;display:grid;gap:1.1rem}
.drum{display:grid;gap:.6rem;padding:1rem 1.1rem;border-radius:1rem;background:var(--carvao-2);border:1px solid var(--linha-e)}
.drum-t{font:600 1rem/1.3 var(--texto)}
.drum-c{display:flex;flex-wrap:wrap;align-items:center;gap:.45rem}
.dc{display:inline-flex;align-items:center;gap:.45rem;white-space:nowrap}
.drum-c svg{width:1rem;height:1rem;stroke:var(--laranja);fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}

/* ═══ o que mais fazemos ═══ */
.svcs{margin-top:2rem;display:grid;gap:.75rem}
.svc{padding:1.2rem 1.1rem 1.25rem;border-radius:1rem;border:1px solid var(--linha-c);background:rgba(20,18,16,.03);display:grid;gap:.5rem}
.svc h3{font:600 1.1875rem/1.25 var(--texto)}
.svc .de-ce{color:var(--laranja-tinta);font-weight:600}
.svc p{color:var(--tinta-2)}
.svc .de-ce{color:var(--laranja-tinta)}
.link-ex{display:inline-flex;align-items:center;gap:.4rem;min-height:2.75rem;font:700 .75rem/1 var(--mono);letter-spacing:.12em;
  text-transform:uppercase;color:var(--carvao);text-decoration:none;text-underline-offset:.3em}
.link-ex:hover{text-decoration:underline}
.link-ex svg{width:1rem;height:1rem;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}

/* ═══ contacto ═══ */
.botao{display:inline-flex;align-items:center;justify-content:center;gap:.6rem;min-height:3.25rem;padding:.85rem 1.45rem;
  border-radius:999px;font:600 1.0625rem/1.2 var(--texto);text-decoration:none;border:2px solid transparent;cursor:pointer;
  touch-action:manipulation;transition:transform .18s var(--sair),background-color .2s}
.botao svg{width:1.3rem;height:1.3rem;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.botao:active{transform:scale(.97)}
.primario{background:var(--laranja);color:var(--carvao)}
.primario:hover{background:#F2773F}
.grande{margin-top:1.75rem;min-height:3.75rem;padding-inline:1.75rem;font-size:1.125rem}
.contactos{margin-top:2.25rem;border-top:1px solid var(--linha-e);max-width:40rem}
.contactos a{display:flex;align-items:center;gap:1rem;min-height:3.5rem;padding-block:.6rem;border-bottom:1px solid var(--linha-e);text-decoration:none}
.contactos svg{width:1.4rem;height:1.4rem;fill:none;stroke:var(--laranja);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.contactos .txt{display:grid;gap:.25rem;min-width:0}
.contactos .qual{font:700 .75rem/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--osso-2)}
.contactos .valor{font-weight:600;overflow-wrap:anywhere;text-decoration:underline;text-decoration-color:var(--linha-e);text-underline-offset:.25em}
.contactos a:hover .valor{text-decoration-color:var(--laranja)}

.rodape{padding-block:2.5rem calc(2.5rem + env(safe-area-inset-bottom));border-top:1px solid var(--linha-e);font-size:.9375rem;color:var(--osso-2)}
.rodape .envolver{display:grid;gap:.6rem}
.rodape a{min-height:2.75rem;display:inline-flex;align-items:center;color:var(--osso)}

/* barra fixa no telemóvel: o WhatsApp sempre à mão depois dos quadrados */
.barra{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:.75rem max(var(--gutter),env(safe-area-inset-left)) calc(.75rem + env(safe-area-inset-bottom));
  pointer-events:none;transform:translateY(115%);transition:transform .32s var(--sair)}
.barra.visivel{transform:none}
.barra .botao{width:100%;pointer-events:auto;box-shadow:0 .5rem 1.5rem rgba(20,18,16,.45),0 0 0 3px var(--carvao)}

/* ═══ intro: o ecrã de arranque. Só o JavaScript a mostra (html.intro-vai: 1.ª vez em cada sessão, nunca com movimento
   reduzido; ver o script no <head>); sem ele não existe. O carro passa pelos dois portais e sai transformado; no fim
   aparece a marca e o ecrã sobe para mostrar o site. ═══ */
.intro{display:none;position:fixed;inset:0;z-index:60;grid-template-rows:auto 1fr auto;background:var(--carvao);overflow:hidden;
  transition:transform .55s cubic-bezier(.7,0,.2,1);cursor:pointer}
html.intro-vai{overflow:hidden}
html.intro-vai .intro{display:grid}
.intro.sobe{transform:translateY(-100%)}
.intro-topo{display:flex;align-items:center;justify-content:space-between;gap:1rem;
  padding:calc(.9rem + env(safe-area-inset-top,0px)) max(var(--gutter),env(safe-area-inset-right)) 0 max(var(--gutter),env(safe-area-inset-left));
  font:700 .8125rem/1 var(--mono);letter-spacing:.24em;text-transform:uppercase}
.intro-saltar{min-height:2.75rem;padding:.55rem 1rem;border-radius:999px;border:2px solid rgba(239,234,227,.5);background:transparent;
  cursor:pointer;font:700 .75rem/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--osso)}
/* o palco nunca é mais alto do que metade do ecrã (largura × 300/560); em ecrãs altos pode ser maior */
.intro-palco{align-self:center;width:min(100%,70rem,85vh);margin-inline:auto;padding-inline:var(--gutter);transition:opacity .35s}
@media (min-width:48rem) and (min-height:40rem){.intro-palco{width:min(100%,70rem,110vh)}}
.intro-cena{position:relative;padding-top:2.75rem}
/* o svg deixa ver o que sai do palco: a estrada atravessa o ecrã, o carro entra e sai pelas bordas do ecrã */
.intro-cena svg{display:block;width:100%;height:auto;overflow:visible}
/* os rótulos dos portais ficam por cima do palco; o JavaScript põe-lhes o left conforme o portal anda */
.intro-rot{position:absolute;bottom:calc(100% - 2.5rem);left:200%;transform:translateX(-50%);width:max-content;max-width:9.5rem;text-align:center;
  font:700 .75rem/1.3 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--osso);transition:color .2s;pointer-events:none;text-wrap:balance}
.intro-rot.ativo{color:var(--laranja)}
.intro-legenda{position:relative;min-height:4.5rem;margin-top:1.25rem;text-align:center}
.intro-legenda p{position:absolute;inset:0;opacity:0;transform:translateY(.4rem);transition:opacity .18s,transform .18s}
.intro-legenda p.ativa{opacity:1;transform:none;transition-delay:.16s}
.intro-legenda b{display:block;font:700 .75rem/1 var(--mono);letter-spacing:.3em;color:var(--laranja)}
.intro-legenda span{display:block;margin-top:.55rem;font:600 clamp(1.15rem,3.4vw,1.6rem)/1.25 var(--texto)}
.intro-pe{height:calc(2rem + env(safe-area-inset-bottom,0px))}
.intro-final{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:1.1rem;padding:1rem;text-align:center;
  opacity:0;transition:opacity .4s;pointer-events:none;font:700 .8125rem/1 var(--mono);letter-spacing:.24em;text-transform:uppercase}
.intro-slogan{max-width:12ch;font:400 clamp(2rem,8vw,4.5rem)/.98 var(--display);letter-spacing:0;text-wrap:balance}
.intro-slogan em{font-style:normal;color:var(--laranja)}
.intro.fim .intro-palco{opacity:0}
.intro.fim .intro-final{opacity:1}
@media (prefers-reduced-motion:reduce){.intro{display:none!important}}


/* ═══ consultoria: o herói ao jeito de uma página de produto limpa (rótulo, frase a dois tons, dois botões) com o
   mosaico 3D dos passos à direita. A frase é a da marca: a pergunta a branco, a resposta a laranja ═══ */
.heroi-bg{position:relative;isolation:isolate;overflow-x:clip;background:var(--carvao)}
.heroi-img{position:absolute;inset:0;z-index:-2;width:100%;height:100%;object-fit:cover;object-position:72% 50%}
.heroi-palco{position:relative;isolation:isolate;overflow:hidden}
.heroi-veu{position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:linear-gradient(180deg,rgba(20,18,16,.42) 0%,rgba(20,18,16,.78) 50%,var(--carvao) 100%)}
.heroi-cv{position:absolute;inset:0;z-index:-2;width:100%;height:100%;display:block}
/* scroll to animation: o herói fica preso ao ecrã e o scroll faz avançar o vídeo (só com JavaScript, sem movimento
   reduzido e quando o texto cabe no ecrã; senão fica a imagem parada) */
.heroi-bg.rolo{height:var(--rolo-h,240vh)}
.heroi-bg.rolo .heroi-palco{position:sticky;top:var(--tabs);height:calc(100vh - var(--tabs));height:calc(100svh - var(--tabs))}
.heroi-bg.rolo .heroi{height:100%;min-height:0;padding-block:2rem;display:flex;flex-direction:column;justify-content:center;will-change:opacity,transform}
.heroi{position:relative;padding-block:clamp(2.75rem,9vw,6rem) clamp(2.5rem,7vw,5rem)}
.heroi-e{color:var(--osso-2);letter-spacing:.22em}
.heroi-t{margin-top:1.1rem;max-width:17ch;font:600 clamp(2.15rem,8.4vw,3.6rem)/1.04 var(--texto);letter-spacing:-.035em;text-wrap:balance}
.heroi-pre{color:var(--osso)}
.heroi-grande{display:block;color:var(--laranja)}
.nq{white-space:nowrap}
.heroi-passo{margin-top:1.1rem;font:600 clamp(1.1rem,3.8vw,1.35rem)/1.35 var(--texto)}
.heroi-lead{margin-top:.55rem;max-width:42ch}
.heroi-acoes{display:flex;flex-wrap:wrap;align-items:center;gap:.75rem;margin-top:1.75rem}
.heroi-acoes .grande{margin-top:0}
.botao.contorno{border-color:var(--contorno);color:var(--osso);background:transparent}
.botao.contorno:hover{background:rgba(239,234,227,.08)}
.primario svg{transition:transform .2s var(--sair)} .primario:hover svg{transform:translateX(.2rem)}
.heroi-adere{margin-top:1.75rem;padding-top:1rem;border-top:1px solid var(--linha-e);max-width:38rem;display:flex;gap:.75rem;
  font:600 1.0625rem/1.5 var(--texto);color:var(--osso)}
.heroi-adere::before{content:"";flex:none;width:.5rem;height:.5rem;margin-top:.55em;border-radius:50%;background:var(--laranja)}
.logo{flex:none;width:2.4rem;height:2.4rem}
/* o logótipo inteiro onde vai a marca: cabeçalho, intro, páginas legais e a placa do fundo 3D */
.logo-c{flex:none;display:block;width:3.75rem;height:3.75rem}
@media (min-width:64rem){.topo .logo-c{width:4.5rem;height:4.5rem}}
.intro-topo .logo-c{width:3.25rem;height:3.25rem}
.logo-c.grande{width:clamp(7rem,28vw,10rem);height:clamp(7rem,28vw,10rem)}
.placa.centro .logo-c{width:10.5rem;height:10.5rem}
/* o que faz uma consultoria de IA: uma caixa, três passos */
.caixa-c{margin-top:2rem;padding:clamp(1.25rem,4vw,2.25rem);border-radius:1.25rem;background:var(--carvao);color:var(--osso);
  box-shadow:inset 0 0 0 1px rgba(232,98,44,.55),0 1.5rem 3rem -1.75rem rgba(20,18,16,.6)}
.caixa-c h3{font:700 .8125rem/1.2 var(--mono);letter-spacing:.22em;text-transform:uppercase;color:var(--laranja)}
.c-passos{margin-top:1.4rem;display:grid;gap:1.5rem;counter-reset:cp}
.c-passos li{counter-increment:cp;display:grid;grid-template-columns:auto 1fr;column-gap:1rem;align-items:baseline}
.c-passos li::before{content:counter(cp);grid-row:span 2;font:400 2.4rem/1 var(--display);color:var(--laranja)}
.c-passos h4{font:600 1.1875rem/1.3 var(--texto)}
.c-passos p{margin-top:.35rem;color:var(--osso-2)}
/* mosaico 3D (decoração): plano isométrico com a grelha; placas com espessura; a da marca brilha a laranja */
.mosaico{position:relative;overflow:hidden;pointer-events:none;user-select:none}
.plano{position:absolute;left:50%;top:50%;width:44rem;height:44rem;margin:-22rem 0 0 -22rem;
  transform:scale(var(--esc,.6)) rotateX(56deg) rotateZ(-45deg);
  background-image:linear-gradient(rgba(239,234,227,.1) 1px,transparent 1px),linear-gradient(90deg,rgba(239,234,227,.1) 1px,transparent 1px);
  background-size:5.5rem 5.5rem;background-position:-1px -1px;
  -webkit-mask-image:radial-gradient(closest-side,#000 60%,transparent);mask-image:radial-gradient(closest-side,#000 60%,transparent)}
.placa{position:absolute;width:11rem;height:11rem;display:grid;place-items:center;border-radius:1.5rem;
  background:linear-gradient(135deg,#2B2622,#1B1816);
  box-shadow:inset 0 0 0 1px rgba(239,234,227,.14),-7px 7px 0 #0B0A09,-7px 7px 0 1px rgba(239,234,227,.08),-26px 26px 40px rgba(0,0,0,.55)}
.placa span{display:flex;align-items:center;gap:.6rem;font:700 1.05rem/1.2 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--osso)}
.placa.p1{left:2.5rem;top:5.5rem} .placa.p2{left:30.5rem;top:3rem} .placa.p3{left:3rem;top:30.5rem} .placa.p4{left:30rem;top:29.5rem}
.placa.centro{left:14.25rem;top:14.25rem;width:15.5rem;height:15.5rem;border-radius:1.9rem;
  background:linear-gradient(135deg,#2E241E,#1D1A17);
  box-shadow:inset 0 0 0 1.5px rgba(232,98,44,.85),-10px 10px 0 #5A2611,-10px 10px 0 1.5px rgba(232,98,44,.5),0 0 70px rgba(232,98,44,.38),-36px 36px 60px rgba(0,0,0,.6);
  animation:ps-flutua 5s ease-in-out infinite}
.placa.centro span{font:400 1.3rem/1 var(--display);letter-spacing:.01em;text-transform:none}
@keyframes ps-flutua{0%,100%{translate:0 0}50%{translate:7px -7px}}
.link-seta{display:inline-flex;align-items:center;gap:.5rem;min-height:2.75rem;font:700 .8125rem/1.2 var(--mono);letter-spacing:.14em;
  text-transform:uppercase;color:var(--laranja);text-decoration:none}
.link-seta svg{width:1.1rem;height:1.1rem;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s var(--sair)}

dialog.diag{position:fixed;inset:0;width:100%;height:100%;max-width:none;max-height:none;margin:0;padding:0;border:0;

/* a ficha: papel pontilhado, como os esquemas; cada resposta acende a sua linha */
.diag-ficha{display:none;width:100%;max-width:44rem;margin-inline:auto;padding:1.25rem 1.25rem 1rem;border-radius:1rem;color:#1D2330;
  background:#FAF8F4 radial-gradient(rgba(20,18,16,.12) 1px,transparent 1.2px) 0 0/12px 12px;box-shadow:0 1.5rem 3rem -1.5rem rgba(0,0,0,.8)}

.diag-pe{padding:.8rem max(var(--gutter),env(safe-area-inset-left)) calc(.8rem + env(safe-area-inset-bottom,0px));border-top:1px solid var(--linha-e);

.ia-lista{margin-top:2rem;max-width:48rem;display:grid;gap:1.1rem;counter-reset:frase}

.nota-fonte{margin-top:1rem;max-width:50ch;font-size:.875rem;color:var(--osso-2)}

.cuidado-c .compromissos{margin-top:1.9rem}
.quem-texto{margin-top:1.25rem;max-width:40ch;font-size:clamp(1.125rem,3.6vw,1.375rem);line-height:1.5}

/* ═══ casos reais: de outras empresas, e dito em cada cartão. O último lugar é o nosso, vazio ═══ */
.aviso{margin-top:1.5rem;max-width:52rem;padding:.9rem 1rem;border-left:3px solid var(--laranja);border-radius:0 .75rem .75rem 0;
  background:var(--carvao-2);font-size:.875rem;line-height:1.55;color:var(--osso-2)}
.casos{margin-top:2.25rem;display:grid;gap:1rem}
.caso{display:grid;align-content:start;gap:.95rem;padding:1.25rem 1.15rem 1.15rem;border-radius:1rem;background:var(--carvao-2);
  border:1px solid var(--linha-e);scroll-margin-top:calc(var(--tabs) + .75rem)}
.caso:target{border-color:var(--laranja)}

<script>
/* intro: o carro passa pelos dois portais e sai transformado. Corre uma vez por sessão e nunca com movimento reduzido
   (o <html> só tem .intro-vai nesses casos: ver o script no <head>). Um toque, o botão «Saltar» ou Esc saltam-na. */
(function () {
  var raiz = document.documentElement, intro = document.getElementById('intro');
  if (!intro || !raiz.classList.contains('intro-vai')) return;
  try { sessionStorage.setItem('ps-intro', '1'); } catch (e) {}
  var $ = function (id) { return document.getElementById('intro-' + id); };
  var gc = function (o) { try { if (window.goatcounter && window.goatcounter.count) window.goatcounter.count(o); } catch (e) {} };
  // o resto da página fica inerte enquanto a intro está à frente
  var fora = [].filter.call(document.body.children, function (el) { return el !== intro && el.tagName !== 'SCRIPT'; });
  fora.forEach(function (el) { el.setAttribute('inert', ''); });

  var SVGNS = 'http://www.w3.org/2000/svg', XLINK = 'http://www.w3.org/1999/xlink';
  var W = 560, CHAO = 240, FRENTE = 400, V = 0.6;                     // palco 560×300; a estrada anda 0,6 unidades/ms
  // as três fotografias (recortadas, frente à direita), com o comprimento no palco à escala real (3,95 · 4,82 · 4,60 m)
  var CARROS = [{ f: '/media/intro-1.webp', L: 246 }, { f: '/media/intro-2.webp', L: 300 }, { f: '/media/intro-3.webp', L: 287 }];
  var G1 = 970, G2 = 1510;                                            // onde os portais começam, na estrada
  var T = { entra: 700, lanca: 2650, lancaFim: 3150, marca: 3000, sobe: 3500, fim: 4100 };
  var grupos = [$('cA'), $('cB'), $('cC')];
  var sai = function (p) { return 1 - Math.pow(1 - p, 3); };
  var entra = function (p) { return p * p * p; };
  var lim = function (x) { return Math.max(0, Math.min(1, x)); };
  // riscos de velocidade, atrás do carro quando arranca
  var RISCOS = [-34, -22, -48, -12].map(function (dy, i) {
    var l = document.createElementNS(SVGNS, 'line');
    l.setAttribute('stroke-width', i % 2 ? 1.6 : 2.4); l.setAttribute('y1', CHAO + dy); l.setAttribute('y2', CHAO + dy);
    $('riscos').appendChild(l); return l;
  });

  var legendaAtual = 0, portalAtivo = [null, null];
  function desenhar(t) {
    var d = V * t;                                                    // estrada andada
    var frente = t < T.entra ? -40 + (FRENTE + 40) * sai(t / T.entra)
               : t < T.lanca ? FRENTE : FRENTE + 560 * entra(lim((t - T.lanca) / (T.lancaFim - T.lanca)));
    var g1 = G1 - d, g2 = G2 - d;
    $('rA').setAttribute('width', Math.max(0, g1 + 1000));
    $('rB').setAttribute('x', g1); $('rB').setAttribute('width', Math.max(0, g2 - g1));
    $('rC').setAttribute('x', g2);
    var bob = Math.sin(t / 90) * .35;
    grupos.forEach(function (g) { g.setAttribute('transform', 'translate(' + frente.toFixed(2) + ' ' + (CHAO + bob).toFixed(2) + ')'); });
    $('p1').setAttribute('transform', 'translate(' + g1.toFixed(2) + ' 0)');
    $('p2').setAttribute('transform', 'translate(' + g2.toFixed(2) + ' 0)');
    $('rot1').style.left = (g1 / W * 100) + '%';
    $('rot2').style.left = (g2 / W * 100) + '%';
    $('tracos').setAttribute('stroke-dashoffset', (d + Math.max(0, frente - FRENTE)) % 48);
    // o portal acende enquanto atravessa o carro que revela
    [[g1, CARROS[1].L, 'p1', 'rot1'], [g2, CARROS[2].L, 'p2', 'rot2']].forEach(function (p, i) {
      var ativo = p[0] <= frente + 4 && p[0] >= frente - p[1] - 4;
      if (ativo !== portalAtivo[i]) {
        portalAtivo[i] = ativo;
        var g = $(p[2]), aura = g.querySelector('.aura');
        aura.setAttribute('opacity', ativo ? '1' : '.35'); aura.setAttribute('width', ativo ? 40 : 24); aura.setAttribute('x', ativo ? -20 : -12);
        g.querySelector('.fio').setAttribute('stroke', ativo ? '#FFE3D4' : '#E8622C');
        $(p[3]).classList.toggle('ativo', ativo);
      }
    });
    // a frase muda quando o portal vai a meio do carro
    var n = g2 < frente - CARROS[1].L / 2 ? 2 : g1 < frente - CARROS[0].L / 2 ? 1 : 0;
    if (n !== legendaAtual) {
      $('l' + (legendaAtual + 1)).classList.remove('ativa'); $('l' + (n + 1)).classList.add('ativa'); legendaAtual = n;
    }
    // arranque: riscos atrás do carro
    var pl = lim((t - T.lanca) / (T.lancaFim - T.lanca));
    $('riscos').setAttribute('opacity', pl > 0 ? Math.min(1, pl * 3).toFixed(2) : 0);
    RISCOS.forEach(function (l, i) {
      var tras = frente - CARROS[2].L + 10, comp = 40 + 220 * pl * (1 - i * .15);
      l.setAttribute('x1', (tras - comp).toFixed(1)); l.setAttribute('x2', (tras - 6 - i * 4).toFixed(1));
    });
  }

  var inicio = 0, pedido = 0, fase = '';
  function passo(agora) {
    if (!inicio) inicio = agora;
    var t = agora - inicio;
    desenhar(Math.min(t, T.lancaFim));
    if (t >= T.marca && fase === '') { fase = 'marca'; intro.classList.add('fim'); }
    if (t >= T.sobe && fase === 'marca') { fase = 'sobe'; intro.classList.add('sobe'); }
    if (t >= T.fim) { acabar('vista'); return; }
    pedido = requestAnimationFrame(passo);
  }
  function acabar(como) {
    cancelAnimationFrame(pedido); fase = 'fora';
    raiz.classList.remove('intro-vai'); intro.classList.remove('fim', 'sobe');
    fora.forEach(function (el) { el.removeAttribute('inert'); });
    gc({ path: 'intro/' + como, title: 'intro: ' + como, event: true });
  }
  function saltar(como) {
    if (fase === 'fora' || fase === 'sobe') return;
    cancelAnimationFrame(pedido); fase = 'sobe'; intro.classList.add('sobe');
    setTimeout(function () { acabar(typeof como === 'string' ? como : 'saltada'); }, 560);
  }
  intro.addEventListener('click', saltar);
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape') saltar(); });

  // as fotografias: a intro arranca quando as três estiverem prontas; se demorarem mais de 1,5 s, o site abre sem ela
  var prontas = 0, desistiu = false;
  var limite = setTimeout(function () { desistiu = true; saltar('lenta'); }, 1500);
  CARROS.forEach(function (c, i) {
    var im = new Image();
    im.onload = function () {
      if (desistiu) return;
      var H = c.L * im.naturalHeight / im.naturalWidth, foto = grupos[i].querySelector('image'), sombra = grupos[i].querySelector('ellipse');
      foto.setAttribute('x', -c.L); foto.setAttribute('y', (-H).toFixed(2)); foto.setAttribute('width', c.L); foto.setAttribute('height', H.toFixed(2));
      foto.setAttribute('href', c.f); foto.setAttributeNS(XLINK, 'xlink:href', c.f);
      sombra.setAttribute('cx', -c.L / 2); sombra.setAttribute('rx', (c.L * .47).toFixed(1));
      if (++prontas === CARROS.length) { clearTimeout(limite); desenhar(0); pedido = requestAnimationFrame(passo); }
    };
    im.onerror = function () { if (!desistiu) { desistiu = true; clearTimeout(limite); saltar('erro'); } };
    im.src = c.f;
  });
})();
</script>

<script>
(function () {
  var raiz = document.documentElement;
  raiz.classList.add('js');
  var calmo = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // separador ativo para leitores de ecrã + abrir a automatização apontada pelo endereço
  var tabs = document.querySelectorAll('.tabs a');
  var vistas = document.querySelectorAll('.vista');
  var atual = null;
  // mostra a vista de um alvo (#cazuri, #caso-omega, #a-lead…); rolar = levar o ecrã até lá
  function ir(id, rolar) {
    var alvo = id ? document.getElementById(id) : null;
    var sec = alvo ? (alvo.classList.contains('vista') ? alvo : alvo.closest('.vista')) : null;
    var v = sec ? sec.id : (alvo ? (atual || 'consultanta') : 'consultanta');
    vistas.forEach(function (s) { s.classList.toggle('ativa', s.id === v); });
    tabs.forEach(function (a) {
      if (a.dataset.vista === v) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
    var mudou = atual !== v;
    atual = v;
    if (alvo && alvo.tagName === 'DETAILS') alvo.open = true;
    if (alvo && alvo.tagName === 'DIALOG') { if (alvo.classList.contains('esquema')) abrirEsquema(alvo); return; } // endereço partilhado: #esquema-lead abre o esquema (#diagnostico abre-se mais abaixo)
    if (!rolar) return;
    if (!alvo || alvo === sec) { if (mudou || alvo) window.scrollTo(0, 0); }
    else alvo.scrollIntoView({ block: 'start' });
  }
  function vista() { ir(location.hash.slice(1), !!location.hash); }
  // ligações internas (#…): trocam a vista sem depender do :target, por isso funcionam em qualquer lado
  document.addEventListener('click', function (ev) {
    var a = ev.target.closest && ev.target.closest('a[href^="#"]');
    if (!a || a.hasAttribute('data-esquema') || a.classList.contains('saltar') || a.closest('dialog') || ev.defaultPrevented) return;
    var id = a.getAttribute('href').slice(1);
    if (!id || !document.getElementById(id)) return;
    ev.preventDefault();
    try { history.pushState(null, '', '#' + id); } catch (e) {}
    ir(id, true);
  });
  // esquemas: «Ver o esquema» abre o cartão no meio do ecrã (sem JavaScript, o :target mostra-o na mesma)
  function abrirEsquema(d) {
    if (!d.showModal || d.open) return;
    d.showModal();
    d.scrollTop = 0;
    try {
      if (window.goatcounter && window.goatcounter.count)
        window.goatcounter.count({ path: 'esquema/' + d.id.slice(8), title: 'esquema: ' + d.id.slice(8), event: true });
    } catch (e) {}
  }
  document.addEventListener('click', function (ev) {
    var a = ev.target.closest && ev.target.closest('[data-esquema]');
    if (a) {
      var d = document.getElementById(a.getAttribute('data-esquema'));
      if (d && d.showModal) { ev.preventDefault(); abrirEsquema(d); }
      return;
    }
    var f = ev.target.closest && ev.target.closest('dialog.esquema [data-fechar]');
    if (f) { ev.preventDefault(); f.closest('dialog').close(); }
  });
  document.querySelectorAll('dialog.esquema').forEach(function (d) {
    d.addEventListener('click', function (ev) { if (ev.target === d) d.close(); }); // tocar fora do cartão fecha
    // aberto por um endereço partilhado: ao fechar, fica-se na automação dele, aberta
    d.addEventListener('close', function () {
      if (location.hash === '#' + d.id) location.replace('#a-' + d.id.slice(8));
    });
  });

  // quem chega de um anúncio de sites (utm_content=web-…) entra direto nos Sites, que é o que o anúncio mostrou
  if (!location.hash && /[?&]utm_content=web-/.test(location.search)) { try { history.replaceState(null, '', '#proiecte'); } catch (e) {} }
  window.addEventListener('hashchange', vista);
  vista();

  // revelações ao descer (quadrados e cartões)
  var rvs = document.querySelectorAll('.rv');
  if (!('IntersectionObserver' in window) || calmo) {
    rvs.forEach(function (e) { e.classList.add('vis'); });
  } else {
    var io = new IntersectionObserver(function (es) {
      es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('vis'); io.unobserve(e.target); } });
    }, { rootMargin: '0px 0px -6% 0px' });
    rvs.forEach(function (e) { io.observe(e); });
  }

  // barra fixa: aparece depois do primeiro ecrã, desaparece no contacto
  var barra = document.getElementById('barra'), contacto = document.getElementById('contact');
  var desceu = false, noContacto = false;
  function atualiza() {
    var ver = desceu && !noContacto;
    barra.classList.toggle('visivel', ver);
    if (ver) barra.removeAttribute('inert'); else barra.setAttribute('inert', '');
  }
  window.addEventListener('scroll', function () { desceu = window.scrollY > window.innerHeight * 0.9; atualiza(); }, { passive: true });
  if ('IntersectionObserver' in window) {
    new IntersectionObserver(function (es) { noContacto = es[0].isIntersecting; atualiza(); }).observe(contacto);
  }
})();

/* herói: scroll to animation. O vídeo vem em fotogramas (#heroi-quadros); o scroll escolhe o fotograma e desenha-o no
   canvas. Sem JavaScript, com movimento reduzido ou se o texto não couber no ecrã, fica a imagem parada. */
(function () {
  var bg = document.querySelector('.heroi-bg'), dados = document.getElementById('heroi-quadros');
  if (!bg || !dados || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var palco = bg.querySelector('.heroi-palco'), cv = bg.querySelector('.heroi-cv'), txt = bg.querySelector('.heroi');
  var ctx = cv.getContext('2d'), conjuntos = JSON.parse(dados.textContent), N = conjuntos.d.length;
  var fontes = null, quadros = [], ultimo = -1, pedido = false, ativo = false, todos = false;
  // ficheiros à parte: em file:// (pré-visualização) relativos à pasta da língua; publicado, a partir da raiz do domínio
  var raiz = location.protocol === 'file:' ? (document.documentElement.lang === 'pt-PT' ? '' : '../') : '/';
  function carrega(i) {
    if (quadros[i]) return;
    var im = new Image(); quadros[i] = im; im.decoding = 'async';
    im.onload = function () { im.pronto = true; agenda(); };
    im.src = raiz + fontes[i];
  }
  // ecrã ao alto: o recorte 9:16 (v), feito à medida; deitado: o 16:9 (d)
  function escolhe() {
    if (fontes) return;
    fontes = conjuntos.v && conjuntos.v.length === N && cv.height > cv.width ? conjuntos.v : conjuntos.d;
    carrega(0);
  }
  // com o rolo ativo: o último e o do meio primeiro, depois os outros por ordem
  function carregaTodos() {
    if (todos) return; todos = true;
    [N - 1, N >> 1].concat(fontes.map(function (_, i) { return i; })).forEach(carrega);
  }
  function tabsH() { var t = document.querySelector('.tabs'); return t ? t.offsetHeight : 0; }
  function medir() {
    if (!palco.offsetParent) return false;               // vista escondida
    var alto = window.innerHeight - tabsH();
    var k = txt.children, conteudo = k[k.length - 1].getBoundingClientRect().bottom - k[0].getBoundingClientRect().top;
    var cabe = conteudo + 32 <= alto;
    if (cabe !== ativo) { ativo = cabe; bg.classList.toggle('rolo', cabe); if (!cabe) { txt.style.opacity = ''; txt.style.transform = ''; } }
    var dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    var w = Math.round(palco.clientWidth * dpr), h = Math.round(palco.clientHeight * dpr);
    if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; ultimo = -1; }
    return true;
  }
  function desenha() {
    pedido = false;
    if (!medir()) return;
    escolhe();
    if (ativo) carregaTodos();
    var p = 0;
    if (ativo) {
      var r = bg.getBoundingClientRect(), total = bg.offsetHeight - palco.offsetHeight;
      p = Math.min(1, Math.max(0, (tabsH() - r.top) / total));
      var o = p < .55 ? 1 : Math.max(0, 1 - (p - .55) / .35);
      txt.style.opacity = o; txt.style.transform = 'translateY(' + (-(1 - o) * 40) + 'px)';
    }
    // um fotograma inteiro de cada vez, o mais próximo: fundir dois fotogramas de um zoom desdobra as arestas e o vídeo
    // parece desfocado (visto a 04/10). A fluidez vem de haver muitos fotogramas (1 em cada 2 do vídeo).
    var i = Math.round(p * (N - 1));
    while (i > 0 && !(quadros[i] && quadros[i].pronto)) i--;
    if (!(quadros[i] && quadros[i].pronto) || i === ultimo) return;
    ultimo = i;
    pinta(quadros[i], 1);
  }
  function pinta(im, alfa) {
    var cw = cv.width, ch = cv.height, s = Math.max(cw / im.naturalWidth, ch / im.naturalHeight);
    var dw = im.naturalWidth * s, dh = im.naturalHeight * s, fx = im.naturalWidth > im.naturalHeight && cw <= ch ? .72 : .5; // o recorte v já vem centrado
    ctx.globalAlpha = alfa; ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(im, (cw - dw) * fx, (ch - dh) / 2, dw, dh);
  }
  function agenda() { if (!pedido) { pedido = true; requestAnimationFrame(desenha); } }
  window.addEventListener('scroll', agenda, { passive: true });
  window.addEventListener('resize', function () { ultimo = -1; agenda(); });
  window.addEventListener('hashchange', function () { ultimo = -1; agenda(); });
  document.addEventListener('click', function () { setTimeout(function () { ultimo = -1; agenda(); }, 50); });
  agenda();
})();

/* diagnóstico: «Conhece-nos» abre-o. Uma pergunta por ecrã; a ficha do negócio enche-se ao lado. No fim, a ficha vai
   para o WhatsApp numa mensagem que o próprio visitante envia (nada é guardado). Sem JavaScript, os botões vão ao WhatsApp. */
(function () {
  var d = document.getElementById('diagnostico');
  if (!d || !d.showModal) return;
  var D = JSON.parse(document.getElementById('diag-dados').textContent);
  var palco = document.getElementById('diag-palco'), nEl = document.getElementById('diag-n'), barra = document.getElementById('diag-barra');
  var corpo = d.querySelector('.diag-corpo'), N = D.perguntas.length, LETRAS = 'ABCDEFGHIJ';
  var SETA = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
  var base = 'https://wa.me/', r = {}, passo = -1, comecou = false, vistas = {};
  function gc(o) { try { if (window.goatcounter && window.goatcounter.count) window.goatcounter.count(o); } catch (e) {} }
  function nome() { return (r.nome || '').trim().split(/\s+/)[0]; }
  function txt(s) { return s.replace(/\{nome\}/g, nome()); }
  function el(tag, cls, t) { var e = document.createElement(tag); if (cls) e.className = cls; if (t != null) e.textContent = t; return e; }
  function botao(cls, t, seta) { var b = el('button', 'botao ' + cls, t); b.type = 'button'; if (seta) b.insertAdjacentHTML('beforeend', SETA); return b; }
  function valor(v) { return Array.isArray(v) ? v.join(', ') : v; }
  function ficha() {
    D.perguntas.forEach(function (q) {
      var linha = d.querySelector('#diag-ficha [data-id="' + q.id + '"]'), v = r[q.id];
      linha.classList.toggle('ok', v != null && v !== '');
      linha.querySelector('dd').textContent = v != null && v !== '' ? valor(v) : '—';
    });
  }
  function progresso() {
    var feito = Math.max(0, Math.min(passo, N));
    nEl.textContent = (feito < 10 ? '0' : '') + feito;
    barra.style.width = (feito / N * 100) + '%';
  }
  function erro(t) { var p = palco.querySelector('.diag-erro'); if (!p) { p = el('p', 'diag-erro'); p.setAttribute('role', 'alert'); palco.appendChild(p); } p.textContent = t; }
  function mostrar() {
    palco.innerHTML = ''; corpo.scrollTop = 0; progresso(); ficha();
    d.classList.toggle('fim', passo >= N);
    if (passo < 0) return intro();
    if (passo >= N) return fim();
    var q = D.perguntas[passo];
    if (!vistas[passo]) { vistas[passo] = true; var nn = (passo + 1 < 10 ? '0' : '') + (passo + 1); gc({ path: 'diagnostico/pergunta-' + nn + '-' + q.id, title: 'diagnóstico: pergunta ' + nn + ' (' + q.id + ')', event: true }); }
    palco.appendChild(el('p', 'diag-meta', D.pergunta + ' ' + (passo + 1 < 10 ? '0' : '') + (passo + 1) + ' / ' + (N < 10 ? '0' : '') + N));
    var h = el('h3', 'diag-q', txt(q.msg)); h.id = 'diag-q'; palco.appendChild(h);
    var acoes = el('div', 'diag-acoes'), seg = botao('primario', q.tipo === 'opcoes' ? D.seguinte : D.seguinte, true);
    seg.id = 'diag-seg';
    var ant = botao('contorno', D.anterior); ant.id = 'diag-ant';
    ant.addEventListener('click', function () { passo--; mostrar(); });
    if (q.tipo === 'texto' || q.tipo === 'tel') {
      var c = el('div', 'diag-campo'), lab = el('label', null, q.rotulo), inp = el('input');
      lab.htmlFor = 'diag-in'; inp.id = 'diag-in'; inp.type = q.tipo === 'tel' ? 'tel' : 'text';
      inp.placeholder = q.ph || ''; inp.autocomplete = q.id === 'nome' ? 'name' : q.tipo === 'tel' ? 'tel' : 'off';
      inp.value = r[q.id] || '';
      c.appendChild(lab); c.appendChild(inp); palco.appendChild(c);
      var ir = function () {
        var v = inp.value.trim();
        if (v.replace(/[^\p{L}\p{N}]/gu, '').length < 2) { erro(D.obrigatorio); inp.focus(); return; }
        r[q.id] = v; passo++; mostrar();
      };
      inp.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') { ev.preventDefault(); ir(); } });
      seg.addEventListener('click', ir);
      setTimeout(function () { inp.focus({ preventScroll: true }); }, 30);
    } else {
      var multi = q.tipo === 'multi', box = el('div', 'diag-ops'), campo = null;
      box.setAttribute('role', 'group'); box.setAttribute('aria-labelledby', 'diag-q');
      var antes = [].concat(r[q.id] || []);
      // «Outro»: abre um campo para escrever o que melhor descreve o negócio (a resposta guardada é o texto escrito)
      var proprio = !multi && q.outro && r[q.id] && q.opcoes.indexOf(r[q.id]) < 0 ? r[q.id] : '';
      function abreOutro(v) {
        if (!campo) {
          campo = el('div', 'diag-campo diag-outro');
          var lab = el('label', null, q.outro_rotulo), inp = el('input');
          lab.htmlFor = 'diag-in'; inp.id = 'diag-in'; inp.type = 'text'; inp.placeholder = q.outro_ph || ''; inp.value = v || '';
          inp.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') { ev.preventDefault(); seg.click(); } });
          campo.appendChild(lab); campo.appendChild(inp); box.parentNode.insertBefore(campo, box.nextSibling);
        }
        setTimeout(function () { campo.querySelector('input').focus({ preventScroll: true }); }, 30);
      }
      q.opcoes.forEach(function (o, i) {
        var b = el('button', 'diag-op'); b.type = 'button';
        b.innerHTML = '<kbd aria-hidden="true">' + LETRAS[i] + '</kbd><span></span>'; b.querySelector('span').textContent = o;
        b.setAttribute('aria-pressed', antes.indexOf(o) > -1 || (proprio && o === q.outro) ? 'true' : 'false');
        b.addEventListener('click', function () {
          if (multi) { b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') === 'true' ? 'false' : 'true'); return; }
          box.querySelectorAll('.diag-op').forEach(function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
          if (q.outro && o === q.outro) { abreOutro(''); return; }
          if (campo) { campo.remove(); campo = null; }
          r[q.id] = o; setTimeout(function () { passo++; mostrar(); }, 180);
        });
        box.appendChild(b);
      });
      palco.appendChild(box);
      if (proprio) abreOutro(proprio);
      seg.addEventListener('click', function () {
        var esc = [].map.call(box.querySelectorAll('[aria-pressed="true"] span'), function (s) { return s.textContent; });
        if (!esc.length) { erro(D.escolhe); return; }
        if (campo) {
          var v = campo.querySelector('input').value.trim();
          if (v.replace(/[^\p{L}\p{N}]/gu, '').length < 2) { erro(D.obrigatorio); campo.querySelector('input').focus(); return; }
          r[q.id] = v; passo++; mostrar(); return;
        }
        r[q.id] = multi ? esc : esc[0]; passo++; mostrar();
      });
      if (!proprio) setTimeout(function () { box.querySelector('button').focus({ preventScroll: true }); }, 30);
    }
    if (passo > 0) acoes.appendChild(ant);
    acoes.appendChild(seg);
    palco.appendChild(acoes);
  }
  function intro() {
    palco.appendChild(el('p', 'diag-meta', D.meta));
    var h = el('h3', 'diag-q', D.intro_t); h.id = 'diag-q'; palco.appendChild(h);
    palco.appendChild(el('p', 'diag-txt', D.abertura[0]));
    var acoes = el('div', 'diag-acoes'), b = botao('primario', D.comecar, true);
    b.id = 'diag-comecar'; b.addEventListener('click', function () { gc({ path: 'diagnostico/comecou', title: 'diagnóstico: começou', event: true }); passo = 0; mostrar(); });
    acoes.appendChild(b); palco.appendChild(acoes);
    setTimeout(function () { b.focus({ preventScroll: true }); }, 30);
  }
  function fim() {
    gc({ path: 'diagnostico/fim', title: 'diagnóstico: fim', event: true });
    palco.appendChild(el('p', 'diag-meta', D.meta));
    var h = el('h3', 'diag-q', txt(D.fim[0])); h.id = 'diag-q'; palco.appendChild(h);
    palco.appendChild(el('p', 'diag-txt', txt(D.fim[1])));
    var linhas = D.perguntas.map(function (q) { return '• ' + q.wa + ': ' + valor(r[q.id]); });
    var a = el('a', 'botao primario', D.enviar); a.rel = 'noopener'; a.id = 'diag-enviar';
    a.href = base + '?text=' + encodeURIComponent(D.wa_intro + '\n' + linhas.join('\n'));
    a.insertAdjacentHTML('beforeend', SETA);
    a.addEventListener('click', function () {
      gc({ path: 'diagnostico/enviado', title: 'diagnóstico: enviado para o WhatsApp', event: true });
      try { if (window.fbq) window.fbq('track', 'Lead', { origem: 'diagnostico', faturacao: r.faturacao || '' }); } catch (e) {}
    });
    var b = botao('contorno', D.recomecar); b.addEventListener('click', function () { r = {}; passo = 0; mostrar(); });
    var acoes = el('div', 'diag-acoes'); acoes.appendChild(a); acoes.appendChild(b); palco.appendChild(acoes);
    setTimeout(function () { a.focus({ preventScroll: true }); }, 30);
  }
  // teclas A, B, C… escolhem a opção (fora dos campos de texto)
  d.addEventListener('keydown', function (ev) {
    if (ev.target.tagName === 'INPUT' || ev.ctrlKey || ev.metaKey || ev.altKey) return;
    var i = LETRAS.indexOf((ev.key || '').toUpperCase());
    var ops = palco.querySelectorAll('.diag-op');
    if (ev.key && ev.key.length === 1 && i > -1 && i < ops.length) { ev.preventDefault(); ops[i].click(); ops[i].focus(); }
  });
  function abrir(a) {
    if (a) base = a.href.split('?')[0];
    if (!d.open) d.showModal();
    if (!comecou) { comecou = true; mostrar(); }
    gc({ path: 'diagnostico/aberto', title: 'diagnóstico: aberto', event: true });
  }
  document.addEventListener('click', function (ev) {
    var a = ev.target.closest && ev.target.closest('[data-diagnostico]');
    if (a) { ev.preventDefault(); abrir(a); return; }
    if (ev.target.closest && ev.target.closest('[data-fechar-diag]')) d.close();
  });
  // ligação direta, para os anúncios: #diagnostico ou ?utm_content=diag-… abre o diagnóstico logo ao chegar
  var cta = document.querySelector('[data-diagnostico]');
  if (location.hash === '#diagnostico' || /[?&]utm_content=diag-/.test(location.search)) abrir(cta);
  window.addEventListener('hashchange', function () { if (location.hash === '#diagnostico') abrir(cta); });
  d.addEventListener('close', function () {
    if (location.hash === '#diagnostico') try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
  });
})();

/* medição: GoatCounter sempre (sem cookies). O pixel da Meta carrega sozinho, sem faixa (decisão do Tomás, 04/10); o
   aviso está no rodapé e na página Cookies, onde se desliga. Desligado (ps-consentimento = nao) ou com o sinal GPC
   do navegador, nunca carrega. */
(function () {
  'use strict';
  var PIXEL = '{{PIXEL}}';
  var CHAVE = 'ps-consentimento';
  function gc(o) { try { if (window.goatcounter && window.goatcounter.count) window.goatcounter.count(o); } catch (e) {} }

  // leituras do QR do cartão (/C → /?origem=cartao), contadas à parte
  if (/[?&]origem=cartao\b/.test(location.search)) {
    window.addEventListener('load', function () { gc({ path: 'qr/cartao', title: 'QR do cartão', event: true }); });
  }
  // tipos de negócio abertos, contados à parte: mostra o que interessa a quem visita
  document.querySelectorAll('details.setor').forEach(function (d) {
    d.addEventListener('toggle', function () {
      if (d.open) gc({ path: 'setor/' + d.id.slice(2), title: 'tipo de negócio: ' + d.id.slice(2), event: true });
    });
  });
  // casos abertos na fonte original: mostra quais interessam
  document.querySelectorAll('.caso .fonte').forEach(function (a) {
    a.addEventListener('click', function () { var c = a.closest('.caso'); gc({ path: 'caso/' + c.id.slice(5), title: 'caso: ' + c.id.slice(5), event: true }); });
  });
  // saídas para o WhatsApp e o telefone
  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a[href^="https://wa.me"]:not([data-diagnostico]):not(#diag-enviar), a[href^="tel:"]');
    if (!a) return;
    var canal = a.getAttribute('href').indexOf('wa.me') > -1 ? 'whatsapp' : 'telefone';
    gc({ path: 'ir/' + canal, title: 'saída: ' + canal, event: true });
    try { if (window.fbq) window.fbq('track', 'Contact', { canal: canal }); } catch (err) {}
  }, { passive: true });

  function ligarPixel() {
    if (!PIXEL || window.fbq) return;
    !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
    n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}
    (window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
    window.fbq('init', PIXEL);
    window.fbq('track', 'PageView');
  }
  var resposta = null;
  try { resposta = localStorage.getItem(CHAVE); } catch (e) {}
  if (PIXEL && resposta !== 'nao' && !navigator.globalPrivacyControl) ligarPixel();
})();
</script>
